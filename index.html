<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Jost:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6dbc7;
    --surface: #f4ede0;
    --ink: #062b8a;
    --muted: #4a6ab8;
    --accent: #062b8a;
    --accent-ink: #f4ede0;
    --line: rgba(6, 43, 138, .16);
    --line-strong: rgba(6, 43, 138, .38);
    --font-display: "EB Garamond", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --font-text: "Jost", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-text);
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px;
  }
  .app {
    width: 100%; max-width: 660px; background: var(--surface);
    border-radius: 24px; box-shadow: 0 1px 2px rgba(6,43,138,.06), 0 24px 60px rgba(6,43,138,.14);
    overflow: hidden;
  }
  .stage { padding: 44px 44px 40px; }
  .progress-wrap { height: 4px; background: var(--line); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .4s cubic-bezier(.22,.61,.36,1); }

  .kicker {
    font-size: 12px; letter-spacing: .28em; color: var(--accent); text-transform: uppercase;
    font-weight: 600; margin-bottom: 14px; font-family: var(--font-text);
  }
  h1, .result-name {
    font-family: var(--font-display); font-weight: 500; color: var(--ink);
    letter-spacing: -.01em; line-height: 1.18;
  }
  h1 { font-size: 40px; margin-bottom: 16px; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.8; max-width: 40em; }
  .sub b { color: var(--ink); font-weight: 600; }
  .tag {
    display: inline-block; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
    font-size: 12px; margin: 2px 4px 2px 0; letter-spacing: .02em;
  }

  .q-num { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-family: var(--font-text); }
  .dim-tag {
    float: right; font-size: 12px; color: var(--accent-ink); background: var(--accent);
    border-radius: 999px; padding: 2px 11px; letter-spacing: .04em;
  }
  .question {
    font-family: var(--font-display); font-weight: 500; font-size: 26px;
    line-height: 1.35; margin-bottom: 28px; color: var(--ink); letter-spacing: -.005em;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--line); border-radius: 16px; padding: 17px 20px;
    cursor: pointer; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    background: #fff; text-align: left; font-size: 15.5px; line-height: 1.55; color: var(--ink);
  }
  .option:hover {
    border-color: var(--line-strong); transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(6,43,138,.08);
  }
  .option:active { transform: translateY(0); }
  .option .letter {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg); color: var(--accent); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; font-family: var(--font-text);
    transition: background .16s ease, color .16s ease;
  }
  .option:hover .letter { border-color: var(--accent); }
  .option.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .option.selected .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: .06em;
    font-family: var(--font-text); transition: transform .14s ease, box-shadow .14s ease, opacity .18s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(6,43,138,.22); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
  .footer-nav { margin-top: 24px; display: flex; gap: 12px; }
  .ghost {
    flex: 1; padding: 14px; border: 1px solid var(--line); border-radius: 14px;
    background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
    font-family: var(--font-text); transition: border-color .16s ease, color .16s ease;
  }
  .ghost:hover { border-color: var(--accent); color: var(--ink); }

  .result-head { text-align: center; }
  .avatar {
    position: relative; overflow: hidden;
    width: 124px; height: 124px; border-radius: 50%;
    background: var(--bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px; box-shadow: 0 12px 32px rgba(6,43,138,.18);
  }
  .avatar img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%; display: none;
  }
  .avatar .char-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 52px; font-weight: 500;
  }
  .match-pct { color: var(--accent); font-weight: 700; font-size: 20px; font-family: var(--font-text); }
  .result-name { font-size: 40px; margin: 8px 0 4px; }
  .result-title { color: var(--muted); font-size: 15px; font-family: var(--font-text); }
  .region-label {
    display: inline-block; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 13px; font-size: 12px; margin-top: 12px;
  }
  .quote { text-align: center; margin-top: 28px; }
  .quote-text {
    font-family: var(--font-display); font-size: 24px; font-weight: 500; line-height: 1.5;
    color: var(--ink); letter-spacing: -.005em;
  }
  .quote-text::before { content: "「"; color: var(--accent); }
  .quote-text::after { content: "」"; color: var(--accent); }
  .quote-src { color: var(--muted); font-size: 13px; margin-top: 10px; font-family: var(--font-text); }
  .intro {
    margin-top: 22px; text-align: left; background: var(--bg);
    border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0;
    padding: 16px 18px; font-size: 14px; line-height: 1.75; color: var(--ink);
  }
  .desc {
    margin-top: 16px; text-align: left; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; font-size: 15px; line-height: 1.8; color: var(--ink);
  }
  .rank { margin-top: 26px; text-align: left; }
  .rank h3 {
    font-family: var(--font-text); font-size: 13px; color: var(--muted);
    margin-bottom: 14px; letter-spacing: .1em; font-weight: 600; text-transform: uppercase;
  }
  .rank-item { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .rank-item .name { width: 108px; font-weight: 600; font-size: 14px; font-family: var(--font-text); }
  .rank-bar { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .rank-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.22,.61,.36,1); }
  .rank-item .pct { width: 46px; text-align: right; font-size: 13px; color: var(--muted); font-family: var(--font-text); }
  .hidden { display: none !important; }

  .fade-in { animation: fadeIn .45s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }

  @media (max-width: 560px) {
    body { padding: 12px; align-items: flex-start; }
    .app { border-radius: 18px; }
    .stage { padding: 28px 22px 26px; }
    h1 { font-size: 32px; }
    .question { font-size: 22px; }
    .result-name { font-size: 32px; }
    .quote-text { font-size: 21px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="stage" id="intro">
      <div class="kicker">历史人格测试</div>
      <h1>你像哪位东亚历史人物？</h1>
      <p class="sub">收录 <b>1800 年以后</b>的 <b>200 位东亚历史人物</b>（中国 · 日本 · 韩国 · 朝鲜 · 蒙古 · 台湾），从<span class="tag">经济政治倾向</span><span class="tag">国际与外交观</span><span class="tag">价值取向</span><span class="tag">行事方式</span><span class="tag">性格气质</span>五个维度、共 <b>70 道题</b>，测出与你最相似的那一位。</p>
      <div style="margin-top:28px">
        <button class="btn" onclick="startQuiz()">开始测试（70 题）</button>
      </div>
    </div>

    <div class="stage hidden" id="quiz">
      <div class="q-num"><span id="qNumText"></span><span class="dim-tag" id="dimTag"></span></div>
      <div class="question" id="qText"></div>
      <div class="options" id="qOptions"></div>
      <div class="footer-nav">
        <button class="ghost hidden" id="prevBtn" onclick="prevQuestion()">上一题</button>
        <button class="ghost" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
      </div>
    </div>

    <div class="stage hidden" id="result">
      <div class="result-head fade-in">
        <div class="kicker">测试结果</div>
        <div class="avatar" id="rAvatar"><span class="char-fallback" id="rChar"></span><img id="rImg" alt="" referrerpolicy="no-referrer"></div>
        <div>你与 <span class="match-pct" id="rPct"></span> 相似</div>
        <div class="result-name" id="rName"></div>
        <div class="result-title" id="rTitle"></div>
        <div><span class="region-label" id="rRegion"></span></div>
      </div>
      <div class="quote fade-in"><div class="quote-text" id="rQuote"></div><div class="quote-src" id="rQuoteSrc"></div></div>
      <div class="intro fade-in" id="rIntro"></div>
      <div class="desc fade-in" id="rDesc"></div>
      <div class="rank fade-in">
        <h3>完整排名（前 6 位）</h3>
        <div id="rRank"></div>
      </div>
      <div style="margin-top:26px; display:flex; gap:12px">
        <button class="btn" onclick="restart()">重新测试</button>
      </div>
    </div>
  </div>

let current = 0;
let scores = {};
let answers = [];

function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0; scores = {}; answers = [];
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qNumText').textContent = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('dimTag').textContent = DIMS[q.d];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressBar').style.width = `${(current/questions.length)*100}%`;

  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'option' + (answers[current] === i ? ' selected' : '');
    el.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt.t}</span>`;
    el.onclick = () => selectOption(i);
    box.appendChild(el);
  });

  document.getElementById('prevBtn').classList.toggle('hidden', current === 0);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === questions.length - 1 ? '查看结果' : '下一题';
  nextBtn.disabled = answers[current] === undefined;
}

function selectOption(i) {
  answers[current] = i;
  document.getElementById('nextBtn').disabled = false;
  document.querySelectorAll('#qOptions .option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

function nextQuestion() {
  if (answers[current] === undefined) return;
  if (current < questions.length - 1) { current++; renderQuestion(); }
  else showResult();
}

function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }

function showResult() {
  const total = {};
  const excluded = new Set();
  answers.forEach((ans, qi) => {
    const opt = questions[qi].options[ans];
    const s = opt.s;
    for (const id in s) total[id] = (total[id] || 0) + s[id];
    if (opt.exclude) opt.exclude.forEach(id => excluded.add(id));
  });

  const ranked = Object.keys(total)
    .filter(id => !excluded.has(id))
    .map(id => ({ id, score: total[id] }))
    .sort((a,b) => b.score - a.score);

  const top = ranked[0];
  const maxScore = top.score;
  const f = figures[top.id];

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('rChar').textContent = f.char;
  const imgEl = document.getElementById('rImg');
  if (f.img) {
    imgEl.src = f.img;
    imgEl.onload = () => { imgEl.style.display = 'block'; };
    imgEl.onerror = () => { imgEl.style.display = 'none'; };
  }
  document.getElementById('rName').textContent = f.name;
  document.getElementById('rTitle').textContent = f.title;
  document.getElementById('rQuote').textContent = f.quote;
  document.getElementById('rQuoteSrc').textContent = '—— ' + f.name;
  document.getElementById('rIntro').textContent = f.intro;
  document.getElementById('rDesc').textContent = f.desc;
  document.getElementById('rPct').textContent = '100%';
  document.getElementById('rRegion').textContent = f.nation + ' · ' + f.title;

  const rankBox = document.getElementById('rRank');
  rankBox.innerHTML = '';
  ranked.slice(0, 6).forEach((r, i) => {
    const pct = Math.round((r.score / maxScore) * 100);
    const rf = figures[r.id];
    rankBox.innerHTML += `
      <div class="rank-item">
        <div class="name">${i===0?'★ ':''}${rf.name}</div>
        <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
      </div>`;
  });
}

function restart() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
}
