<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你像哪位东亚历史人物？</title>
<style>
  :root {
    --bg1: #1a1c2c;
    --bg2: #2b2e4a;
    --card: #ffffff;
    --ink: #2a2d3e;
    --muted: #8a8fa3;
    --accent: #c9a227;
    --accent2: #7c5cd6;
    --bar-bg: #eef0f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: var(--ink);
  }
  .app {
    width: 100%; max-width: 680px; background: var(--card);
    border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden;
  }
  .stage { padding: 36px 36px 30px; }
  .progress-wrap { height: 6px; background: var(--bar-bg); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: width .35s ease; }
  .kicker { font-size: 12px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  h1 { font-size: 26px; line-height: 1.35; margin-bottom: 12px; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.7; }
  .tag { display: inline-block; background: #f4efe0; color: #a8841a; border-radius: 999px; padding: 4px 12px; font-size: 12px; margin: 2px 4px 2px 0; }

  .q-num { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .dim-tag { float: right; font-size: 12px; color: #fff; background: var(--accent2); border-radius: 999px; padding: 2px 10px; }
  .question { font-size: 19px; font-weight: 700; line-height: 1.5; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex; align-items: center; gap: 14px; border: 2px solid var(--bar-bg);
    border-radius: 14px; padding: 15px 18px; cursor: pointer; transition: all .18s ease;
    background: #fff; text-align: left; font-size: 15px; line-height: 1.5;
  }
  .option:hover { border-color: var(--accent2); transform: translateY(-1px); }
  .option .letter {
    flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--bar-bg);
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; transition: all .18s ease;
  }
  .option:hover .letter, .option.selected .letter { background: var(--accent2); color: #fff; }
  .option.selected { border-color: var(--accent2); }
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(90deg, var(--accent2), var(--accent)); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: opacity .18s ease;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .footer-nav { margin-top: 20px; display: flex; gap: 12px; }
  .ghost { flex: 1; padding: 13px; border: 2px solid var(--bar-bg); border-radius: 14px; background: #fff; color: var(--muted); font-size: 14px; cursor: pointer; }
  .ghost:hover { border-color: var(--accent2); color: var(--ink); }

  .result-head { text-align: center; }
  .avatar {
    width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff; font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px; box-shadow: 0 12px 30px rgba(124,92,214,.35);
  }
  .match-pct { color: var(--accent); font-weight: 800; font-size: 22px; }
  .result-name { font-size: 30px; font-weight: 800; margin: 6px 0; }
  .result-title { color: var(--muted); font-size: 15px; }
  .region-label { display: inline-block; background: #f4efe0; color: #a8841a; border-radius: 999px; padding: 3px 12px; font-size: 12px; margin-top: 10px; }
  .desc { margin-top: 18px; text-align: left; background: #faf9f5; border-radius: 14px; padding: 18px 20px; font-size: 15px; line-height: 1.8; }
  .rank { margin-top: 22px; text-align: left; }
  .rank h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; letter-spacing: 1px; }
  .rank-item { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .rank-item .name { width: 96px; font-weight: 700; font-size: 14px; }
  .rank-bar { flex: 1; height: 14px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; }
  .rank-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 999px; transition: width .6s ease; }
  .rank-item .pct { width: 44px; text-align: right; font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
</style>
</head>
<body>
  <div class="app">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="stage" id="intro">
      <div class="kicker">历史人格测试</div>
      <h1>你像哪位东亚历史人物？</h1>
      <p class="sub">收录 <b>1800 年以后</b>的 <b>50 位东亚历史人物</b>（中国 · 日本 · 韩国 · 朝鲜 · 蒙古 · 台湾），从<span class="tag">经济政治倾向</span><span class="tag">国际法态度</span><span class="tag">行事方式</span><span class="tag">性格</span>四个维度、共 <b>60 道题</b>，测出与你最相似的那一位。</p>
      <div style="margin-top:28px">
        <button class="btn" onclick="startQuiz()">开始测试（60 题）</button>
      </div>
    </div>

    <div class="stage hidden" id="quiz">
      <div class="q-num"><span id="qNumText"></span><span class="dim-tag" id="dimTag"></span></div>
      <div class="question" id="qText"></div>
      <div class="options" id="qOptions"></div>
      <div class="footer-nav">
        <button class="ghost hidden" id="prevBtn" onclick="prevQuestion()">上一题</button>
        <button class="ghost" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
      </div>
    </div>

    <div class="stage hidden" id="result">
      <div class="result-head fade-in">
        <div class="kicker">测试结果</div>
        <div class="avatar" id="rAvatar"></div>
        <div>你与 <span class="match-pct" id="rPct"></span> 相似</div>
        <div class="result-name" id="rName"></div>
        <div class="result-title" id="rTitle"></div>
        <div><span class="region-label" id="rRegion"></span></div>
      </div>
      <div class="desc fade-in" id="rDesc"></div>
      <div class="rank fade-in">
        <h3>完整排名（前 6 位）</h3>
        <div id="rRank"></div>
      </div>
      <div style="margin-top:26px; display:flex; gap:12px">
        <button class="btn" onclick="restart()">重新测试</button>
      </div>
    </div>
  </div>

<script>
const figures = {
  lin:    { name:"林则徐",   char:"林", nation:"中国", title:"禁烟名臣", desc:"你刚正不阿、忧国忧民，敢于在列强环伺下挺身而出、捍卫国家尊严。你坚定而有骨气，宁可玉碎不为瓦全，是那种在民族危难时挺身担当的人。" },
  zeng:   { name:"曾国藩",   char:"曾", nation:"中国", title:"湘军统帅·理学名臣", desc:"你沉稳坚韧、讲求实际，以「拙诚」立身，靠毅力与用人成就事业。你重视秩序与传统，深谋远虑、进退有度，是乱世中能成大事的实干家。" },
  hong:   { name:"洪秀全",   char:"洪", nation:"中国", title:"太平天国天王", desc:"你满怀宗教式的理想与激情，敢于推翻旧秩序、建立心中的天国。你信念狂热、号召力强，但也易走向极端，是那种为理想不惜一切的变革者。" },
  zuo:    { name:"左宗棠",   char:"左", nation:"中国", title:"收复新疆名臣", desc:"你刚烈强硬、胆识过人，认准的事就一往无前。你重视民族尊严与疆土完整，敢于与强敌针锋相对，是铁骨铮铮的实干派。" },
  li:     { name:"李鸿章",   char:"李", nation:"中国", title:"洋务重臣", desc:"你精于实务与权谋，懂得在列强夹缝中周旋、以夷制夷。你务实而隐忍，背负骂名也顾全大局，是乱世中无奈的斡旋者。" },
  cixi:   { name:"慈禧太后", char:"禧", nation:"中国", title:"晚清女主", desc:"你深谙权术、掌控欲强，善于在复杂的宫廷与朝局中维系自己的权力。你精明而多疑，把权力与稳定看得极重，是铁腕的秩序维护者。" },
  zhang:  { name:"张之洞",   char:"张", nation:"中国", title:"中体西用名臣", desc:"你稳健务实，主张「中学为体、西学为用」，在守成与变革间寻找平衡。你重视教育与实业，是渐进改良、脚踏实地的建设者。" },
  kang:   { name:"康有为",   char:"康", nation:"中国", title:"维新变法领袖", desc:"你理想宏大、热血激昂，渴望以一场自上而下的变法让国家迅速富强。你敢于上书言事、挑战旧制，是充满理想与使命感的改革者。" },
  liang:  { name:"梁启超",   char:"梁", nation:"中国", title:"启蒙思想家", desc:"你才思敏捷、笔耕不辍，善于吸收新思想又不断反思调整。你相信启发民智、循序渐进，是温和而富有远见的启蒙者。" },
  yuan:   { name:"袁世凯",   char:"袁", nation:"中国", title:"北洋领袖", desc:"你精于权谋、手腕高超，善于在乱局中审时度势、把握机会。你重实力与实效、野心勃勃，是现实主义与机会主义的化身。" },
  sun:    { name:"孙中山",   char:"孙", nation:"中国", title:"革命先行者", desc:"你百折不挠、理想坚定，以「民族、民权、民生」为纲，毕生为推翻帝制、建立共和而奔走。你开放包容、矢志不渝，是纯粹的理想主义者。" },
  chen:   { name:"陈独秀",   char:"陈", nation:"中国", title:"新文化运动旗手", desc:"你思想激进、锋芒毕露，敢于向旧传统开战、开辟新路。你激情四射、特立独行，是那种为理想与主义不惜牺牲的先行者。" },
  luxun:  { name:"鲁迅",     char:"鲁", nation:"中国", title:"民族魂·文学巨匠", desc:"你冷峻犀利、独立思考，用笔作匕首解剖国民性。你愤世嫉俗又心怀大爱，宁折不弯、绝不同流合污，是清醒而孤独的批判者。" },
  hu:     { name:"胡适",     char:"胡", nation:"中国", title:"自由主义知识分子", desc:"你理性温和、崇尚自由与渐进，主张「多研究些问题，少谈些主义」。你宽容、重实证、讲逻辑，是理性的改良主义者。" },
  jiang:  { name:"蒋介石",   char:"蒋", nation:"中国", title:"国民革命军统帅", desc:"你意志坚定、顽强不屈，坚信唯有统一与强军才能救国。你重秩序、讲纪律、善用权谋，是乱世中强硬而坚韧的民族主义者。" },
  mao:    { name:"毛泽东",   char:"毛", nation:"中国", title:"革命领袖", desc:"你理想热忱、意志如铁，怀有改天换地的雄心。你看重群众动员与斗争，敢于打破一切旧框架，越挫越勇、绝不屈服，是彻底的革命者。" },
  zhou:   { name:"周恩来",   char:"周", nation:"中国", title:"人民的总理", desc:"你温文尔雅、精明干练，善于协调各方、化解矛盾。你务实而顾全大局，把个人荣辱置于事业之下，是深孚众望的调和者与实干家。" },
  song:   { name:"宋庆龄",   char:"宋", nation:"中国", title:"国母·和平主义者", desc:"你温婉坚定、心怀大爱，毕生为和平、民主与妇女儿童事业奔走。你理想主义而立场鲜明，是道义与仁爱的化身。" },
  deng:   { name:"邓小平",   char:"邓", nation:"中国", title:"改革开放总设计师", desc:"你务实灵活、深谋远虑，相信发展才是硬道理。你「摸着石头过河」，用渐进改革与制度设计化解难题，是稳中求进、能屈能伸的改革者。" },
  zhangxueliang:{ name:"张学良", char:"良", nation:"中国", title:"少帅", desc:"你性情率真、重情重义，在历史关头以「西安事变」的兵谏扭转时局。你意气用事又心怀民族大义，是敢作敢当、亦正亦奇的性情中人。" },
  gu:     { name:"顾维钧",   char:"顾", nation:"中国", title:"民国第一外交家", desc:"你温文尔雅、精通国际法，坚信外交与规则的力量。你在巴黎和会上据理力争，是把国家尊严寄于国际舞台的理性外交家。" },
  jing:   { name:"蒋经国",   char:"经", nation:"台湾", title:"台湾建设者", desc:"你务实勤政、亲民低调，推动经济腾飞又在晚年开放党禁、开启民主。你循序渐进、重视民生，是稳健而开明的现代化推动者。" },
  xixiang:{ name:"西乡隆盛", char:"西", nation:"日本", title:"最后的武士", desc:"你刚烈忠义、热血豪迈，坚守武士道精神，为理想不惜一死。你宁折不弯、坦荡磊落，是悲壮而纯粹的武士。" },
  longma: { name:"坂本龙马", char:"坂", nation:"日本", title:"维新志士", desc:"你开朗豁达、眼光超前，善于在敌对势力间斡旋、促成联合。你胸襟开阔、不囿于门户，是理想与行动兼备的开路人。" },
  fuze:   { name:"福泽谕吉", char:"福", nation:"日本", title:"启蒙之父", desc:"你理性独立、锐意进取，主张「脱亚入欧」、以科学与文明立国。你崇尚独立自尊与实学，是眼光远大的启蒙思想家。" },
  ito:    { name:"伊藤博文", char:"伊", nation:"日本", title:"明治宪法之父", desc:"你务实而灵活，善于在传统与西方之间寻找平衡，主持立宪、推动维新。你精于政略、步步为营，是制度化的现代化推手。" },
  yamagata:{ name:"山县有朋", char:"山", nation:"日本", title:"日本陆军之父", desc:"你冷静强硬、现实主义，坚信军事与秩序是国家的根基。你深谋远虑、手腕老辣，是典型的官僚与军国主义者。" },
  okuma:  { name:"大隈重信", char:"隈", nation:"日本", title:"宪政先驱", desc:"你开明务实、热衷教育与民权，主张政党政治与宪政。你视野开阔、善用民意，是理性而进步的宪政主义者。" },
  meiji:  { name:"明治天皇", char:"明", nation:"日本", title:"明治天皇", desc:"你象征着一个时代的变革，带领国家完成维新、走向富国强兵。你威严而进取，是集权与现代化的精神支柱。" },
  togou:  { name:"东乡平八郎", char:"乡", nation:"日本", title:"海军元帅", desc:"你沉着果决、胆略过人，在海战中一击制胜。你冷静而勇猛，是那种关键时刻敢于先发制人的军人。" },
  inukai: { name:"犬养毅",   char:"犬", nation:"日本", title:"政党政治领袖", desc:"你温厚而重情义，坚持政党政治与议会民主，反对军部专横。你理想而克制，是乱世中坚守宪政的温和派。" },
  yoshida:{ name:"吉田茂",   char:"吉", nation:"日本", title:"战后首相", desc:"你务实冷静、亲美亲欧，坚信「轻军备、重经济」的立国之道。你理性而坚韧，是废墟上重建国家的现实主义政治家。" },
  tojo:   { name:"东条英机", char:"条", nation:"日本", title:"二战首相", desc:"你强硬固执、狂热尚武，相信武力与扩张是国家的出路。你偏执而不妥协，是极端的军国主义者。" },
  kishi:  { name:"岸信介",   char:"岸", nation:"日本", title:"保守派首相", desc:"你精明强干、保守务实，坚定亲美反共、推进日美安保。你手腕老练、重秩序，是典型的保守派官僚政治家。" },
  ikeda:  { name:"池田勇人", char:"池", nation:"日本", title:"经济首相", desc:"你温和务实、专注经济，以「收入倍增」让国家走向繁荣。你理性而平和，是把发展当作头等大事的建设者。" },
  kimku:  { name:"金九",     char:"九", nation:"韩国", title:"独立运动之父", desc:"你坚毅笃诚、矢志独立，主张联合各方、建立统一国家。你德高望重、顾全大局，是民族独立的道义象征。" },
  an:     { name:"安重根",   char:"安", nation:"韩国", title:"民族义士", desc:"你热血刚烈、气节凛然，为民族大义甘愿舍身。你宁为玉碎、视死如归，是宁折不弯的民族英雄。" },
  rhee:   { name:"李承晚",   char:"晚", nation:"韩国", title:"大韩民国首任总统", desc:"你强硬顽固、反共亲美，坚信唯有强权与意志才能立国。你固执己见、专断独行，是典型的威权民族主义者。" },
  kim:    { name:"金日成",   char:"成", nation:"朝鲜", title:"开国领袖", desc:"你意志坚定、野心勃勃，以「主体思想」建立绝对权威。你崇尚革命与集权、反帝反殖，是彻底的威权革命者。" },
  park:   { name:"朴正熙",   char:"朴", nation:"韩国", title:"汉江奇迹缔造者", desc:"你强硬务实、纪律严明，以铁腕推动工业化与经济增长。你重秩序、重结果，是威权发展主义的代表。" },
  dae:    { name:"金大中",   char:"中", nation:"韩国", title:"民主斗士", desc:"你坚韧不拔、心怀和平，历经迫害仍坚持民主，用「阳光政策」化敌为友。你理想而不失务实，是宽容的民主领袖。" },
  chun:   { name:"全斗焕",   char:"全", nation:"韩国", title:"威权统治者", desc:"你冷酷强硬、野心勃勃，以军事力量镇压异己、掌控政权。你重权力与秩序，是铁腕的威权统治者。" },
  bogd:   { name:"博格多汗", char:"博", nation:"蒙古", title:"蒙古宗教领袖", desc:"你身兼宗教与世俗领袖，带领蒙古走向独立。你庄重而富有象征意义，是民族自决的精神象征。" },

let current = 0;
let scores = {};
let answers = [];

function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0; scores = {}; answers = [];
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qNumText').textContent = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('dimTag').textContent = DIMS[q.d];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressBar').style.width = `${(current/questions.length)*100}%`;

  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'option' + (answers[current] === i ? ' selected' : '');
    el.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt.t}</span>`;
    el.onclick = () => selectOption(i);
    box.appendChild(el);
  });

  document.getElementById('prevBtn').classList.toggle('hidden', current === 0);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === questions.length - 1 ? '查看结果' : '下一题';
  nextBtn.disabled = answers[current] === undefined;
}

function selectOption(i) {
  answers[current] = i;
  document.getElementById('nextBtn').disabled = false;
  document.querySelectorAll('#qOptions .option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

function nextQuestion() {
  if (answers[current] === undefined) return;
  if (current < questions.length - 1) { current++; renderQuestion(); }
  else showResult();
}

function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }

function showResult() {
  const total = {};
  answers.forEach((ans, qi) => {
    const s = questions[qi].options[ans].s;
    for (const id in s) total[id] = (total[id] || 0) + s[id];
  });

  const ranked = Object.keys(total)
    .map(id => ({ id, score: total[id] }))
    .sort((a,b) => b.score - a.score);

  const top = ranked[0];
  const maxScore = top.score;
  const f = figures[top.id];

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('rAvatar').textContent = f.char;
  document.getElementById('rName').textContent = f.name;
  document.getElementById('rTitle').textContent = f.title;
  document.getElementById('rDesc').textContent = f.desc;
  document.getElementById('rPct').textContent = '100%';
  document.getElementById('rRegion').textContent = f.nation + ' · ' + f.title;

  const rankBox = document.getElementById('rRank');
  rankBox.innerHTML = '';
  ranked.slice(0, 6).forEach((r, i) => {
    const pct = Math.round((r.score / maxScore) * 100);
    const rf = figures[r.id];
    rankBox.innerHTML += `
      <div class="rank-item">
        <div class="name">${i===0?'★ ':''}${rf.name}</div>
        <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
      </div>`;
  });
}

function restart() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
}
