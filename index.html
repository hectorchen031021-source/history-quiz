  tokuromi: { name:"德富芦花", char:"芦", nation:"日本", title:"作家", desc:"你与德富芦花最像——德富芦花（1868—1927），日本作家，著《不如归》，倾向和平与基督教。", img:"https://upload.wikimedia.org/wikipedia/commons/b/b8/Tokutomi_Roka.jpg", quote:"（不如归）", intro:"德富芦花（1868—1927），日本作家，著《不如归》，倾向和平与基督教。", bio:"德冨蘆花（1868年12月8日—1927年9月18日）是日本小說家，本名德富健次郎。近年也以偵探小說作家受到注目。本人使用「徳冨」（「冨」而非「富」）之表記，因此文學事典、文學館、紀念公園等採用「冨」字。其兄德富蘇峰（德富豬一郎）是著名的思想家・評論家。\n" },
  tokutomi: { name:"德富苏峰", char:"德", nation:"日本", title:"思想家", desc:"你与德富苏峰最像——德富苏峰（1863—1957），日本思想家、报人，由民权转向国家主义。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Soho_Tokutomi_1_cropped.jpg/330px-Soho_Tokutomi_1_cropped.jpg", quote:"言论报国", intro:"德富苏峰（1863—1957），日本思想家、报人，由民权转向国家主义。", bio:"德富苏峰（1863年3月14日—1957年11月2日），本名德富豬一郎，是日本著名的政治家，报人，历史学家。\n" },
  tokuda: { name:"德田球一", char:"德", nation:"日本", title:"共产党领袖", desc:"你与德田球一最像——德田球一（1894—1953），日本共产党总书记，战后重建日共。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Tokuda_Ky%C5%ABichi_Japan.jpg/330px-Tokuda_Ky%C5%ABichi_Japan.jpg", quote:"（日共重建）", intro:"德田球一（1894—1953），日本共产党总书记，战后重建日共。", bio:"德田球一，日本共产主义运动活动家、政治人物、律师，日本共产党的主要创始人和领导人之一，1922年在日本共产党第一次代表大会上当选中央委员，此后成为日本共产党的主要领导人之一，1945年12月，在日本共产党第四次代表大会上，当选为日共中央委员和日本共产党中央委员会总书记，1953年在北京病逝，享年59岁。\n" },
  tojo: { name:"东条英机", char:"条", nation:"日本", title:"二战首相", desc:"你强硬固执、狂热尚武，相信武力与扩张是国家的出路。你偏执而不妥协，是极端的军国主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Hideki_Tojo_2.jpg/330px-Hideki_Tojo_2.jpg", quote:"以武力扩张国运，一意孤行", intro:"东条英机（1884—1948），日本首相、陆军大将，发动太平洋战争的军国主义代表人物。", bio:"東條英機，日本陸軍將領和政治家，曾為陸軍大将、大政翼贊會總裁，並於1941年10月至1944年7月擔任日本內閣總理大臣（首相）及統制派最高領袖，是第二次世界大戰軸心國重要軍政領袖。他是日本軍國主義的代表人物，其執政期間的日本曾發起大規模軍事侵略，並製造多起屠殺事件。\n" },
  togou: { name:"东乡平八郎", char:"乡", nation:"日本", title:"海军元帅", desc:"你沉着果决、胆略过人，在海战中一击制胜。你冷静而勇猛，是那种关键时刻敢于先发制人的军人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Togo_Heihachiro%2C1907.jpg/330px-Togo_Heihachiro%2C1907.jpg", quote:"皇国兴废，在此一战", intro:"东乡平八郎（1848—1934），日本海军元帅，以对马海战中全歼俄国舰队而闻名。", bio:"东乡平八郎，讳名实良，大日本帝国元帥海军大将，從一位大勋位功一級侯爵。\n" },
  kodama: { name:"儿玉源太郎", char:"儿", nation:"日本", title:"陆军大将", desc:"你与儿玉源太郎最像——儿玉源太郎（1852—1906），日本陆军大将，日俄战争中任满洲军总参谋长。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Gentaro_Kodama_2.jpg/330px-Gentaro_Kodama_2.jpg", quote:"谋定而后动", intro:"儿玉源太郎（1852—1906），日本陆军大将，日俄战争中任满洲军总参谋长。", bio:"儿玉源太郎，幼名百合若，日本山陽道周防國都濃郡德山村（今山口縣周南市兒玉町）人，陸軍大臣、內務大臣、臺灣總督。\n" },
  fuze: { name:"福泽谕吉", char:"福", nation:"日本", title:"启蒙之父", desc:"你理性独立、锐意进取，主张「脱亚入欧」、以科学与文明立国。你崇尚独立自尊与实学，是眼光远大的启蒙思想家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Fukuzawa_Yukichi_1891.jpg/330px-Fukuzawa_Yukichi_1891.jpg", quote:"天不生人上之人，也不生人下之人", intro:"福泽谕吉（1835—1901），日本启蒙思想家、教育家，主张「脱亚入欧」，创办庆应义塾。", bio:"福泽諭吉，日本明治时期啟蒙思想家、教育家、东京学士会院首任院长、庆应义塾大学创立者、明治時代六大教育家之一，影響明治維新運動甚鉅，1880年，擔任興亚會的顾问。\n" },
  okamura: { name:"冈村宁次", char:"冈", nation:"日本", title:"侵华司令", desc:"你与冈村宁次最像——冈村宁次（1884—1966），日本陆军大将，侵华军总司令，战后被国民政府留用。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Yasuji_Okamura.jpg/330px-Yasuji_Okamura.jpg", quote:"（三光政策）", intro:"冈村宁次（1884—1966），日本陆军大将，侵华军总司令，战后被国民政府留用。", bio:"冈村宁次，日本陆军军人，中日戰爭期間支那派遣军末任总司令官，曾任华北方面军司令官，第11军军长等，官至勋一等功一级陆军大将。父亲冈村宁永曾任职于江户幕府。第一任妻子是星野理枝，后因故过世；第二任妻子是贵族院议员加藤宇兵卫的女儿。陆军三羽烏之一。戰後，他被上海軍事法庭審判，但被判無罪，蔣介石隨後留任他為國民政府的軍事顧問，作為日本帝國陸軍頂尖的中國問題專家之一" },
  okada: { name:"冈田启介", char:"冈", nation:"日本", title:"温和首相", desc:"你与冈田启介最像——冈田启介（1868—1952），日本首相，二二六事件中侥幸逃生，倾向温和。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Keisuke_Okada_2.jpg/330px-Keisuke_Okada_2.jpg", quote:"（二二六遇刺）", intro:"冈田启介（1868—1952），日本首相，二二六事件中侥幸逃生，倾向温和。", bio:"岡田啟介，是一名日本海軍軍人及政治家。岡田於1889年自日本海軍兵校畢業，是第15屆畢業生。曾參與中日甲午戰爭（豐島海戰、黃海海戰）、日俄戰爭（日本海海戰）和第一次世界大戰（青島戰役），並曾擔任聯合艦隊司令長官（第16任），最終軍階是大將。\n" },
  takahashi: { name:"高桥是清", char:"高", nation:"日本", title:"财政家首相", desc:"你与高桥是清最像——高桥是清（1854—1936），日本首相、财政家，以财政政策应对大萧条。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Korekiyo_Takahashi_2.jpg/330px-Korekiyo_Takahashi_2.jpg", quote:"藏相理财，纾困救市", intro:"高桥是清（1854—1936），日本首相、财政家，以财政政策应对大萧条。", bio:"高橋是清，日本東山道武藏國豐島郡芝中門前町（今東京都港區芝大門）人，曾任內閣總理大臣、大藏大臣。\n" },
  miyamoto: { name:"宫本百合子", char:"宫", nation:"日本", title:"无产阶级作家", desc:"你与宫本百合子最像——宫本百合子（1899—1951），日本无产阶级作家，投身左翼文学运动。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Yuriko_Miyamoto_01.jpg/330px-Yuriko_Miyamoto_01.jpg", quote:"（革命文学）", intro:"宫本百合子（1899—1951），日本无产阶级作家，投身左翼文学运动。", bio:"宮本百合子（1899年2月13日—1951年1月21日）是日本小说家，評論家。出生於東京。主要作品有《贫穷的人们》《伸子》《播州平野》《两个院子》《路标》等。\n" },
  miyazaki: { name:"宫崎滔天", char:"宫", nation:"日本", title:"浪人", desc:"你与宫崎滔天最像——宫崎滔天（1871—1922），日本浪人，倾力支持孙中山的革命事业。", img:"", quote:"（支那革命）", intro:"宫崎滔天（1871—1922），日本浪人，倾力支持孙中山的革命事业。", bio:"宮崎滔天，本名寅藏（或作虎藏），号白浪庵滔天。世以號稱，男，熊本縣人，日本革命家，孫文的好友，支持辛亥革命。他同时也是一名浪曲師，艺名为桃中軒牛右衛門。\n" },
  tanizaki: { name:"谷崎润一郎", char:"谷", nation:"日本", title:"文豪", desc:"你与谷崎润一郎最像——谷崎润一郎（1886—1965），日本文豪，著《细雪》《阴翳礼赞》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Junichiro_Tanizaki_1913.jpg/330px-Junichiro_Tanizaki_1913.jpg", quote:"（阴翳礼赞）", intro:"谷崎润一郎（1886—1965），日本文豪，著《细雪》《阴翳礼赞》。", bio:"谷崎潤一郎，為日本著名小說家，曾獲得諾貝爾文學獎的提名。代表作有長篇小說《春琴抄》、《细雪》，日本文學界推崇其為經典的唯美派大師。\n" },
  hirota: { name:"广田弘毅", char:"广", nation:"日本", title:"侵华首相", desc:"你与广田弘毅最像——广田弘毅（1878—1948），日本首相，提出侵华「广田三原则」，被处绞刑。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Kohki_Hirota_suit_cropped.jpg/330px-Kohki_Hirota_suit_cropped.jpg", quote:"（广田三原则）", intro:"广田弘毅（1878—1948），日本首相，提出侵华「广田三原则」，被处绞刑。", bio:"廣田弘毅，原名廣田丈太郎，日本外交官、政治人物。1936年3月9日至1937年2月2日任日本首相（第32任）。曾任外務大臣（第49－51、55任）、貴族院議員等職位。\n" },
  katsura: { name:"桂太郎", char:"桂", nation:"日本", title:"军人首相", desc:"你与桂太郎最像——桂太郎（1848—1913），日本军人首相，长期执政，推动日俄战争与吞并朝鲜。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/11_KatsuraT.jpg/330px-11_KatsuraT.jpg", quote:"以军立国", intro:"桂太郎（1848—1913），日本军人首相，长期执政，推动日俄战争与吞并朝鲜。", bio:"桂太郎，日本軍人、政治人物，長州藩（今山口縣）出身，陸軍大將，曾任台湾总督，後來曾三度出任日本内阁总理大臣，明治维新元老之一，從一位大勳位功三級公爵。桂太郎被普遍認為是日本近代史最俱影響力的人物之一，其導師為山縣有朋公爵。\n" },
  kawakami: { name:"河上肇", char:"河", nation:"日本", title:"马克思主义者", desc:"你与河上肇最像——河上肇（1879—1946），日本马克思主义经济学家，著《贫乏物语》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/%E6%B2%B3%E4%B8%8A_%E8%82%87.jpg/330px-%E6%B2%B3%E4%B8%8A_%E8%82%87.jpg", quote:"（经济学批判）", intro:"河上肇（1879—1946），日本马克思主义经济学家，著《贫乏物语》。", bio:"河上肇 是日本經濟學家、作家、社會思想家與馬克思主義研究者。他曾是京都帝國大學的教授，其著作對日本乃至中國的早期共產主義思想產生了深遠影響。他的學術工作包括翻譯埃德溫·塞利格曼、歐文·費雪、尼古拉斯·皮爾森的著作以及《資本論》。\n" },
  tsurumi: { name:"鹤见俊辅", char:"鹤", nation:"日本", title:"哲学家", desc:"你与鹤见俊辅最像——鹤见俊辅（1922—2015），日本哲学家，战后思想界的核心人物。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Eiga-Hyoron-1960-January-2.jpg/330px-Eiga-Hyoron-1960-January-2.jpg", quote:"（战后思想）", intro:"鹤见俊辅（1922—2015），日本哲学家，战后思想界的核心人物。", bio:"鶴見俊輔，日本思想家、大眾文化研究者、社會運動者。曾任教於京都大學人文科學研究所、東京工業大學、同志社大學。\n" },
  yokomitsu: { name:"横光利一", char:"横", nation:"日本", title:"新感觉派作家", desc:"你与横光利一最像——横光利一（1898—1947），日本新感觉派代表作家，著《上海》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/%E6%A8%AA%E5%85%89_%E5%88%A9%E4%B8%80.jpg/330px-%E6%A8%AA%E5%85%89_%E5%88%A9%E4%B8%80.jpg", quote:"（新感觉派）", intro:"横光利一（1898—1947），日本新感觉派代表作家，著《上海》。", bio:"横光 利一，日本小说家、俳人、评论家。尽管本名也为横光 利一，但读音不同，其中名的部分“利一”读音为よこみつ としかず。\n" },
  araki: { name:"荒木贞夫", char:"荒", nation:"日本", title:"皇道派领袖", desc:"你与荒木贞夫最像——荒木贞夫（1877—1966），日本陆军皇道派领袖，鼓吹精神主义与皇道。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Araki_Sadao.jpg/330px-Araki_Sadao.jpg", quote:"皇道精神", intro:"荒木贞夫（1877—1966），日本陆军皇道派领袖，鼓吹精神主义与皇道。", bio:"荒木贞夫，日本陆军大将，曾多次出任日本陆军大臣，為陸軍中的「皇道派」領袖，主張往蘇聯方向擴張並反對侵略中國及歐美列強；於二次大戰戰後被遠東國際軍事法庭判為甲级战犯。\n" },
  yoshida: { name:"吉田茂", char:"吉", nation:"日本", title:"战后首相", desc:"你务实冷静、亲美亲欧，坚信「轻军备、重经济」的立国之道。你理性而坚韧，是废墟上重建国家的现实主义政治家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Shigeru_Yoshida_suit.jpg/330px-Shigeru_Yoshida_suit.jpg", quote:"败而不馁，卧薪尝胆重建家园", intro:"吉田茂（1878—1967），日本战后首相，确立「轻军备、重经济」路线，主导战后重建。", bio:"吉田茂，日本政治人物。日本政治元老、原外務省官僚、大老牧野伸顯的女婿。1946年在二戰結束不久後出任內閣總理大臣（首相），為大日本帝國憲法下的最後一任首相，1948年再度拜相，後執政至1954年，期間主導了日本輕武裝、發展經濟的國策影響日本至今，領導日本度過同盟國軍事佔領日本時期，和駐日盟軍總司令麥克阿瑟元帥關係融洽。\n" },
  yoshino: { name:"吉野作造", char:"吉", nation:"日本", title:"民主思想家", desc:"你与吉野作造最像——吉野作造（1878—1933），日本政治学者，倡导「民本主义」与大正民主。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Yoshino_Sakuzo_01.jpg/330px-Yoshino_Sakuzo_01.jpg", quote:"（民本主义）", intro:"吉野作造（1878—1933），日本政治学者，倡导「民本主义」与大正民主。", bio:"吉野作造（1878年1月29日—1933年3月18日）是一名大正時期的日本思想家、政治學者，大正民主的重要奠基者，外號為「古川學人」。\n" },
  akutagawa: { name:"芥川龙之介", char:"芥", nation:"日本", title:"小说家", desc:"你与芥川龙之介最像——芥川龙之介（1892—1927），日本小说家，著《罗生门》《鼻子》，自杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Akutagawa_portrait_Akutagawa_Sakuhinshu_6.jpg/330px-Akutagawa_portrait_Akutagawa_Sakuhinshu_6.jpg", quote:"人生比地狱更像地狱", intro:"芥川龙之介（1892—1927），日本小说家，著《罗生门》《鼻子》，自杀。", bio:"芥川龙之介，号“澄江堂主人”，俳号“我鬼”，日本知名小说家，博通漢學、日本文學、英國文學，但一生為多種疾病、憂慮所苦而仰藥，年僅三十五。其名作甚多，以極短篇為主。\n" },
  tsuda: { name:"津田左右吉", char:"津", nation:"日本", title:"历史学家", desc:"你与津田左右吉最像——津田左右吉（1873—1961），日本历史学家，以实证批判神话史学。", img:"https://upload.wikimedia.org/wikipedia/commons/4/4d/S%C5%8Dkichi_Tsuda.jpg", quote:"（实证史学）", intro:"津田左右吉（1873—1961），日本历史学家，以实证批判神话史学。", bio:"津田左右吉（1873年10月3日—1961年12月4日）是一位日本歷史學家。\n" },
  konoe: { name:"近卫文麿", char:"近", nation:"日本", title:"贵族首相", desc:"你与近卫文麿最像——近卫文麿（1891—1945），日本贵族首相，发动侵华战争，后自杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Konoe_Fumimaro_PM.jpg/330px-Konoe_Fumimaro_PM.jpg", quote:"以国体为本", intro:"近卫文麿（1891—1945），日本贵族首相，发动侵华战争，后自杀。", bio:"近衛文麿（mǒ），日本昭和時代前期的政治人物。上世纪初時曾三度出任日本內閣總理大臣。日本大政翼赞会的創始人之一，该会被广泛认为是与同时代之德国纳粹党、義大利国家法西斯党相似的独裁政治社团，是首位公開支持和德國、義大利結成軸心國且發動第二次世界大戰以及中國戰場戰爭的日本政治家，上任不久就策動七七事變，兩個月後便爆發了上海會戰，且在其首相任內經歷了南京大屠殺。\n" },
  inoue: { name:"井上成美", char:"井", nation:"日本", title:"海军反战派", desc:"你与井上成美最像——井上成美（1889—1975），日本海军大将，坚决反对对美开战与神风特攻。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Inoue_Shigeyoshi.jpg/330px-Inoue_Shigeyoshi.jpg", quote:"（反对对美开战）", intro:"井上成美（1889—1975），日本海军大将，坚决反对对美开战与神风特攻。", bio:"井上成美，宮城縣仙台市人，與塚原二四三中將同為大日本帝國海軍史上最后兩位晋升的海军大将。\n" },
  hatoyama: { name:"鸠山一郎", char:"鸠", nation:"日本", title:"保守首相", desc:"你与鸠山一郎最像——鸠山一郎（1883—1959），日本首相，推动日苏复交与保守政党合并。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Ichiro_hatoyama.jpg/330px-Ichiro_hatoyama.jpg", quote:"恢复自主，重建日本", intro:"鸠山一郎（1883—1959），日本首相，推动日苏复交与保守政党合并。", bio:"鳩山一郎，日本東京府牛込區東五軒町（今東京都新宿區東五軒町）人，曾任日本內閣總理大臣、自由民主黨總裁等职。\n" },

  suzuki: { name:"铃木贯太郎", char:"铃", nation:"日本", title:"终战首相", desc:"你与铃木贯太郎最像——铃木贯太郎（1868—1948），日本终战首相，主持接受《波茨坦宣言》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Kantaro_Suzuki_suit.jpg/330px-Kantaro_Suzuki_suit.jpg", quote:"（接受波茨坦宣言）", intro:"铃木贯太郎（1868—1948），日本终战首相，主持接受《波茨坦宣言》。", bio:"铃木贯太郎，日本海军大将，曾任聯合艦隊司令長官、天皇侍从武官长，在二二六事件中被皇道派官兵襲擊住所，受槍擊重伤。在太平洋戰爭末期受昭和天皇任命，以時年77歲高齡，出任内阁总理大臣（1945年4月7日－1945年8月17日），並於昭和天皇的終戰廣播，日本无条件投降後第二天以完成結束戰爭的任務為由，提出內閣總辭。該內閣僅在任133天，但致力於秉承昭和天皇意志，在" },

  ashida: { name:"芦田均", char:"芦", nation:"日本", title:"外交首相", desc:"你与芦田均最像——芦田均（1887—1959），日本首相、外交家，参与战后和平宪法制定。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/Hitoshi_Ashida.jpg/330px-Hitoshi_Ashida.jpg", quote:"（和平宪法）", intro:"芦田均（1887—1959），日本首相、外交家，参与战后和平宪法制定。", bio:"蘆田均（1887年11月15日—1959年6月20日）是日本一名外交官及政治家。\n" },
  yonai: { name:"米内光政", char:"米", nation:"日本", title:"海军大将·首相", desc:"你与米内光政最像——米内光政（1880—1948），日本海军大将、首相，反对缔结三国同盟与对美开战，倾向温和。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Yonai_Mitsumasa.jpg/330px-Yonai_Mitsumasa.jpg", quote:"反对三国同盟，力避对美开战", intro:"米内光政（1880—1948），日本海军大将、首相，反对缔结三国同盟与对美开战，倾向温和。", bio:"米內光政，日本海军大将，第37任日本内阁总理大臣。\n" },
  meiji: { name:"明治天皇", char:"明", nation:"日本", title:"明治天皇", desc:"你象征着一个时代的变革，带领国家完成维新、走向富国强兵。你威严而进取，是集权与现代化的精神支柱。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Meiji_Emperor.jpg/330px-Meiji_Emperor.jpg", quote:"广兴会议，万机决于公论", intro:"明治天皇（1852—1912），日本第122代天皇，明治维新的象征，带领日本走向近代化。", bio:"明治天皇，為日本第122代天皇（1867年2月13日—1912年7月30日在位）。大日本帝国第1代大元帅（1889年－1912年在任），諱睦仁，孝明天皇第2皇子，母為典侍中山慶子。出生時稱號為祐宮，徽印印號為永，親見日本從孤立的封建國家向工業化世界強國的轉變。1852年11月3日（嘉永五年九月二十二日），睦仁出生於外祖父中山忠能的宅邸，幼年居於京都御所、東宮" },
  nogi: { name:"乃木希典", char:"乃", nation:"日本", title:"陆军大将", desc:"你与乃木希典最像——乃木希典（1849—1912），日本陆军大将，以「军神」形象闻名，后随明治天皇殉死。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Maresuke_Nogi%2C_%E8%BF%91%E4%B8%96%E5%90%8D%E5%A3%AB%E5%86%99%E7%9C%9F_%E5%85%B61_-_Photo_only.jpg/330px-Maresuke_Nogi%2C_%E8%BF%91%E4%B8%96%E5%90%8D%E5%A3%AB%E5%86%99%E7%9C%9F_%E5%85%B61_-_Photo_only.jpg", quote:"武士之魂，忠义至上", intro:"乃木希典（1849—1912），日本陆军大将，以「军神」形象闻名，后随明治天皇殉死。", bio:"乃木希典，出生於日本長府藩藩士家庭，从师玉木文之进。為大日本帝國陸軍大將，官階正二位、大勳位、功一級、伯爵，1896至1898年任台灣日治時期第3任總督。乃木希典被日本當做軍神，自幼的基本教育是武士道精神与儒学忠君思想，但作为跻身长州藩陆军高级将领的乃木希典，其指挥作战的思維，只能以古典或陈旧来形容。\n" },
  minami: { name:"南次郎", char:"南", nation:"日本", title:"陆军大臣", desc:"你与南次郎最像——南次郎（1874—1955），日本陆军大将，陆相任内九一八事变爆发。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/Minami_Jir%C5%8D_1931.jpg/330px-Minami_Jir%C5%8D_1931.jpg", quote:"（侵华）", intro:"南次郎（1874—1955），日本陆军大将，陆相任内九一八事变爆发。", bio:"南次郎，生于日本大分县一个没落的武士家庭，大日本帝國陸軍大将，二战甲级战犯。九一八事变策畫者，战后被判处无期徒刑，1955年病死。\n" },
  uchimura: { name:"内村鉴三", char:"内", nation:"日本", title:"思想家", desc:"你与内村鉴三最像——内村鉴三（1861—1930），日本基督教思想家，主张「无教会」与和平反战。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Uchimura_Kanzo.jpg/330px-Uchimura_Kanzo.jpg", quote:"为和平与非战而呼号", intro:"内村鉴三（1861—1930），日本基督教思想家，主张「无教会」与和平反战。", bio:"内村鑑三 是日本明治及大正時代的作家、基督徒和傳教士。提倡以基於福音主義與自身對社會的批判的無教會主義。\n" },
  naito: { name:"内藤湖南", char:"内", nation:"日本", title:"东洋史学家", desc:"你与内藤湖南最像——内藤湖南（1866—1934），日本东洋史学家，提出「唐宋变革论」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/%E6%AD%B4%E5%8F%B2%E5%AD%A6%E8%80%85%E5%86%85%E8%97%A4%E6%B9%96%E5%8D%97.jpg/330px-%E6%AD%B4%E5%8F%B2%E5%AD%A6%E8%80%85%E5%86%85%E8%97%A4%E6%B9%96%E5%8D%97.jpg", quote:"（唐宋变革论）", intro:"内藤湖南（1866—1934），日本东洋史学家，提出「唐宋变革论」。", bio:"內藤湖南（1866年8月27日—1934年6月26日），本名虎次郎，字炳卿，號湖南，以号行，近代日本歷史學家、漢學家，京都学派的开创者，与白鸟库吉同为日本“东洋史”学科的奠基者。他提出了文化中心移动说与唐宋变革论两大著名的史学观点：前者认为中国文化的发展是“传播”（中原文化向周边发散）与“反馈”（吸取中原文化的异族政权入主中原）二者不断重复的过程；后者认为中" },
  uchida: { name:"内田良平", char:"内", nation:"日本", title:"右翼浪人", desc:"你与内田良平最像——内田良平（1874—1937），日本右翼组织黑龙会头目，鼓吹大陆扩张。", img:"https://upload.wikimedia.org/wikipedia/commons/0/05/Ryohei_Uchida_Close-up.jpg", quote:"（大亚细亚主义）", intro:"内田良平（1874—1937），日本右翼组织黑龙会头目，鼓吹大陆扩张。", bio:"內田良平，號硬石。日本近代國權派大亞細亞主義運動家。黑龍會主幹，大日本生產黨總裁。\n" },
  katayama: { name:"片山潜", char:"片", nation:"日本", title:"社会主义先驱", desc:"你与片山潜最像——片山潜（1859—1933），日本社会主义与工人运动先驱，后投身共产国际。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Katayama_Sen_25_years_old.jpg/330px-Katayama_Sen_25_years_old.jpg", quote:"（工人运动）", intro:"片山潜（1859—1933），日本社会主义与工人运动先驱，后投身共产国际。", bio:"片山潛（1859年12月26日—1933年11月5日），號深甫，日本勞工運動家、社會主義者、馬克思主義者、思想家和社會事業家。\n" },
  katayamatetsu: { name:"片山哲", char:"片", nation:"日本", title:"社会党首相", desc:"你与片山哲最像——片山哲（1887—1978），日本社会党首相，战后短暂执政。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/%E7%89%87%E5%B1%B1%E5%93%B2.jpg/330px-%E7%89%87%E5%B1%B1%E5%93%B2.jpg", quote:"（社会民主）", intro:"片山哲（1887—1978），日本社会党首相，战后短暂执政。", bio:"片山哲，盟軍佔領日本時期曾短暫出任日本首相，為律师、政治人物、基督教社會主義者，日本二战后第一位左派首相。\n" },
  hiranuma: { name:"平沼骐一郎", char:"平", nation:"日本", title:"法西斯首相", desc:"你与平沼骐一郎最像——平沼骐一郎（1867—1952），日本首相，国本主义右翼，被定为甲级战犯。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Hiranuma_Kiichiro.jpg/330px-Hiranuma_Kiichiro.jpg", quote:"（国本主义）", intro:"平沼骐一郎（1867—1952），日本首相，国本主义右翼，被定为甲级战犯。", bio:"平沼騏一郎，日本已故司法官及政治家，歷任大審院檢察總長（第8任）、大審院長（第11任）、日本大學校長（第3任）、大東文化大學校長（第1任）、樞密院副議長（第11任）及議長（第17、21任）、司法大臣（第26任）、內務大臣（第62任）及內閣總理大臣（第35任）。於第二次世界大戰後被定為甲級戰犯，被判處終身監禁。\n" },
  hiratsuka: { name:"平冢雷鸟", char:"雷", nation:"日本", title:"女性主义者", desc:"你与平冢雷鸟最像——平冢雷鸟（1886—1971），日本女性主义先驱，创办《青鞜》杂志。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Raicho_Hiratsuka.jpg/330px-Raicho_Hiratsuka.jpg", quote:"元始，女性是太阳", intro:"平冢雷鸟（1886—1971），日本女性主义先驱，创办《青鞜》杂志。", bio:"平塚雷鸟，本名平塚明，是日本思想家、評論家、作家、女权主义者，毕业于日本女子大学家政系，在战后主要参与反战运动。平塚在1911年9月庆祝杂志《青鞜》创刊撰写的文章《女性原本是太阳》是女权运动的重要象征之一。其就读的日本女子大学于2005年设立了平塚雷鸟奖。\n" },

  akiyama: { name:"秋山真之", char:"秋", nation:"日本", title:"海军参谋", desc:"你与秋山真之最像——秋山真之（1868—1918），日本海军参谋，参与策划对马海战。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Akiyama_Saneyuki.jpg/330px-Akiyama_Saneyuki.jpg", quote:"天佑我皇国", intro:"秋山真之（1868—1918），日本海军参谋，参与策划对马海战。", bio:"秋山真之（1868年4月12日—1918年2月4日）為大日本帝国海军將領。最高军衔海军中将。幼名淳五郎（じゅんごろう）。母亲是贞。哥哥秋山好古是陆军大将。妻子秋山季子（稲生すゑと）。育有4男2女。参议院议员大石尚子是真之的外孙女（次女宜子的长女）。\n" },
  inukai: { name:"犬养毅", char:"犬", nation:"日本", title:"政党政治领袖", desc:"你温厚而重情义，坚持政党政治与议会民主，反对军部专横。你理想而克制，是乱世中坚守宪政的温和派。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/Tsuyoshi_Inukai_cropped.jpg/330px-Tsuyoshi_Inukai_cropped.jpg", quote:"以议会救国，以宪政卫民", intro:"犬养毅（1855—1932），日本首相、政党政治家，坚持议会民主，被军部刺杀。", bio:"犬養毅，幼名仙次郎，號木堂、子遠，日本山陽道備中國賀陽郡川入村（今岡山縣岡山市北區）人，內閣總理大臣（首相）兼內務大臣與外務大臣。\n" },
  mishima: { name:"三岛由纪夫", char:"三", nation:"日本", title:"作家", desc:"你与三岛由纪夫最像——三岛由纪夫（1925—1970），日本作家，崇尚武士精神，切腹自杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Yukio_Mishima%2C_1955_%28cropped%29.jpg/330px-Yukio_Mishima%2C_1955_%28cropped%29.jpg", quote:"以武士之死，唤民族之魂", intro:"三岛由纪夫（1925—1970），日本作家，崇尚武士精神，切腹自杀。", bio:"三島由紀夫，本名平岡公威，日本小說家、劇作家、記者、電影製作人、電影演員與政治活动家。\n" },

  miki: { name:"三木清", char:"三", nation:"日本", title:"哲学家", desc:"你与三木清最像——三木清（1897—1945），日本哲学家，著《人生论笔记》，狱中病逝。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Kiyoshi_Miki.JPG/330px-Kiyoshi_Miki.JPG", quote:"（人生论）", intro:"三木清（1897—1945），日本哲学家，著《人生论笔记》，狱中病逝。", bio:"三木清 是日本京都學派的哲學家和評論家，他曾擔任第三高等学校的講師和法政大学法文学部的教授，其本人毕业于京都大学哲学系。\n" },
  mikitakeo: { name:"三木武夫", char:"三", nation:"日本", title:"清廉首相", desc:"你与三木武夫最像——三木武夫（1907—1988），日本首相，以廉洁著称，推动政治改革。", img:"https://upload.wikimedia.org/wikipedia/commons/f/f1/Takeo_Miki_19741209.jpg", quote:"（廉洁政治）", intro:"三木武夫（1907—1988），日本首相，以廉洁著称，推动政治改革。", bio:"三木武夫，日本政治家。日本自由民主党总裁、第66代日本內閣總理大臣（首相）。\n" },
  shibusawa: { name:"涩泽荣一", char:"涩", nation:"日本", title:"实业之父", desc:"你与涩泽荣一最像——涩泽荣一（1840—1931），日本实业家，创办数百家企业，倡导「论语与算盘」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Portrait_of_Shibusawa_Eiichi.jpg/330px-Portrait_of_Shibusawa_Eiichi.jpg", quote:"论语与算盘", intro:"涩泽荣一（1840—1931），日本实业家，创办数百家企业，倡导「论语与算盘」。", bio:"澀澤榮一，號清淵，是日本幕末至大正初期活躍的武士（幕臣）、官僚、實業家。\n" },
  moriogai: { name:"森鸥外", char:"森", nation:"日本", title:"文学家", desc:"你与森鸥外最像——森鸥外（1862—1922），日本文学家、军医，兼具文人气与武士精神。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Ougai_Mori_October_22%2C_1911.jpg/330px-Ougai_Mori_October_22%2C_1911.jpg", quote:"文以载道，武以报国", intro:"森鸥外（1862—1922），日本文学家、军医，兼具文人气与武士精神。", bio:"森鷗外，石見国津和野（今島根縣津和野町）出生及出身，本名森 林太郎，號鷗外，又別號觀潮樓主人、鷗外漁史。日本明治至大正年間小說家、評論家、翻譯家、醫學家、軍醫 、官僚。森鷗外是日本第二次世界大戰以前與夏目漱石齊名的文豪。\n" },
  yamamoto: { name:"山本五十六", char:"山", nation:"日本", title:"联合舰队司令", desc:"你与山本五十六最像——山本五十六（1884—1943），日本海军大将，策划偷袭珍珠港。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Portrait_of_Yamamoto_Isoroku.jpg/330px-Portrait_of_Yamamoto_Isoroku.jpg", quote:"偷袭是赢得开战的唯一机会", intro:"山本五十六（1884—1943），日本海军大将，策划偷袭珍珠港。", bio:"山本五十六，日本海軍將領，死後追授元帥，是第二次世界大战期間日本海軍联合舰队司令，曾主導一系列軍事行動，後於1943年4月因座機遭擊落而亡。\n" },
  yamashita: { name:"山下奉文", char:"山", nation:"日本", title:"马来之虎", desc:"你与山下奉文最像——山下奉文（1885—1946），日本陆军大将，攻陷马来半岛，战后被处死。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Yamashita_Tomoyuki.jpg/330px-Yamashita_Tomoyuki.jpg", quote:"（南方军司令）", intro:"山下奉文（1885—1946），日本陆军大将，攻陷马来半岛，战后被处死。", bio:"山下奉文，大日本帝國陸軍軍人，最終軍階為陸軍大將。在太平洋戰爭期間奉命負責指揮日本軍第25軍進攻英屬馬來亞（史稱馬來亞戰役），只花2個多月的時間就佔領整個馬來半島，並直取英國在東南亞的政治經濟中心新加坡，還因此出色戰績被稱為「马来之虎」，後來因故被調入滿洲國，未能參與其他戰役。1944年日軍敗象已現，才請他重回菲律賓前線試圖挽回大局，但此時已無力改變情勢直到" },
  yamagata: { name:"山县有朋", char:"山", nation:"日本", title:"日本陆军之父", desc:"你冷静强硬、现实主义，坚信军事与秩序是国家的根基。你深谋远虑、手腕老辣，是典型的官僚与军国主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Yamagata_Aritomo.jpg/330px-Yamagata_Aritomo.jpg", quote:"主权线、利益线，乃国家之根本", intro:"山县有朋（1838—1922），日本陆军元老、首相，奠定日本军国主义与官僚体制。", bio:"山县有朋，是日本的武士，陸軍軍人，政治家。軍階是元帥陸軍大將。勛位公爵。歷任內務大臣（第一代）、內閣總理大臣（第三、九代）、元老、司法大臣（第七代）、農商務大臣（代理）、樞密院決議長（第五、九、十一代）、陸軍第一軍司令官、貴族院的決議員、陸軍參謀總長（第五代）等。山縣有朋被普遍認為是日本近代史上最具影響力的人物之一。\n" },
  ishibashi: { name:"石桥湛山", char:"石", nation:"日本", title:"自由主义经济学家", desc:"你与石桥湛山最像——石桥湛山（1884—1973），日本首相、经济学家，主张「小日本主义」与和平贸易。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/ISHIBASHI_Tanzan.jpg/330px-ISHIBASHI_Tanzan.jpg", quote:"（小日本主义）", intro:"石桥湛山（1884—1973），日本首相、经济学家，主张「小日本主义」与和平贸易。", bio:"石橋湛山（1884年9月25日—1973年4月25日），日本第55任内阁总理大臣。生于东京。日莲宗学僧杉田湛誓之子。幼名省三，從母姓。早稻田大學文學科畢業，畢業後擔任記者。戰後進入政壇，1956年当选日本首相，因身体状况不佳，任职六十五天就被迫辞职，為日本歷史上迄今第三短命的首相。\n" },
  ishiwara: { name:"石原莞尔", char:"石", nation:"日本", title:"九一八策划者", desc:"你与石原莞尔最像——石原莞尔（1889—1949），日本陆军中将，策划九一八事变，后与东条对立。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/ISHIHARA_Kanji.jpg/330px-ISHIHARA_Kanji.jpg", quote:"满蒙是日本的生命线", intro:"石原莞尔（1889—1949），日本陆军中将，策划九一八事变，后与东条对立。", bio:"石原莞尔，大日本帝国陆军陸軍中將。在任关东军作战主任参谋时和板垣征四郎一起策动了九一八事变，二戰末期因为和东条英机的尖銳对立而被编入预备役，且曾策畫暗殺東條英机。\n" },
  shiba: { name:"司马辽太郎", char:"司", nation:"日本", title:"历史作家", desc:"你与司马辽太郎最像——司马辽太郎（1923—1996），日本历史小说家，著《坂上之云》。", img:"https://upload.wikimedia.org/wikipedia/commons/9/9b/Shiba_Ryotaro.jpg", quote:"（历史小说）", intro:"司马辽太郎（1923—1996），日本历史小说家，著《坂上之云》。", bio:"司马辽太郎 本名福田定一，大阪人，是日本小说家。专攻历史小说。笔名司马辽太郎是文學方面「远不及司马迁」的意思。获认为是日本大众文学的巨匠，也是日本国民中最受欢迎的作家，获认为是中流砥柱般的人物。\n" },
  matsuoka: { name:"松冈洋右", char:"松", nation:"日本", title:"外交官", desc:"你与松冈洋右最像——松冈洋右（1880—1946），日本外交官，推动退出国际联盟与三国同盟。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Y%C5%8Dsuke_Matsuoka.jpg/330px-Y%C5%8Dsuke_Matsuoka.jpg", quote:"退出国联，独行其是", intro:"松冈洋右（1880—1946），日本外交官，推动退出国际联盟与三国同盟。", bio:"松冈洋右，日本外交官、政治人物。处理过日本退出国际联盟，签定日德意三国联盟，日苏中立条约等太平洋战争爆发前日本外交的多次重要事件。日本投降後，在同盟國召開的東京軍事法庭审判中途病亡。\n" },
  matsui: { name:"松井石根", char:"松", nation:"日本", title:"南京事件指挥官", desc:"你与松井石根最像——松井石根（1878—1948），日本陆军大将，南京战役指挥官，被处绞刑。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/%E6%9D%BE%E4%BA%95_%E7%9F%B3%E6%A0%B9.jpg/330px-%E6%9D%BE%E4%BA%95_%E7%9F%B3%E6%A0%B9.jpg", quote:"（侵华军司令）", intro:"松井石根（1878—1948），日本陆军大将，南京战役指挥官，被处绞刑。", bio:"松井石根 是一名大日本帝國陸軍將領，最高軍階為陸軍大將，曾於1937年指揮中支那方面軍，參與了南京大屠殺的戰爭罪行，因而在戰後於遠東國際軍事法庭被指控为甲级战犯，最终被處以絞刑。\n" },
  dazai: { name:"太宰治", char:"太", nation:"日本", title:"作家", desc:"你与太宰治最像——太宰治（1909—1948），日本作家，著《人间失格》，多次自杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Osamu_Dazai.jpg/330px-Osamu_Dazai.jpg", quote:"生而为人，我很抱歉", intro:"太宰治（1909—1948），日本作家，著《人间失格》，多次自杀。", bio:"太宰治，本名津島修治，日本無賴派小說家，生于青森縣。\n" },
  tanakakakuei: { name:"田中角荣", char:"田", nation:"日本", title:"平民首相", desc:"你与田中角荣最像——田中角荣（1918—1993），日本首相，实现日中邦交正常化。", img:"https://upload.wikimedia.org/wikipedia/commons/c/cf/Kakuei_Tanaka_19720707.jpg", quote:"（日本列岛改造论）", intro:"田中角荣（1918—1993），日本首相，实现日中邦交正常化。", bio:"田中角荣，日本政治人物、建築師，歷任眾議院議員（16期）、郵政大臣（第12代）、大藏大臣（第67－69代）、通商產業大臣（第33代）、內閣總理大臣（第64、65代）。1972年（昭和47年）9月，就任首相2个月後，正式访问中华人民共和国，与中华人民共和国的领导人举行会谈并建立外交关系，双方关系开始走入正常化。內政方面的政績則有《日本列島改造論》等主要方針。\n" },
  tanaka: { name:"田中义一", char:"田", nation:"日本", title:"军人首相", desc:"你与田中义一最像——田中义一（1864—1929），日本军人首相，相传曾提出「田中奏折」侵华政策。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Giichi_Tanaka_formal_cropped.jpg/330px-Giichi_Tanaka_formal_cropped.jpg", quote:"对外扩张，以图国运", intro:"田中义一（1864—1929），日本军人首相，相传曾提出「田中奏折」侵华政策。", bio:"田中义一，幼名乙熊。日本山陽道長門國阿武郡萩城下（今山口縣萩市）人，內閣總理大臣兼外務大臣、內務大臣與拓務大臣。在日本以外，田中以在1927年上奏侵华方略的田中奏折广为人知，但該奏摺經考證證實為假消息。在日本內部，則是因為陸軍大臣身份，被稱有著強硬的對華外交姿態，不過更激進的關東軍擅作主張時，他對刺殺張作霖則認為太過火了，在打算決定逞處暴走後的軍部時產生政治" },
  hata: { name:"畑俊六", char:"畑", nation:"日本", title:"侵华司令", desc:"你与畑俊六最像——畑俊六（1879—1962），日本陆军元帅，侵华军总司令，被判终身监禁。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Hata_Syunroku3.jpg/330px-Hata_Syunroku3.jpg", quote:"（侵华）", intro:"畑俊六（1879—1962），日本陆军元帅，侵华军总司令，被判终身监禁。", bio:"畑俊六，日本帝国陆军大将，也是最後一位元帅榮譽獲得者。二战甲级战犯，以長時間擔任中國派遣軍司令官聞名。\n" },
  higuchi: { name:"樋口一叶", char:"一", nation:"日本", title:"女作家", desc:"你与樋口一叶最像——樋口一叶（1872—1896），日本女作家，短暂一生留下《青梅竹马》等杰作。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Higuchi_Ichiyou.png/330px-Higuchi_Ichiyou.png", quote:"（明治女流文学）", intro:"樋口一叶（1872—1896），日本女作家，短暂一生留下《青梅竹马》等杰作。", bio:"樋（tōng）口一葉，生於東京，原名樋口奈津或樋口夏子，是日本明治初期主要女性小說家。因肺結核病逝，得年24歲。\n" },
  toyama: { name:"头山满", char:"头", nation:"日本", title:"右翼首领", desc:"你与头山满最像——头山满（1855—1944），日本右翼组织玄洋社首领，政界幕后势力。", img:"", quote:"（黑龙会）", intro:"头山满（1855—1944），日本右翼组织玄洋社首领，政界幕后势力。", bio:"頭山滿 是日本在20世紀初右翼政治領袖、軍商，極端國家主義祕密團體黑龍會創辦人；日本人認為他是慈善家，被日本侵略國則或有多種看法。頭山與孫中山、金玉均等东亚的有志改革者頗為友好，支持革命黨建立中華民國。\n" },
  doihara: { name:"土肥原贤二", char:"土", nation:"日本", title:"侵华特务", desc:"你与土肥原贤二最像——土肥原贤二（1883—1948），日本陆军大将、特务，策划侵华阴谋，被处绞刑。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/General-Kenji-Doihara.jpg/330px-General-Kenji-Doihara.jpg", quote:"谋略与武力并用", intro:"土肥原贤二（1883—1948），日本陆军大将、特务，策划侵华阴谋，被处绞刑。", bio:"土肥原贤二，日本帝国昭和时代的陆军大将。从1913年起在中國策划从事侵略活动，有“帝国陆军头号中国通”之称，参与策划了九一八事变，扶植清遜帝溥仪在中国东北地区成立傀儡政权“满洲国”，後指揮支那駐屯軍入侵华北地区。由於在日軍侵華戰爭中发挥核心作用，經远东国际军事法庭列为甲级战犯，在东京审判中被处以绞刑。\n" },
  ozaki: { name:"尾崎行雄", char:"尾", nation:"日本", title:"宪政之神", desc:"你与尾崎行雄最像——尾崎行雄（1858—1954），日本政治家，被誉为「宪政之神」，护宪斗争一生。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Yukio_Ozaki.jpg/330px-Yukio_Ozaki.jpg", quote:"（护宪运动）", intro:"尾崎行雄（1858—1954），日本政治家，被誉为「宪政之神」，护宪斗争一生。", bio:"尾崎行雄（おざき　ゆきお）（1858年12月24日—1954年10月6日），号咢堂，日本政治家，有「憲政之神」、「議會政治之父」之稱。\n" },
  mushakoji: { name:"武者小路实笃", char:"武", nation:"日本", title:"作家", desc:"你与武者小路实笃最像——武者小路实笃（1885—1976），日本白桦派作家，倡导「新村」乌托邦。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Saneatsu_Mushanok%C5%8Dji.jpg/330px-Saneatsu_Mushanok%C5%8Dji.jpg", quote:"（新村理想）", intro:"武者小路实笃（1885—1976），日本白桦派作家，倡导「新村」乌托邦。", bio:"武者小路實篤（1885年5月12日—1976年4月9日），日本小說家、詩人、劇作家，愛稱「武者」。白樺派的代表作家之一。\n" },
  nishida: { name:"西田几多郎", char:"西", nation:"日本", title:"哲学家", desc:"你与西田几多郎最像——西田几多郎（1870—1945），日本哲学家，京都学派创始人，提出「场所」哲学。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Kitaro_Nishidain_in_Feb._1943.jpg/330px-Kitaro_Nishidain_in_Feb._1943.jpg", quote:"（绝对无）", intro:"西田几多郎（1870—1945），日本哲学家，京都学派创始人，提出「场所」哲学。", bio:"西田幾多郎，生於日本石川縣河北郡，京都大學文學院教授，為京都學派的哲學家與開創者，同時也是一位俳人。1940年，他從京都大學退休後，得到日本文化勋章。 石川縣西田幾多郎紀念哲學館，位於日本石川縣河北市，是為紀念在當地出生的西田幾多郎相關的文化建築。\n" },
  xixiang: { name:"西乡隆盛", char:"西", nation:"日本", title:"最后的武士", desc:"你刚烈忠义、热血豪迈，坚守武士道精神，为理想不惜一死。你宁折不弯、坦荡磊落，是悲壮而纯粹的武士。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Saigo_Takamori.jpg/330px-Saigo_Takamori.jpg", quote:"敬天爱人", intro:"西乡隆盛（1828—1877），日本明治维新功臣、「最后的武士」，后发动西南战争兵败自尽。", bio:"西鄉隆盛 是日本江户时代末期（幕末）的薩摩藩武士、軍人、政治家。幼名小吉，元服時名隆永（後改武雄、隆盛），通称吉之介（後改善兵衛、吉兵衛、吉之助），号南洲。“隆盛”本為其父西鄉吉兵衛之名，但王政復古成功後朝廷授予位階，吉井友實誤將此名上報，其後將錯就錯，即以隆盛為名。\n" },
  saionji: { name:"西园寺公望", char:"西", nation:"日本", title:"元老政治家", desc:"你与西园寺公望最像——西园寺公望（1849—1940），日本最后一位元老，倾向宪政与和平外交。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Kinmochi_Saionji_2.jpg/330px-Kinmochi_Saionji_2.jpg", quote:"宪政与和平", intro:"西园寺公望（1849—1940），日本最后一位元老，倾向宪政与和平外交。", bio:"西园寺公望，日本明治时代政治家、教育家，日本前內閣總理大臣及枢密院议长。是日本自明治到大正時期直至戰前的政治元老。其号陶庵，为宫廷贵族清华家出身，是德大寺公纯的次子，后过继给西园寺师季而改姓。20世纪初期曾与桂太郎交替出任日本首相，這段時期是為桂園時代。1920年（大正9年）9月7日授公爵。\n" },
  soseki: { name:"夏目漱石", char:"漱", nation:"日本", title:"文豪", desc:"你与夏目漱石最像——夏目漱石（1867—1916），日本文豪，著《我是猫》《心》，批判近代文明。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Natsume_Soseki_photo.jpg/330px-Natsume_Soseki_photo.jpg", quote:"我是猫", intro:"夏目漱石（1867—1916），日本文豪，著《我是猫》《心》，批判近代文明。", bio:"夏目漱石，本名夏目金之助，日本明治至大正時代的作家、時事評論家、英文學者。俳號“愚陀弘”，在文壇上的活躍時期約明治末期至大正初期，也被認為是日本現代文學中最偉大的作家之一，有“國民大作家”之譽。\n" },
  kobayashi: { name:"小林多喜二", char:"小", nation:"日本", title:"无产阶级作家", desc:"你与小林多喜二最像——小林多喜二（1903—1933），日本无产阶级作家，著《蟹工船》，被特高警察拷打致死。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Takiji_Kobayashi.JPG/330px-Takiji_Kobayashi.JPG", quote:"（《蟹工船》）", intro:"小林多喜二（1903—1933），日本无产阶级作家，著《蟹工船》，被特高警察拷打致死。", bio:"小林多喜二（1903年12月1日—1933年2月20日）是日本無產階級文學的代表作家、小說家。\n" },
  kobayashihideo: { name:"小林秀雄", char:"小", nation:"日本", title:"文艺评论家", desc:"你与小林秀雄最像——小林秀雄（1902—1983），日本文艺评论家，奠定近代批评传统。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Hideo_Kobayashi_photographed_by_Shigeru_Tamura.jpg/330px-Hideo_Kobayashi_photographed_by_Shigeru_Tamura.jpg", quote:"（批评是自我）", intro:"小林秀雄（1902—1983），日本文艺评论家，奠定近代批评传统。", bio:"小林秀雄（1902年4月11日—1983年3月1日），日本作家與文藝評論家。\n" },
  nitobe: { name:"新渡户稻造", char:"新", nation:"日本", title:"国际主义者", desc:"你与新渡户稻造最像——新渡户稻造（1862—1933），日本教育家，著《武士道》，致力于国际交流。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Monsieur_Inaz%C5%8D_Nitobe.jpg/330px-Monsieur_Inaz%C5%8D_Nitobe.jpg", quote:"我愿做太平洋的桥梁", intro:"新渡户稻造（1862—1933），日本教育家，著《武士道》，致力于国际交流。", bio:"新渡戶稻造，日本国际政治活动家、农学家及教育家。生於今日岩手县的盛冈市。任臺灣總督府殖產局長時於1901年提出《糖業改良意見書》，對臺灣糖業有重大影響；被稱為「臺灣糖業之父」，與磯永吉（被稱為「臺灣蓬萊米之父」）同為日本治臺時期影響日後臺灣農業發展的專家。\n" },
  kotoku: { name:"幸德秋水", char:"幸", nation:"日本", title:"社会主义者", desc:"你与幸德秋水最像——幸德秋水（1871—1911），日本社会主义者，大逆事件中被处死。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/KotokuShusui.jpg/330px-KotokuShusui.jpg", quote:"（社会主义先驱）", intro:"幸德秋水（1871—1911），日本社会主义者，大逆事件中被处死。", bio:"幸德秋水（1871年11月5日—1911年1月24日），日本明治時代的記者、思想家、社會主義者、無政府主義者。本名幸德傳次郎，秋水這個名字來源於《莊子·秋水篇》，是其師父中江兆民起的。他是「幸德大逆事件」中被處刑12人中的一人。\n" },
  nosaka: { name:"野坂参三", char:"野", nation:"日本", title:"共产党领袖", desc:"你与野坂参三最像——野坂参三（1892—1993），日本共产党领导人，长期从事革命活动。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Sanz%C5%8D_Nosaka_photographed_by_Shigeru_Tamura.jpg/330px-Sanz%C5%8D_Nosaka_photographed_by_Shigeru_Tamura.jpg", quote:"（日共）", intro:"野坂参三（1892—1993），日本共产党领导人，长期从事革命活动。", bio:"野坂參三，原名小野參弎，男，日本政治家、共產主義者。歷任日本共產黨第一書記、日本共產黨議長、共產國際日本代表等職務。他在中國期間的名字岡野進是毛澤東為他起的。此外他還用過林哲、野坂鐵嶺、野坂鐵等化名。\n" },
  ito: { name:"伊藤博文", char:"伊", nation:"日本", title:"明治宪法之父", desc:"你务实而灵活，善于在传统与西方之间寻找平衡，主持立宪、推动维新。你精于政略、步步为营，是制度化的现代化推手。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/IT%C5%8C_Hirobumi.jpg/330px-IT%C5%8C_Hirobumi.jpg", quote:"醉卧美人膝，醒握天下权", intro:"伊藤博文（1841—1909），日本首任内阁总理大臣，主持制定明治宪法，推动立宪与维新。", bio:"伊藤博文，幼名利助，字俊辅，号春亩、滄浪閣主人，本姓林氏。日本近代政治家，明治维新元老，是前往英國留學的長州五傑之一。1885年起四任內閣總理大臣，1888年起三任枢密院议长，並歷任台湾事务总裁和韓國统监，帶領日本完成西化，主持制订《大日本帝国宪法》，策劃發動甲午中日战争。1909年，與俄羅斯談判之際，在哈尔滨火车站被朝鲜独立运动人士安重根刺殺。\n" },
  nagata: { name:"永田铁山", char:"永", nation:"日本", title:"陆军统制派", desc:"你与永田铁山最像——永田铁山（1884—1935），日本陆军统制派核心，主张国家总动员的总体战体制，被皇道派刺杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Tessan_Nagata_2.jpg/330px-Tessan_Nagata_2.jpg", quote:"总体战与国家总动员", intro:"永田铁山（1884—1935），日本陆军统制派核心，主张国家总动员的总体战体制，被皇道派刺杀。", bio:"永田铁山，日本帝国陆军军人，日本陆军中统制派的核心人物之一，致力於推動陸軍的現代化，作為包括：大力提倡國家總動員以使日本能進行現代總體戰、領導軍部和革新官僚、財政界結合，擴大陸軍影響力以及協助關東軍、控制日本對華政策，使中日雙方衝突與日俱增。永田最終因日本陆军内部统制派和皇道派的纷争，於1935年8月12日相泽事件中被杀，追晋陆军中將。\n" },
  arishima: { name:"有岛武郎", char:"有", nation:"日本", title:"作家", desc:"你与有岛武郎最像——有岛武郎（1878—1923），日本白桦派作家，著《一个女人》，殉情而死。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Arishima_Takeo.jpg/330px-Arishima_Takeo.jpg", quote:"（白桦派）", intro:"有岛武郎（1878—1923），日本白桦派作家，著《一个女人》，殉情而死。", bio:"有島武郎 是一名日本小說家。於學習院畢業後，因有志於向農學發展而升讀札幌農業學校（今北海道大學）。信奉基督教，後來更接受洗禮。1903年到美國留學。歸國後參與文藝雜誌《白樺 (杂志)》的編制工作，是白樺派的代表人物之一。1923年，於輕井澤別院淨月莊中，與波多野秋子共同殉情。其作品《該隱的末裔》）、《一个女人》（或る女）等都是膾炙人口的佳作。\n" },
  yosano: { name:"与谢野晶子", char:"晶", nation:"日本", title:"女诗人", desc:"你与与谢野晶子最像——与谢野晶子（1878—1942），日本女诗人，以《乱发》倡导女性情感解放。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Akiko_Yosano_younger.jpg/330px-Akiko_Yosano_younger.jpg", quote:"（女性觉醒）", intro:"与谢野晶子（1878—1942），日本女诗人，以《乱发》倡导女性情感解放。", bio:"與謝野晶子，是明治至昭和時期活躍的詩人、作家、思想家。婚前姓「鳳」 ；本名為「志やう／しょう〔しやう〕，Shō」，與筆名中汉字「晶」吳音的舊假名「しやう」同音。丈夫為與謝野鐵幹（本名與謝野寬）。她一生著述颇丰，被日本作家田边圣子评为：“一千年才出现一个的天才。” \n" },
  hara: { name:"原敬", char:"原", nation:"日本", title:"平民宰相", desc:"你与原敬最像——原敬（1856—1921），日本首位「平民宰相」，推动政党政治，被暗杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Takashi_Hara_formal.jpg/330px-Takashi_Hara_formal.jpg", quote:"以政党内阁立宪", intro:"原敬（1856—1921），日本首位「平民宰相」，推动政党政治，被暗杀。", bio:"原敬，幼名健次郎，號一山、逸山，日本東山道陸奧國岩手郡本宮村（今岩手縣盛岡市）人，內務大臣、內閣總理大臣（首相）兼司法大臣。\n" },
  saito: { name:"斋藤实", char:"斋", nation:"日本", title:"海军首相", desc:"你与斋藤实最像——斋藤实（1858—1936），日本海军大将、首相，二二六事件中被叛军刺杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Makoto_Saito_2.jpg/330px-Makoto_Saito_2.jpg", quote:"（被刺杀）", intro:"斋藤实（1858—1936），日本海军大将、首相，二二六事件中被叛军刺杀。", bio:"齋藤實，幼名富五郎。日本東山道陸奧國膽澤郡鹽竈村（今岩手縣奧州市水澤）人，內閣總理大臣兼外務大臣與文部大臣、内大臣。任期內外交趨向強硬，承認滿洲國並主導日本退出了國際聯盟。\n" },
  masaki: { name:"真崎甚三郎", char:"真", nation:"日本", title:"皇道派", desc:"你与真崎甚三郎最像——真崎甚三郎（1876—1956），日本陆军皇道派核心，二二六事件后被编入预备役。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Masaki_Jinzaburo.jpg/330px-Masaki_Jinzaburo.jpg", quote:"（皇道派）", intro:"真崎甚三郎（1876—1956），日本陆军皇道派核心，二二六事件后被编入预备役。", bio:"真崎甚三郎，日本陸軍軍官，陸士9期、陸大19期毕业生。陸軍大将军衔。荣典为正三位勲三等功四級。\n" },
  shiga: { name:"志贺直哉", char:"志", nation:"日本", title:"小说之神", desc:"你与志贺直哉最像——志贺直哉（1883—1971），日本小说家，被誉为「小说之神」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Shiga_Naoya_1938.jpg/330px-Shiga_Naoya_1938.jpg", quote:"（心境小说）", intro:"志贺直哉（1883—1971），日本小说家，被誉为「小说之神」。", bio:"志賀直哉，出生在日本宮城縣石卷市。東京帝國大學英語文學系肄業，師從內村鑑三。他是白桦派的代表作家之一，被誉为日本“小说之神”。其代表作是长篇小说《暗夜行路》、《和解》、《小僧之神》以及《在城崎》等。\n" },
  nakasone: { name:"中曾根康弘", char:"中", nation:"日本", title:"保守首相", desc:"你与中曾根康弘最像——中曾根康弘（1918—2019），日本首相，推行行政改革与民族主义路线。", img:"https://upload.wikimedia.org/wikipedia/commons/8/83/Yasuhiro_Nakasone_19821127.jpg", quote:"（战后政治总决算）", intro:"中曾根康弘（1918—2019），日本首相，推行行政改革与民族主义路线。", bio:"中曾根康弘，日本政治家。第71－73任日本內閣總理大臣（首相）。\n" },
  nakajima: { name:"中岛敦", char:"敦", nation:"日本", title:"作家", desc:"你与中岛敦最像——中岛敦（1909—1942），日本作家，著《山月记》，英年早逝。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Atsushi_Nakajima.jpg/330px-Atsushi_Nakajima.jpg", quote:"（《山月记》）", intro:"中岛敦（1909—1942），日本作家，著《山月记》，英年早逝。", bio:"中島敦，日本小説家，1933年畢業於東京帝國大學國文學系，曾任私立横濱高等女子學校 國語及英語教師。\n" },
  nakae: { name:"中江兆民", char:"中", nation:"日本", title:"民权思想家", desc:"你与中江兆民最像——中江兆民（1847—1901），日本思想家，被称为「东洋的卢梭」，倡导民权。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Portrait_of_Chomin_Nakae_%28taken_in_September_1901%29.jpg/330px-Portrait_of_Chomin_Nakae_%28taken_in_September_1901%29.jpg", quote:"自由、平等、民权", intro:"中江兆民（1847—1901），日本思想家，被称为「东洋的卢梭」，倡导民权。", bio:"中江兆民，日本明治時代思想家、記者、政治理论家，自由民权运动的代表人物。\n" },
  shigemitsu: { name:"重光葵", char:"重", nation:"日本", title:"外交家", desc:"你与重光葵最像——重光葵（1887—1957），日本外交家，在密苏里号上签署投降书。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Shigemitsu_Mamoru.jpg/330px-Shigemitsu_Mamoru.jpg", quote:"败而不馁，以外交重建", intro:"重光葵（1887—1957），日本外交家，在密苏里号上签署投降书。", bio:"重光葵，日本在二战结束时的外務大臣，活躍於第一次世界大戰以後至第二次世界大戰及當時中日韓滿洲國政壇的外交領域，長達40年，幕後參與甚至主導許多日本侵略各國統治及外交政策制訂，最著名的莫過於在東北的謀略，成功找出溥儀，並利用其建立滿洲國，戰後他代表日本與盟军簽訂投降條約，並寫出《『昭和の動乱』(上・下巻)》。\n" },
  takeuchi: { name:"竹内好", char:"竹", nation:"日本", title:"中国文学研究者", desc:"你与竹内好最像——竹内好（1910—1977），日本中国文学研究者，以鲁迅研究闻名。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Takeuchi_Yoshimi.JPG/330px-Takeuchi_Yoshimi.JPG", quote:"（鲁迅研究）", intro:"竹内好（1910—1977），日本中国文学研究者，以鲁迅研究闻名。", bio:"竹内好，日本文藝評論家、中國文學者，專門研究魯迅、中日關係論和日本文化等等。出生於長野縣南佐久郡臼田町，就讀東京府立一中和東京帝国大学文学部支那文学科，在學期間與武田泰淳等人組成「中国文学研究会」。\n" },
  satoharuo: { name:"佐藤春夫", char:"春", nation:"日本", title:"诗人", desc:"你与佐藤春夫最像——佐藤春夫（1892—1964），日本诗人、作家，以《殉情诗集》闻名。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Haruo_Sato_01.jpg/330px-Haruo_Sato_01.jpg", quote:"（抒情诗）", intro:"佐藤春夫（1892—1964），日本诗人、作家，以《殉情诗集》闻名。", bio:"佐藤春夫（1892年4月9日—1964年5月6日）日本的小說家、詩人。\n" },
  sato: { name:"佐藤荣作", char:"佐", nation:"日本", title:"战后首相", desc:"你与佐藤荣作最像——佐藤荣作（1901—1975），日本首相，提出「无核三原则」，获诺贝尔和平奖。", img:"https://upload.wikimedia.org/wikipedia/commons/2/23/Eisaku_Sato_19641109.jpg", quote:"（无核三原则）", intro:"佐藤荣作（1901—1975），日本首相，提出「无核三原则」，获诺贝尔和平奖。", bio:"佐藤榮作，日本政治家，前日本內閣總理大臣（首相），執政长達7年8個月，曾經是連續總任期最長的日本首相（2020年8月才被安倍晋三超越）。其親兄岸信介亦曾為總理大臣。他也是前任日本首相安倍晋三的外叔公。岸信介、佐藤榮作、安倍晋三，被稱作「一家三宰相」、「一門三首相」的美稱。\n" },
  ahnchangho: { name:"安昌浩", char:"浩", nation:"韩国", title:"独立运动家", desc:"你与安昌浩最像——安昌浩（1878—1938），韩国独立运动家，主张以教育与人格建设救国。", img:"https://upload.wikimedia.org/wikipedia/commons/1/1b/Ahn_Changho.jpg", quote:"务实力行，以人格救国", intro:"安昌浩（1878—1938），韩国独立运动家，主张以教育与人格建设救国。", bio:"安昌浩，雅號島山（도산），字致三（치삼），韩国独立运动政治家，是早期在美國的韩侨领导人，新民会、大韩人国民会、兴士团等韩国独立运动组织创始人，韩国建国勋章获得者，有「朝鮮民族獨立之父」之称。\n" },
  an: { name:"安重根", char:"安", nation:"韩国", title:"民族义士", desc:"你热血刚烈、气节凛然，为民族大义甘愿舍身。你宁为玉碎、视死如归，是宁折不弯的民族英雄。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/An_Jung-geun.JPG/330px-An_Jung-geun.JPG", quote:"以一死报国，求民族独立", intro:"安重根（1879—1910），韩国独立运动家，刺杀伊藤博文，被处死，是韩民族英雄。", bio:"安重根，字应七，韩国独立运动义兵参谋中将，1909年10月26日在哈尔滨火车站刺杀了推动签订《乙巳条约》并担任日本首任朝鲜统监的伊藤博文。\n" },
  chosan: { name:"曹奉岩", char:"曹", nation:"韩国", title:"进步政治家", desc:"你与曹奉岩最像——曹奉岩（1898—1959），韩国进步政治家，主张和平统一，被处决。", img:"", quote:"和平统一，民主建设", intro:"曹奉岩（1898—1959），韩国进步政治家，主张和平统一，被处决。", bio:"" },
  choenamseon: { name:"崔南善", char:"崔", nation:"韩国", title:"亲日文人", desc:"你与崔南善最像——崔南善（1890—1957），韩国文人，起草三一独立宣言，后转向亲日。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/%EC%B5%9C%EB%82%A8%EC%84%A0.jpg/330px-%EC%B5%9C%EB%82%A8%EC%84%A0.jpg", quote:"（三一宣言起草）", intro:"崔南善（1890—1957），韩国文人，起草三一独立宣言，后转向亲日。", bio:"崔南善，號六堂，本貫東州崔氏、朝鮮半島詩人、歷史家、出版人，与李光洙被視為大韓民國近代文學開拓者。崔南善初爲朝鲜半島獨立運動領導人，后变节为亲日派，是朝鮮半島颇具争议的人物。\n" },
  hongbeomdo: { name:"洪范图", char:"洪", nation:"韩国", title:"抗日将领", desc:"你与洪范图最像——洪范图（1868—1943），韩国独立军将领，领导抗日武装斗争。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Hong_Beom-do_1912.jpg/330px-Hong_Beom-do_1912.jpg", quote:"以枪杆争独立", intro:"洪范图（1868—1943），韩国独立军将领，领导抗日武装斗争。", bio:"洪范图 朝鲜半岛抗日义兵斗争和独立军运动将领，大韩独立军创始人，凤梧洞战役和青山里战役的主要领导人之一，获韓國追授建國勳章。\n" },
  dae: { name:"金大中", char:"中", nation:"韩国", title:"民主斗士", desc:"你坚韧不拔、心怀和平，历经迫害仍坚持民主，用「阳光政策」化敌为友。你理想而不失务实，是宽容的民主领袖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Kim_Dae-jung_presidential_portrait.jpg/330px-Kim_Dae-jung_presidential_portrait.jpg", quote:"行动要像巨人，思想要像深海", intro:"金大中（1924—2009），韩国总统、民主斗士，推动「阳光政策」，获诺贝尔和平奖。", bio:"金大中，号后广（후광），別名忍冬草（인동초），本贯金海金氏，韩国政治家，大韩民国第15任总统，在朴正熙、全斗焕独裁政权期间多次因民主斗争入狱，被称为“亚洲的曼德拉”，2000年获诺贝尔和平奖。\n" },
  kimku: { name:"金九", char:"九", nation:"韩国", title:"独立运动之父", desc:"你坚毅笃诚、矢志独立，主张联合各方、建立统一国家。你德高望重、顾全大局，是民族独立的道义象征。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Kim_Gu_in_1949.jpg/330px-Kim_Gu_in_1949.jpg", quote:"我唯一的愿望，是祖国的完全独立", intro:"金九（1876—1949），韩国独立运动领袖，大韩民国临时政府领导人，后遭暗杀。", bio:"金九，本名昌洙（창수），幼名昌巖（창암），別號白凡（백범），又號斗來（두래），通稱金九，本貫安東金氏，韓國獨立運動家、政治家，大韩民国临时政府的领导人，被現代韓國人尊稱為「大韓民國國父」。\n" },
  kimgyusik: { name:"金奎植", char:"奎", nation:"韩国", title:"独立外交家", desc:"你与金奎植最像——金奎植（1881—1950），韩国独立运动家、外交家，临时政府要员。", img:"https://upload.wikimedia.org/wikipedia/commons/2/21/%EA%B9%80%EA%B7%9C%EC%8B%9D.JPG", quote:"以外交争取独立", intro:"金奎植（1881—1950），韩国独立运动家、外交家，临时政府要员。", bio:"金奎植，號尤史，又号竹笛，韓國獨立運動人物、教育者、政治人物，出生於朝鮮慶尚南道东莱郡。1918年4月大韓民国臨時政府外務宗总長，8月任欧美委員部委員長，1921年任学務部大臣、1933年任学務大臣、1934年任国務委員等职。\n" },
  kimsoyol: { name:"金素月", char:"素", nation:"韩国", title:"诗人", desc:"你与金素月最像——金素月（1902—1934），韩国诗人，以民谣体诗歌抒发民族情感。", img:"", quote:"（民族诗歌）", intro:"金素月（1902—1934），韩国诗人，以民谣体诗歌抒发民族情感。", bio:"金素月，原名金廷湜（김정식），為日治時期的朝鲜诗人，曾發表詩集《杜鵑花》。\n" },
  kimyoungsam: { name:"金泳三", char:"泳", nation:"韩国", title:"文民总统", desc:"你与金泳三最像——金泳三（1927—2015），韩国总统，首位文民总统，清算军政遗留。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Kim_Young-sam_presidential_portrait.jpg/330px-Kim_Young-sam_presidential_portrait.jpg", quote:"匡正历史，清明政治", intro:"金泳三（1927—2015），韩国总统，首位文民总统，清算军政遗留。", bio:"金泳三，号巨山，本貫金寧金氏，是韩国民主运动领袖，韩国第14任总统，也是韩国民主化后的首位文人总统。有媒体称他是“韩国反腐教父”。金泳三与金大中和金钟泌在韩国政坛被称为“三金”，他们共同活跃在政坛的时期被称为“三金时代”。金泳三的座右铭是“大道无门”。\n" },
  kimwonbong: { name:"金元凤", char:"元", nation:"韩国", title:"独立军人", desc:"你与金元凤最像——金元凤（1898—1958），韩国独立军人，义烈团领袖，后投奔朝鲜。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Kim_Won-bong_3.jpg/330px-Kim_Won-bong_3.jpg", quote:"（义烈团）", intro:"金元凤（1898—1958），韩国独立军人，义烈团领袖，后投奔朝鲜。", bio:"金元鳳，号若山（약산），又名金若山，朝鲜独立运动家，朝鲜民主主义人民共和国政治人物，义烈团和朝鲜义勇队创始人，曾任朝鲜民族革命党党首，韩国光复军副司令，大韩民国临时政府军务部长，朝鲜民主主义人民共和国第一任监察相、劳动相、朝鲜劳动党中央委员、最高人民会议常任委员会副委员长等职。\n" },
  kimjwajin: { name:"金佐镇", char:"佐", nation:"韩国", title:"独立军将领", desc:"你与金佐镇最像——金佐镇（1889—1930），韩国独立军将领，指挥青山里大捷。", img:"https://upload.wikimedia.org/wikipedia/commons/9/98/KimJwaJin.gif", quote:"（青山里大捷）", intro:"金佐镇（1889—1930），韩国独立军将领，指挥青山里大捷。", bio:"金佐鎮，字明汝，號白冶，韓國獨立運動家，北路军政署创建人，青山里战役主要领导人之一，获韩国追授建国勋章。\n" },
  rhee: { name:"李承晚", char:"晚", nation:"韩国", title:"大韩民国首任总统", desc:"你强硬顽固、反共亲美，坚信唯有强权与意志才能立国。你固执己见、专断独行，是典型的威权民族主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Rhee_Syng-Man_in_1948.jpg/330px-Rhee_Syng-Man_in_1948.jpg", quote:"先统一，后建设", intro:"李承晚（1875—1965），大韩民国首任总统，坚定反共亲美，长期执政后流亡海外。", bio:"李承晚，初名承龍，號雩南，韓國首任總統（1948年－1960年）、大韩民国临时政府首任总统（1919年－1925年），亦曾被推舉為朝鲜人民共和国首任国家主席。\n" },
  leebeomseok: { name:"李范奭", char:"范", nation:"韩国", title:"独立军将领", desc:"你与李范奭最像——李范奭（1900—1972），韩国独立军将领、首任国务总理。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Lee_Beom-seok.jpg/330px-Lee_Beom-seok.jpg", quote:"以武独立", intro:"李范奭（1900—1972），韩国独立军将领、首任国务总理。", bio:"李範奭（shì），字麟男，号铁骥，又名王云山、哲琦，韓國政治人物、獨立運動家、軍人和外交官。\n" },
  leegwangsu: { name:"李光洙", char:"光", nation:"韩国", title:"作家", desc:"你与李光洙最像——李光洙（1892—1950），韩国近代小说奠基人，著有《无情》。", img:"https://upload.wikimedia.org/wikipedia/commons/f/f6/Lee_Kwang-su_1942.jpg", quote:"以文启蒙", intro:"李光洙（1892—1950），韩国近代小说奠基人，著有《无情》。", bio:"李光洙，字寶鏡，號春園、又号孤舟，本貫全州李氏，是韓國近代小說家和詩人，獨立運動家，后变节为亲日。創氏改名時的日本名是香山光郎。\n" },
  yisang: { name:"李箱", char:"箱", nation:"韩国", title:"作家", desc:"你与李箱最像——李箱（1910—1937），韩国现代主义作家，以实验性写作闻名。", img:"https://upload.wikimedia.org/wikipedia/commons/4/4f/Leesang.jpg", quote:"（现代主义）", intro:"李箱（1910—1937），韩国现代主义作家，以实验性写作闻名。", bio:"李箱，本名金海卿，本贯江陵金氏，是日治时期朝鲜象徵派诗人、作家、小说家、随笔家、建筑师。\n" },
  yeom: { name:"廉想涉", char:"廉", nation:"韩国", title:"作家", desc:"你与廉想涉最像——廉想涉（1897—1963），韩国现实主义作家，著有《三代》。", img:"", quote:"写实即责任", intro:"廉想涉（1897—1963），韩国现实主义作家，著有《三代》。", bio:"" },
  yu: { name:"柳宽顺", char:"柳", nation:"韩国", title:"三一运动志士", desc:"你与柳宽顺最像——柳宽顺（1902—1920），韩国三一运动的学生领袖，狱中牺牲。", img:"", quote:"大韩独立万岁", intro:"柳宽顺（1902—1920），韩国三一运动的学生领袖，狱中牺牲。", bio:"柳寬順 被譽為大韓民國的聖女貞德。她原是梨花學堂（今日梨花女子大學）的學生。 1919年3月1日在京城（今首爾）鍾路區的塔洞公園參與韓國獨立運動，並簽署獨立宣言，成為獨立運動家。之後她把獨立的信息帶返家鄉，並主導多次社會運動。她後來被捕，並被判處7年徒刑。這刑期在33位獨立宣言簽署人當中，刑期最高。基於這個理由，她要求上訴，並被移送至京城。在京城她没有得到減" },
  roh: { name:"卢泰愚", char:"卢", nation:"韩国", title:"军人总统", desc:"你与卢泰愚最像——卢泰愚（1932—2021），韩国总统，军人出身，推动民主化与经济腾飞。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Roh_Tae-woo_%28%EB%85%B8%ED%83%9C%EC%9A%B0_%29_Presidential_Potraits.jpg/330px-Roh_Tae-woo_%28%EB%85%B8%ED%83%9C%EC%9A%B0_%29_Presidential_Potraits.jpg", quote:"以秩序求发展", intro:"卢泰愚（1932—2021），韩国总统，军人出身，推动民主化与经济腾飞。", bio:"盧泰愚，号庸堂（용당），本贯交河卢氏，韩国第13任总统，韓國陸軍退役將領。\n" },
  rohmoo: { name:"卢武铉", char:"铉", nation:"韩国", title:"民主总统", desc:"你与卢武铉最像——卢武铉（1946—2009），韩国总统，出身平民，主张参与民主，后跳崖身亡。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Roh_Moo-hyun_presidential_portrait.jpg/330px-Roh_Moo-hyun_presidential_portrait.jpg", quote:"人活着的世界", intro:"卢武铉（1946—2009），韩国总统，出身平民，主张参与民主，后跳崖身亡。", bio:"卢武铉，韩国政治人物，第16任韓國總統，从政前曾任法官、律师。卢武铉出身寒门，由于家境贫穷，他读完初中后，没能继续读普通高中而是去可以提供奖学金的釜山商业高中。职业高中成為他最后的学历，这使得他成为韩国历史上学历最低的总统。他也因此被称为“平民总统”、“草根总统”。\n" },
  yeoun: { name:"吕运亨", char:"运", nation:"韩国", title:"独立左派", desc:"你与吕运亨最像——吕运亨（1886—1947），韩国独立运动家，主张左右合作建国，被暗杀。", img:"https://upload.wikimedia.org/wikipedia/commons/2/23/1947_%EC%97%AC%EC%9A%B4%ED%98%95.jpg", quote:"民族独立高于意识形态", intro:"吕运亨（1886—1947），韩国独立运动家，主张左右合作建国，被暗杀。", bio:"呂運亨，本贯咸陽呂氏，號夢陽，韓國獨立運動家。曾任朝鲜人民共和国副主席。\n" },
  bakmokwol: { name:"朴木月", char:"木", nation:"韩国", title:"诗人", desc:"你与朴木月最像——朴木月（1916—1978），韩国青鹿派诗人，以乡土抒情诗闻名。", img:"", quote:"（青鹿派）", intro:"朴木月（1916—1978），韩国青鹿派诗人，以乡土抒情诗闻名。", bio:"" },
  bakeunsik: { name:"朴殷植", char:"殷", nation:"韩国", title:"独立史学家", desc:"你与朴殷植最像——朴殷植（1859—1925），韩国独立运动家、史学家，著《韩国痛史》。", img:"https://upload.wikimedia.org/wikipedia/commons/f/f3/%EB%B0%95%EC%9D%80%EC%8B%9D.JPG", quote:"（韩国痛史）", intro:"朴殷植（1859—1925），韩国独立运动家、史学家，著《韩国痛史》。", bio:"朴殷植，字圣七，号谦谷、白岩，韩国独立运动家，思想家、史学家，大韩民国临时政府第二任总统。\n" },
  park: { name:"朴正熙", char:"朴", nation:"韩国", title:"汉江奇迹缔造者", desc:"你强硬务实、纪律严明，以铁腕推动工业化与经济增长。你重秩序、重结果，是威权发展主义的代表。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Park_Chung_Hee_%28%EB%B0%95%EC%A0%95%ED%9D%AC%29_Presidential_Portrait.jpg/330px-Park_Chung_Hee_%28%EB%B0%95%EC%A0%95%ED%9D%AC%29_Presidential_Portrait.jpg", quote:"我们也要过上好日子——自助者天助", intro:"朴正熙（1917—1979），韩国总统，以铁腕推动工业化，缔造「汉江奇迹」，遇刺身亡。", bio:"朴正熙，号中树，大韩民国第5至9届总统，是韩国宪政史上执政时间最长的国家元首，亦是韩国第18届总统朴槿惠的父亲。\n" },
  chun: { name:"全斗焕", char:"全", nation:"韩国", title:"威权统治者", desc:"你冷酷强硬、野心勃勃，以军事力量镇压异己、掌控政权。你重权力与秩序，是铁腕的威权统治者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Chun_Doo-hwan_%28%EC%A0%84%EB%91%90%ED%99%98%29_Presidential_Portrait.jpg/330px-Chun_Doo-hwan_%28%EC%A0%84%EB%91%90%ED%99%98%29_Presidential_Portrait.jpg", quote:"以强力维持秩序，以铁腕推进统治", intro:"全斗焕（1931—2021），韩国总统，通过军事政变上台，以铁腕镇压民主运动。", bio:"全斗煥，号日海（일해），本贯完山全氏，大韓民國第11、12任總統，韓國陸軍退役軍官（上將军衔）。\n" },
  shinchaeho: { name:"申采浩", char:"申", nation:"韩国", title:"史学家", desc:"你与申采浩最像——申采浩（1880—1936），韩国史学家、独立运动家，狱中绝食而亡。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/%EB%8B%A8%EC%9E%AC%EC%8B%A0%EC%B1%84%ED%98%B8.jpg/330px-%EB%8B%A8%EC%9E%AC%EC%8B%A0%EC%B1%84%ED%98%B8.jpg", quote:"历史是民族之魂", intro:"申采浩（1880—1936），韩国史学家、独立运动家，狱中绝食而亡。", bio:"申采浩，字丹斋，笔名无涯生、锦颊山人、燕市梦人、赤心等，韩国独立运动家、历史学家、作家。\n" },
  shingyusik: { name:"申圭植", char:"圭", nation:"韩国", title:"独立运动家", desc:"你与申圭植最像——申圭植（1880—1922），韩国独立运动家，推动中韩联合抗日。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Shin_Gyu-shik.jpg/330px-Shin_Gyu-shik.jpg", quote:"（中韩联合）", intro:"申圭植（1880—1922），韩国独立运动家，推动中韩联合抗日。", bio:"申圭植，又名申柽（chēng），字睨观，别号青丘、一民、余胥等，韩国独立运动家，诗人、文学家、教育家、外交家，参加辛亥革命的唯一外国人，也是参加中国资产阶级革命的第一位韩国人，原大韩民国临时政府政议院副议长、代国务总理兼法务总长、外务总长、财务总长和劳动总办。\n" },
  sonkeechung: { name:"孙基祯", char:"孙", nation:"韩国", title:"民族英雄", desc:"你与孙基祯最像——孙基祯（1912—2002），韩国马拉松冠军，柏林奥运夺冠时拒向日旗行礼。", img:"", quote:"（奥运冠军）", intro:"孙基祯（1912—2002），韩国马拉松冠军，柏林奥运夺冠时拒向日旗行礼。", bio:"孫基禎，朝鮮日治時期男子馬拉松運動員，1936年柏林夏季奧運會男子馬拉松項目冠軍，是首位在奧林匹克運動會奪得金牌與獎牌的朝鲜半島運動員，曾擔任韓國独立后的田徑聯盟主席及韓國體育協會會長。\n" },
  yundongju: { name:"尹东柱", char:"柱", nation:"韩国", title:"诗人", desc:"你与尹东柱最像——尹东柱（1917—1945），韩国诗人，在日据时期以诗坚守民族灵魂，死于狱中。", img:"https://upload.wikimedia.org/wikipedia/commons/5/5a/Sky%2C_Wind%2C_Star_and_Poem_%281955%29%2C_p.3_image.jpg", quote:"天空、风、星星和诗", intro:"尹东柱（1917—1945），韩国诗人，在日据时期以诗坚守民族灵魂，死于狱中。", bio:"尹东柱，原名尹海煥，诗人，朝鲜独立运动家，朝鲜半岛近代民族文学代表性人物，有诗集《天空、风、星星和诗》留世。\n" },
  yunbonggil: { name:"尹奉吉", char:"尹", nation:"韩国", title:"抗日义士", desc:"你与尹奉吉最像——尹奉吉（1908—1932），韩国义士，在上海虹口公园炸毙日军高官，就义。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E5%B0%B9%E5%A5%89%E5%90%89.jpg/330px-%E5%B0%B9%E5%A5%89%E5%90%89.jpg", quote:"以一死雪国耻", intro:"尹奉吉（1908—1932），韩国义士，在上海虹口公园炸毙日军高官，就义。", bio:"尹奉吉，本名禹儀，號梅軒，別號奉吉，本贯坡平尹氏，韩国独立运动家，虹口公园爆炸事件实施者。\n" },
  yunposun: { name:"尹潜善", char:"潜", nation:"韩国", title:"总统", desc:"你与尹潜善最像——尹潜善（1897—1990），韩国第4任总统，历经威权与民主转型时期。", img:"", quote:"（威权过渡）", intro:"尹潜善（1897—1990），韩国第4任总统，历经威权与民主转型时期。", bio:"尹潽善， 字敬天，号海葦（해위），本貫海平尹氏，為大韓民国第4任總統，上任九個月後即遭朴正熙發動5·16軍事政變推翻。其堂伯父為基督教指導者尹致昊。\n" },
  jangmyeon: { name:"张勉", char:"勉", nation:"韩国", title:"民主政治家", desc:"你与张勉最像——张勉（1899—1966），韩国民主政治家、国务总理，被军人政变推翻。", img:"", quote:"以议会民主立国", intro:"张勉（1899—1966），韩国民主政治家、国务总理，被军人政变推翻。", bio:"张勉可以指：\n張勉 (應州)，山西省大同府應州人，正統四年己未科進士。\n張勉 (韓國)，韓國4任副總統，2任，7任總理。" },
  zhaosoang: { name:"赵素昂", char:"赵", nation:"韩国", title:"独立思想家", desc:"你与赵素昂最像——赵素昂（1887—1958），韩国独立运动家，提出「三均主义」建国方略。", img:"https://upload.wikimedia.org/wikipedia/commons/0/03/%EC%A1%B0%EC%86%8C%EC%95%99.jpg", quote:"三均主义", intro:"赵素昂（1887—1958），韩国独立运动家，提出「三均主义」建国方略。", bio:"赵素昂，本名镛殷，字敬仲，号亚隐，韩国独立运动家、政治家、外交家、历史学家，通晓韩、中、日、英多种语言。\n" },
  choi: { name:"崔庸健", char:"崔", nation:"朝鲜", title:"革命元老", desc:"你与崔庸健最像——崔庸健（1900—1976），朝鲜革命元老，抗联与朝鲜建国的参与者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/%E5%B4%94%E5%BA%B8%E5%81%A5_%EC%B5%9C%EC%9A%A9%EA%B1%B4.jpg/330px-%E5%B4%94%E5%BA%B8%E5%81%A5_%EC%B5%9C%EC%9A%A9%EA%B1%B4.jpg", quote:"为革命奉献一生", intro:"崔庸健（1900—1976），朝鲜革命元老，抗联与朝鲜建国的参与者。", bio:"崔庸健，又名崔石泉、崔秋海、金志剛等，朝鲜平安北道龙川郡人，朝鲜民主主义人民共和国国家元首级别领导人、共和国元帅，原东北抗日联军将领。\n" },
  kimhyungjik: { name:"金亨稷", char:"亨", nation:"朝鲜", title:"独立活动家", desc:"你与金亨稷最像——金亨稷（1894—1926），朝鲜独立运动家，金日成之父。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/%E9%87%91%E4%BA%A8%E7%A8%B7_1.jpg/330px-%E9%87%91%E4%BA%A8%E7%A8%B7_1.jpg", quote:"以教育救国", intro:"金亨稷（1894—1926），朝鲜独立运动家，金日成之父。", bio:"金亨稷（jì） 是朝鲜民主主义人民共和国建国领导人金日成的父亲、以及前任的朝鲜最高领导人金正日的祖父，以及現任朝鲜最高领导人金正恩的曾祖父，朝鲜独立运动人物。本貫是朝鮮全州金氏。\n" },
  kim: { name:"金日成", char:"成", nation:"朝鲜", title:"开国领袖", desc:"你意志坚定、野心勃勃，以「主体思想」建立绝对权威。你崇尚革命与集权、反帝反殖，是彻底的威权革命者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Kim_Il_Sung_Portrait-3.jpg/330px-Kim_Il_Sung_Portrait-3.jpg", quote:"人是自己命运的主人", intro:"金日成（1912—1994），朝鲜民主主义人民共和国缔造者与最高领导人，创立「主体思想」。", bio:"金日成，原名金成柱，是朝鲜劳动党、朝鲜人民军及朝鲜民主主义人民共和国主要建立者之一，長期擔任朝鮮勞動黨中央委員會總書記、朝鮮民主主義人民共和國主席等重要领导职务，也是政治思想體系“主体思想”的開創者。金日成生於朝鮮日治時期，自抗日游擊隊起家；第二次世界大戰結束後，他獲得蘇聯支持，在朝鮮半島北部建立朝鲜民主主义人民共和国，並终身担任其最高领导人，至1994年於" },
  kimjongil: { name:"金正日", char:"正", nation:"朝鲜", title:"朝鲜最高领导人", desc:"你与金正日最像——金正日（1941—2011），朝鲜最高领导人，推行「先军政治」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Kim_Jong_il_Portrait-2.jpg/330px-Kim_Jong_il_Portrait-2.jpg", quote:"先军政治", intro:"金正日（1941—2011），朝鲜最高领导人，推行「先军政治」。", bio:"金正日，是朝鮮民主主義人民共和國的第二代最高領導人，朝鲜劳动党永远的总书记。生前擔任朝鮮勞動黨中央委員會總書記、朝鲜民主主义人民共和国国务委员会委员长、朝鮮人民軍最高司令官及朝鲜劳动党中央军事委员会委員長等職務。金正日是朝鮮建國第一代最高領導人金日成的長子，其母為金正淑。金正日经过实际上的世襲制擔任朝鲜最高领导人，統治朝鮮長達17年162天。\n" },
  caipeihuo: { name:"蔡培火", char:"蔡", nation:"台湾", title:"议会请愿", desc:"你与蔡培火最像——蔡培火（1889—1983），台湾议会请愿运动领袖，抗日志士。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Tshu%C3%A0_Pu%C3%AA-Hu%C3%A9_0.jpg/330px-Tshu%C3%A0_Pu%C3%AA-Hu%C3%A9_0.jpg", quote:"（台湾议会）", intro:"蔡培火（1889—1983），台湾议会请愿运动领袖，抗日志士。", bio:"蔡培火（1889年5月22日—1983年1月4日），號峰山，臺灣政治人物，雲林縣北港鎮人，日治時期曾從事社會運動，戰後曾任中華民國紅十字會副會長、立法委員、行政院政務委員。\n" },
  chenwencheng: { name:"陈文成", char:"文", nation:"台湾", title:"民主志士", desc:"你与陈文成最像——陈文成（1950—1981），台湾民主运动者，返台后遭迫害身亡。", img:"https://upload.wikimedia.org/wikipedia/zh/a/ae/Chen_Wen-chen.jpg", quote:"（被迫害致死）", intro:"陈文成（1950—1981），台湾民主运动者，返台后遭迫害身亡。", bio:"陳文成（1950年1月30日—1981年7月3日），臺灣統計學家，新北市中和區人，生於林口區，密西根大學博士，曾任美國卡內基梅隆大學統計系助理教授，長期關心臺灣民主運動。陳於1979年自美國打越洋電話給施明德表示捐助《美麗島雜誌》一事被警備總部所監聽。1981年返臺，被警備總部約談，次日即被發現陳屍於臺灣大學研究生圖書館旁，被稱為陳文成命案或陳文成事件。\n" },
  fusinian: { name:"傅斯年", char:"傅", nation:"台湾", title:"台大校长", desc:"你与傅斯年最像——傅斯年（1896—1950），史学家，首任台大校长，倡导学术自由。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Fu_Ssu-nien_portret.jpg/330px-Fu_Ssu-nien_portret.jpg", quote:"（上穷碧落下黄泉）", intro:"傅斯年（1896—1950），史学家，首任台大校长，倡导学术自由。", bio:"傅斯年（1896年3月26日—1950年12月20日），字孟真，山東聊城人，祖籍江西永豐，中國历史学家、学术领导人。他是五四運動学生领袖之一，歷任国立中山大学文科学长、中央研究院歷史語言研究所所長、國立北京大學代理校长、國立臺灣大學校長等職。\n" },
  guoyuxin: { name:"郭雨新", char:"郭", nation:"台湾", title:"党外运动先驱", desc:"你与郭雨新最像——郭雨新（1908—1985），台湾党外民主运动先驱，被誉为「台湾党外之父」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/%E5%8F%B0%E7%81%A3%E7%9C%81%E5%8F%83%E8%AD%B0%E5%93%A1%E9%83%AD%E9%9B%A8%E6%96%B0.jpg/330px-%E5%8F%B0%E7%81%A3%E7%9C%81%E5%8F%83%E8%AD%B0%E5%93%A1%E9%83%AD%E9%9B%A8%E6%96%B0.jpg", quote:"（党外民主）", intro:"郭雨新（1908—1985），台湾党外民主运动先驱，被誉为「台湾党外之父」。", bio:"郭雨新（1908年8月20日—1985年8月2日），字沖雲，外號「黨外祖師爺」，是出身於臺灣宜蘭的黨外運動政治人物。\n" },
  jing: { name:"蒋经国", char:"经", nation:"台湾", title:"台湾建设者", desc:"你务实勤政、亲民低调，推动经济腾飞又在晚年开放党禁、开启民主。你循序渐进、重视民生，是稳健而开明的现代化推动者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%E8%94%A3%E7%B6%93%E5%9C%8B%E7%B8%BD%E7%B5%B1_1.jpg/330px-%E8%94%A3%E7%B6%93%E5%9C%8B%E7%B8%BD%E7%B5%B1_1.jpg", quote:"时代在变，潮流在变，观念也要跟着变", intro:"蒋经国（1910—1988），台湾地区领导人，推动经济起飞，晚年开放党禁、开启民主化。", bio:"蔣經國（1910年4月27日—1988年1月13日），字建豐，浙江奉化人，中華民國政治人物。蔣經國為蔣中正與毛福梅之獨子，青年時曾赴蘇聯留學，回國後曾在江西、上海等地工作。1949年中華民國政府遷臺後，蔣氏先是主掌國家情報及治安工作，並重建政治作戰體制，維護政權穩定；其後歷任中國青年反共救國團主任、行政院國軍退除役官兵就業輔導委員會主任委員、行政院政務委員、" },
  wei: { name:"蒋渭水", char:"渭", nation:"台湾", title:"台湾民主先驱", desc:"你热血激昂、关心社会，倡导启蒙与民众运动、反抗殖民统治。你理想而激进，是台湾近代社会运动的先声。", img:"https://upload.wikimedia.org/wikipedia/commons/9/9a/Chiang_Wei-shui.jpg", quote:"同胞须团结，团结真有力", intro:"蒋渭水（1891—1931），台湾抗日与民主运动先驱，创办台湾文化协会。", bio:"蔣渭水（1890年8月6日—1931年8月5日），字雪谷，是出身臺灣宜蘭的醫師、社會運動者及民族自決運動者。他是臺灣文化協會及臺灣民眾黨共同創辦人及重要領導人物之一。他是臺灣日治時期反殖運動及自治運動代表性的人物之一。\n" },
  laihe: { name:"赖和", char:"赖", nation:"台湾", title:"台湾文学之父", desc:"你与赖和最像——赖和（1894—1943），台湾作家，被誉为「台湾的鲁迅」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/L%C5%8Da_H%C3%B4_01.jpg/330px-L%C5%8Da_H%C3%B4_01.jpg", quote:"以笔为刀，反抗殖民", intro:"赖和（1894—1943），台湾作家，被誉为「台湾的鲁迅」。", bio:"賴和（1894年5月28日—1943年1月31日），原名賴河，又名賴癸河，筆名懶雲、甫三、安都生、灰、走街先、浪等，是出身臺灣彰化的作家、詩人、醫師與社會運動者。\n" },
  leizhen: { name:"雷震", char:"雷", nation:"台湾", title:"自由主义政治家", desc:"你与雷震最像——雷震（1897—1979），台湾自由主义政治家，《自由中国》创办人，被长期监禁。", img:"", quote:"以言论自由救中国", intro:"雷震（1897—1979），台湾自由主义政治家，《自由中国》创办人，被长期监禁。", bio:"雷震可以指：\n雷震 (1901年)，為南京保衛戰中殉國的士官\n雷震 (1906年)，原名雷振奎，湖北省黃陂縣人，中國人民解放軍開國少將\n雷震 (1897年)，因創辦《自由中國》雜誌批評時政，在1960年至1970年之間入獄十年\n雷震 (1933年)，本名奚重儉，香港男演員" },
  lee: { name:"李登辉", char:"登", nation:"台湾", title:"台湾民主化推动者", desc:"你务实灵活、善于审时度势，推动台湾走向民主与本土化。你深谙权术又勇于变革，是转型期的老练政治家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/%E6%9D%8E%E7%B8%BD%E7%B5%B1%E7%99%BB%E8%BC%9D%E5%85%88%E7%94%9F%E7%8E%89%E7%85%A7_%28cropped%29.jpg/330px-%E6%9D%8E%E7%B8%BD%E7%B5%B1%E7%99%BB%E8%BC%9D%E5%85%88%E7%94%9F%E7%8E%89%E7%85%A7_%28cropped%29.jpg", quote:"生为台湾人的悲哀，也要走出台湾人的尊严", intro:"李登辉（1923—2020），台湾地区领导人，推动台湾民主化与本土化进程。", bio:"李登輝（1923年1月15日—2020年7月30日）是中華民國農業學者與政治人物，曾任中國國民黨主席及中華民國總統。李登輝生於日治臺灣的臺北州淡水郡三芝庄（今新北市三芝區），福佬客家人出身。他畢業於國立臺灣大學、康乃爾大學，專長為農業經濟學；1972年，獲得時任行政院院長蔣經國提拔，出任行政院政務委員，此後歷任臺北市市長、臺灣省政府主席、中華民國副總統等職。" },
  lianheng: { name:"连横", char:"连", nation:"台湾", title:"史学家", desc:"你与连横最像——连横（1878—1936），台湾史学家，著《台湾通史》，保存台湾史料。", img:"", quote:"（台湾通史）", intro:"连横（1878—1936），台湾史学家，著《台湾通史》，保存台湾史料。", bio:"連橫可以指：\n連橫 (外交策略)，中国战国时期的外交手段，與「合縱」相對\n連橫 (歷史學家)（1878－1936），台灣歷史學家，連戰的祖父" },
  linmosheng: { name:"林茂生", char:"茂", nation:"台湾", title:"教育家", desc:"你与林茂生最像——林茂生（1887—1947），台湾教育家、思想家，二二八事件中遇难。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Lin_Mosei.jpg/330px-Lin_Mosei.jpg", quote:"以教育启蒙，以和平争权", intro:"林茂生（1887—1947），台湾教育家、思想家，二二八事件中遇难。", bio:"林茂生（1887年10月30日—1947年3月11日失蹤），字維屏，號耕南，是臺灣歷史上第一位取得東京帝大文學士和第二位取得哲學博士（第一位為柏林大學哲學博士劉明電）、第一位留美博士。林茂生出生於大清帝國福建台灣省臺南府鳳山縣東港，1916年取得日本東京帝國大學文學部哲學科文學士（東洋哲學專攻），1929年取得美國哥倫比亞大學哲學博士（修習教育哲學）。\n" },
  xian: { name:"林献堂", char:"献", nation:"台湾", title:"议会请愿运动领袖", desc:"你温文儒雅、理性克制，以议会请愿的方式争取台湾人的权利。你稳健而坚持，是非暴力抗争的温和派。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/%E8%87%BA%E7%81%A3%E6%96%87%E5%8C%96%E8%88%87%E6%B0%91%E4%B8%BB%E9%81%8B%E5%8B%95%E9%A0%98%E8%A2%96%E6%9E%97%E7%8D%BB%E5%A0%82_Lin_Hsien-tang%2C_Leader_of_Taiwanese_Culture_and_Democracy_Movement.jpg/330px-%E8%87%BA%E7%81%A3%E6%96%87%E5%8C%96%E8%88%87%E6%B0%91%E4%B8%BB%E9%81%8B%E5%8B%95%E9%A0%98%E8%A2%96%E6%9E%97%E7%8D%BB%E5%A0%82_Lin_Hsien-tang%2C_Leader_of_Taiwanese_Culture_and_Democracy_Movement.jpg", quote:"以和平合法的方式争取自治与权利", intro:"林献堂（1881—1956），台湾议会请愿运动领袖，以和平合法方式争取台湾人权利。", bio:"林朝琛（1881年12月13日—1956年9月8日），字獻堂，號灌園，臺灣霧峰林家出身的政治運動者、作家及政治人物等。他是臺灣日治時期臺灣議會民主運動者，也是霧峰林家在當時的主要領導者，以及霧峰林家所在地區社會的領導人之一。\n" },
  monarudao: { name:"莫那鲁道", char:"莫", nation:"台湾", title:"雾社起义领袖", desc:"你与莫那鲁道最像——莫那鲁道（1882—1930），台湾赛德克族领袖，领导雾社起义反抗殖民统治。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Mona_Rudao_and_Seediq_tribal_leaders.jpg/330px-Mona_Rudao_and_Seediq_tribal_leaders.jpg", quote:"（抗日起义）", intro:"莫那鲁道（1882—1930），台湾赛德克族领袖，领导雾社起义反抗殖民统治。", bio:"莫那魯道，在《臺灣日日新報》的漢文版有稱「毛那老」，戰後或稱莫那道，是台灣原住民賽德克族馬赫坡社（今廬山溫泉區）的頭目，台灣日治時期重要的抗日運動——霧社事件的領導者。身材高大魁梧，据说身高将近190公分。霧社事件中因不敵日方火力，飲彈自盡。\n" },
  qiufengjia: { name:"丘逢甲", char:"丘", nation:"台湾", title:"抗日诗人", desc:"你与丘逢甲最像——丘逢甲（1864—1912），台湾抗日志士、诗人，著《春愁》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/%E4%B8%98%E9%80%A2%E7%94%B2.jpg/330px-%E4%B8%98%E9%80%A2%E7%94%B2.jpg", quote:"（春愁）", intro:"丘逢甲（1864—1912），台湾抗日志士、诗人，著《春愁》。", bio:"丘逢甲，原名邱逢甲，台灣客家人，譜名秉渊，字仙根、一字吉甫，又字仲阏，号臺海、蛰仙、华严子、痛哭生、海东遗民、南武山人；辛亥革命後取晚號倉海。生於福建省臺灣府淡水廳銅鑼灣（今苗栗縣銅鑼鄉竹森村），籍屬彰化縣。清朝官員、中華民國臨時參議院代表、文學家、教育家、義軍統領。\n" },
  wangyunwu: { name:"王云五", char:"王", nation:"台湾", title:"出版家", desc:"你与王云五最像——王云五（1888—1979），出版家，商务印书馆总经理，创四角号码检字法。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/%E7%8E%8B%E9%9B%B2%E4%BA%942.jpg/330px-%E7%8E%8B%E9%9B%B2%E4%BA%942.jpg", quote:"（四角号码）", intro:"王云五（1888—1979），出版家，商务印书馆总经理，创四角号码检字法。", bio:"王雲五（1888年7月9日—1979年8月14日），原名之瑞，後改名雲五，字岫廬，男，籍貫廣東香山，生於上海，中國學者、思想家、教育家、出版家和政治家。王自學成材，在1920年代至1930年代主理商務印書館。1948年曾任財政部部長，期間推出金圓券發生惡性通貨膨脹。1949年後到臺灣，並主持台灣商務印書館。著有《物理與政治》《中外圖書統一分類法》《四角號碼檢" },
  wusanlian: { name:"吴三连", char:"吴", nation:"台湾", title:"民主人士", desc:"你与吴三连最像——吴三连（1899—1988），台湾民主人士，台湾文化协会参与者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/19660918%E5%90%B3%E4%B8%89%E9%80%A3.jpg/330px-19660918%E5%90%B3%E4%B8%89%E9%80%A3.jpg", quote:"（台湾自治）", intro:"吴三连（1899—1988），台湾民主人士，台湾文化协会参与者。", bio:"吳三連（1899年11月15日—1988年12月29日），男，臺南學甲人，臺灣政治人物、報人，東京商科大學（今一橋大學）畢業。日治時期曾當過《每日新聞》記者、參與《台灣新民報》的出版。戰後出任國大代表、首位無黨籍臺北市長、臺灣省議會議員，為日治時期與戰後臺灣政治民主化運動、臺灣本土化運動及社會運動的重要先驅人物。\n" },
  wuzhuoliu: { name:"吴浊流", char:"吴", nation:"台湾", title:"作家", desc:"你与吴浊流最像——吴浊流（1900—1976），台湾作家，著《亚细亚的孤儿》，书写台湾人命运。", img:"https://upload.wikimedia.org/wikipedia/zh/2/2e/%E5%90%B3%E6%BF%81%E6%B5%81.jpg", quote:"（亚细亚的孤儿）", intro:"吴浊流（1900—1976），台湾作家，著《亚细亚的孤儿》，书写台湾人命运。", bio:"吳濁流（1900年6月28日—1976年10月7日），本名吳建田，客家人，生於日治臺灣臺北縣新埔辨務署（今日之新竹縣新埔鎮），台灣教師、作家。他在37歲時發表其小說處女作〈水月〉，而後以「孤帆三部曲」《亞細亞的孤兒》、《無花果》、《臺灣連翹》蜚聲文壇。1964年，在反共文學流行下創辦雜誌《臺灣文藝》。1969年，設立「吳濁流文學獎」。\n" },
  xiexuehong: { name:"谢雪红", char:"谢", nation:"台湾", title:"台共领袖", desc:"你与谢雪红最像——谢雪红（1901—1970），台湾共产党创始人，二二八事件领导者。", img:"https://upload.wikimedia.org/wikipedia/commons/1/1a/1952%E8%B0%A2%E9%9B%AA%E7%BA%A2.jpg", quote:"（二二八）", intro:"谢雪红（1901—1970），台湾共产党创始人，二二八事件领导者。", bio:"謝雪紅（1901年10月17日—1970年11月5日），原名謝阿女，台灣彰化人，革命家、政治人物，日治時期台灣共產黨（日本共產黨臺灣民族支部）創始黨員之一、中國共產黨黨員、台灣民主自治同盟首任主席，是中華人民共和國八大民主黨派的政治人物之一。谢雪红被認為是台灣社會主義革命先驅，享有「台灣第一位女革命家」之譽。\n" },
  yangku: { name:"杨逵", char:"逵", nation:"台湾", title:"作家", desc:"你与杨逵最像——杨逵（1906—1985），台湾作家、社会运动家，以《送报夫》闻名。", img:"https://upload.wikimedia.org/wikipedia/commons/6/6f/Yang_Kui_en_1937.jpg", quote:"压不扁的玫瑰花", intro:"杨逵（1906—1985），台湾作家、社会运动家，以《送报夫》闻名。", bio:"楊逵，本名楊貴，籍貫臺灣臺南市新化區，是作家與社會運動者。\n" },
  yin: { name:"殷海光", char:"殷", nation:"台湾", title:"自由主义思想家", desc:"你与殷海光最像——殷海光（1919—1969），台湾自由主义思想家，倡导理性与科学。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/%E6%AE%B7%E6%B5%B7%E5%85%89.jpg/330px-%E6%AE%B7%E6%B5%B7%E5%85%89.jpg", quote:"自由、理性、科学", intro:"殷海光（1919—1969），台湾自由主义思想家，倡导理性与科学。", bio:"殷福生（1919年12月5日—1969年9月16日），筆名殷海光，是出身湖北黄冈的自由主義哲學學者與評論家。他是引介自由主義入臺灣的重要先驅之一，也因在臺灣戒嚴時期持續批評蔣介石政府並遭其打壓而廣為人知。\n" },
  zhangwojun: { name:"张我军", char:"张", nation:"台湾", title:"作家", desc:"你与张我军最像——张我军（1902—1955），台湾作家，台湾新文学运动的先驱。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/%E5%BC%B5%E6%88%91%E8%BB%8D.jpg/330px-%E5%BC%B5%E6%88%91%E8%BB%8D.jpg", quote:"（台湾新文学）", intro:"张我军（1902—1955），台湾作家，台湾新文学运动的先驱。", bio:"張我軍（1902年10月7日—1955年11月3日），臺灣日治時期作家，原名張清榮。筆名一郎、劍華、以齋、四光、大勝、廢兵、野馬、M.S.、老童生等。\n" },
  zhonglihe: { name:"钟理和", char:"钟", nation:"台湾", title:"作家", desc:"你与钟理和最像——钟理和（1915—1960），台湾乡土文学作家，著《原乡人》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Chung_li_ho_1941.jpg/330px-Chung_li_ho_1941.jpg", quote:"（原乡人）", intro:"钟理和（1915—1960），台湾乡土文学作家，著《原乡人》。", bio:"鍾理和，筆名江流、里禾、鍾錚、鍾堅，是出身臺灣六堆的客家作家。鍾氏的代表作有長篇小說《笠山農場》、中篇小說《雨》及短篇小說《原鄉人》、《貧賤夫妻》等，一生創作共計長篇小說一部、中篇小說七部、短篇小說四十一篇，還有部分詩歌和散文等。因咳血而死，被稱為「倒在血泊裡的筆耕者」。\n" },
  bogd: { name:"博格多汗", char:"博", nation:"蒙古", title:"蒙古宗教领袖", desc:"你身兼宗教与世俗领袖，带领蒙古走向独立。你庄重而富有象征意义，是民族自决的精神象征。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Sharav_bogd_khan.jpg/330px-Sharav_bogd_khan.jpg", quote:"蒙古归于蒙古人，重建民族的独立", intro:"博格多汗（1869—1924），第八世哲布尊丹巴，蒙古独立后被拥立为蒙古大汗。", bio:"博克多汗，全称博克多格根额真汗，蒙古國政治、宗教人物，為外蒙古獨立後的第一任最高領袖。原為藏传佛教格魯派的第八世哲布尊丹巴呼图克图，法名阿旺垂济尼玛丹彬旺舒克。中國爆發辛亥革命之后，他被外蒙古各部落推戴為蒙古大汗，宣布脫離滿洲清朝独立，建立政教合一的大蒙古國。不過，蒙古的獨立僅受到西藏的承認，未得到國際社會的廣泛認可，其北鄰俄羅斯對此也採取模棱兩可的態度。1" },
  damdinsuren: { name:"达木丁苏伦", char:"达", nation:"蒙古", title:"文学家", desc:"你与达木丁苏伦最像——策·达木丁苏伦（1908—1986），蒙古文学家、学者，蒙古现代文学奠基人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/TsendiinDamdinsuren.jpg/330px-TsendiinDamdinsuren.jpg", quote:"以文字守护民族文化", intro:"策·达木丁苏伦（1908—1986），蒙古文学家、学者，蒙古现代文学奠基人。", bio:"曾德·达木丁苏伦，出身蒙古哈答斤部，蒙古作家、语言学家、作家，曾三度获得蒙古人民共和国乔巴山元帅奖。他是蒙古国首位“人民作家”、蒙古科学院院士。他也是蒙古國國歌的作詞人。\n" },
  genden: { name:"根登", char:"根", nation:"蒙古", title:"蒙古总理", desc:"你与根登最像——根登（1892—1937），蒙古人民共和国总理，后遭清洗。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Tasik_Biru_Kundang_3.jpg/330px-Tasik_Biru_Kundang_3.jpg", quote:"（独立与革命）", intro:"根登（1892—1937），蒙古人民共和国总理，后遭清洗。", bio:"根登是马来西亚雪兰莪州鹅唛县的一个城镇，距离万挠约14公里，与轰埠毗邻。\n" },

let current = 0;
let scores = {};
let answers = [];
let activeQuestions = [];

function buildOptList() {
  updateOptCount();
}

function updateOptCount() {
  const len = +document.querySelector('input[name="qlen"]:checked').value;
  const maxRank = len === 35 ? 1 : (len === 50 ? 2 : 3);
  const base = questions.filter(q => !q.optional && q.rank <= maxRank).length;
  const regions = { jp: document.getElementById('optToggleJp').checked, cn: document.getElementById('optToggleCn').checked, tw: document.getElementById('optToggleTw').checked };
  const n = questions.filter(q => q.optional && regions[q.region]).length;
  document.getElementById('startBtn').textContent = '开始测试（' + (base + n) + ' 题）';
}

function startQuiz() {
  const len = +document.querySelector('input[name="qlen"]:checked').value;
  const maxRank = len === 35 ? 1 : (len === 50 ? 2 : 3);
  const regions = { jp: document.getElementById('optToggleJp').checked, cn: document.getElementById('optToggleCn').checked, tw: document.getElementById('optToggleTw').checked };
  activeQuestions = questions.filter(q => q.optional ? regions[q.region] : q.rank <= maxRank);
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0; scores = {}; answers = [];
  renderQuestion();
}

function renderQuestion() {
  const q = activeQuestions[current];
  document.getElementById('qNumText').textContent = `第 ${current+1} / ${activeQuestions.length} 题`;
  document.getElementById('dimTag').textContent = DIMS[q.d];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressBar').style.width = `${(current/activeQuestions.length)*100}%`;

  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'option' + (answers[current] === i ? ' selected' : '');
    el.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt.t}</span>`;
    el.onclick = () => selectOption(i);
    box.appendChild(el);
  });

  document.getElementById('prevBtn').classList.toggle('hidden', current === 0);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === activeQuestions.length - 1 ? '查看结果' : '下一题';
  nextBtn.disabled = answers[current] === undefined;
}

function selectOption(i) {
  answers[current] = i;
  document.getElementById('nextBtn').disabled = false;
  document.querySelectorAll('#qOptions .option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

function nextQuestion() {
  if (answers[current] === undefined) return;
  if (current < activeQuestions.length - 1) { current++; renderQuestion(); }
  else showResult();
}

function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }

function showResult() {
  const dimScores = [{}, {}, {}, {}, {}];
  const excluded = new Set();
  answers.forEach((ans, qi) => {
    const opt = activeQuestions[qi].options[ans];
    const s = opt.s;
    const d = activeQuestions[qi].d;
    for (const id in s) dimScores[d][id] = (dimScores[d][id] || 0) + s[id];
    if (opt.exclude) opt.exclude.forEach(id => excluded.add(id));
  });

  const dimMax = [0,0,0,0,0];
  for (let d=0; d<5; d++) {
    for (const id in dimScores[d]) { if (!excluded.has(id) && dimScores[d][id] > dimMax[d]) dimMax[d] = dimScores[d][id]; }
  }
  const ids = new Set();
  for (const dim of dimScores) { for (const id in dim) { if (!excluded.has(id)) ids.add(id); } }
  const ranked = [...ids].map(id => {
    let sum = 0, min = 1, max = 0;
    for (let d=0; d<5; d++) {
      const pct = dimMax[d] ? (dimScores[d][id] || 0) / dimMax[d] : 0;
      sum += pct;
      if (pct < min) min = pct;
      if (pct > max) max = pct;
    }
    const mean = sum / 5;
    const bal = max > 0 ? (min / max) : 0;
    return { id, balance: mean * (0.3 + 0.7 * bal) };
  }).sort((a,b) => b.balance - a.balance);

  const top = ranked[0];
  const maxScore = top.balance;
  const f = figures[top.id];

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('rChar').textContent = f.char;
  const imgEl = document.getElementById('rImg');
  if (f.img) {
    imgEl.src = f.img;
    imgEl.onload = () => { imgEl.style.display = 'block'; };
    imgEl.onerror = () => { imgEl.style.display = 'none'; };
  }
  document.getElementById('rName').textContent = f.name;
  document.getElementById('rTitle').textContent = f.title;
  document.getElementById('rQuote').textContent = f.quote;
  document.getElementById('rQuoteSrc').textContent = '—— ' + f.name;
  document.getElementById('rIntro').textContent = f.intro;
  document.getElementById('rBio').textContent = f.bio;
  document.getElementById('rDesc').textContent = f.desc;
  document.getElementById('rPct').textContent = Math.round(top.balance * 100) + '%';
  document.getElementById('rRegion').textContent = f.nation + ' · ' + f.title;

  const dimsBox = document.getElementById('rDims');
  dimsBox.innerHTML = '';
  const dimParts = [];
  DIMS.forEach((name, d) => {
    let dimTopId = null, dimTopScore = 0;
    for (const id in dimScores[d]) {
      if (!excluded.has(id) && dimScores[d][id] > dimTopScore) { dimTopScore = dimScores[d][id]; dimTopId = id; }
    }
    const dimTopFig = dimTopId ? figures[dimTopId] : null;
    const dimScore = dimScores[d][top.id] || 0;
    const pct = dimTopScore ? Math.round((dimScore / dimTopScore) * 100) : 0;
    const level = pct >= 80 ? '高度契合' : (pct >= 50 ? '较为契合' : '有所差异');
    dimsBox.innerHTML += `
      <div class="dim-item">
        <div class="dim-name">${name}</div>
        <div class="dim-fig">
          <span class="dim-avatar">${dimTopFig ? dimTopFig.char : '—'}</span>
          <span class="dim-fig-name">${dimTopFig ? dimTopFig.name : '无'}</span>
        </div>
        <div class="dim-bar"><div class="dim-fill" style="width:${pct}%"></div></div>
        <div class="dim-pct">${pct}%</div>
      </div>`;
    dimParts.push(`${name}上最像${dimTopFig ? dimTopFig.name : '无'}，你与「${f.name}」${level}（${pct}%）`);
  });
  document.getElementById('rDimsText').textContent = '五维解读——' + dimParts.join('；') + '。';

  const rankBox = document.getElementById('rRank');
  rankBox.innerHTML = '';
  ranked.slice(0, 6).forEach((r, i) => {
    const pct = Math.round(r.balance * 100);
    const rf = figures[r.id];
    rankBox.innerHTML += `
      <div class="rank-item">
        <div class="name">${i===0?'★ ':''}${rf.name}</div>
        <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
      </div>`;
  });
}

function restart() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
}

buildOptList();
</script>
</body>
</html>
