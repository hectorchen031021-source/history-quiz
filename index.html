<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你像哪位东亚历史人物？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Jost:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6dbc7;
    --surface: #f4ede0;
    --ink: #062b8a;
    --muted: #4a6ab8;
    --accent: #062b8a;
    --accent-ink: #f4ede0;
    --line: rgba(6, 43, 138, .16);
    --line-strong: rgba(6, 43, 138, .38);
    --font-display: "EB Garamond", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --font-text: "Jost", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-text);
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px;
  }
  .app {
    width: 100%; max-width: 660px; background: var(--surface);
    border-radius: 24px; box-shadow: 0 1px 2px rgba(6,43,138,.06), 0 24px 60px rgba(6,43,138,.14);
    overflow: hidden;
  }
  .stage { padding: 44px 44px 40px; }
  .progress-wrap { height: 4px; background: var(--line); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .4s cubic-bezier(.22,.61,.36,1); }

  .kicker {
    font-size: 12px; letter-spacing: .28em; color: var(--accent); text-transform: uppercase;
    font-weight: 600; margin-bottom: 14px; font-family: var(--font-text);
  }
  h1, .result-name {
    font-family: var(--font-display); font-weight: 500; color: var(--ink);
    letter-spacing: -.01em; line-height: 1.18;
  }
  h1 { font-size: 40px; margin-bottom: 16px; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.8; max-width: 40em; }
  .sub b { color: var(--ink); font-weight: 600; }
  .tag {
    display: inline-block; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
    font-size: 12px; margin: 2px 4px 2px 0; letter-spacing: .02em;
  }
  .len-list { margin-top: 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .len-label { font-size: 14px; font-weight: 600; color: var(--ink); margin-right: 4px; }
  .len-opt { display: flex; align-items: center; gap: 6px; cursor: pointer; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--ink); transition: border-color .16s ease; }
  .len-opt:hover { border-color: var(--line-strong); }
  .len-opt input { accent-color: var(--accent); cursor: pointer; }
  .opt-list { margin-top: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .opt-toggle { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .16s ease; }
  .opt-toggle:hover { border-color: var(--line-strong); }
  .opt-toggle input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex: none; margin-top: 2px; }
  .opt-toggle-box { display: flex; flex-direction: column; gap: 4px; }
  .opt-toggle-box strong { font-size: 15px; font-weight: 600; color: var(--ink); }
  .opt-toggle-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  .q-num { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-family: var(--font-text); }
  .dim-tag {
    float: right; font-size: 12px; color: var(--accent-ink); background: var(--accent);
    border-radius: 999px; padding: 2px 11px; letter-spacing: .04em;
  }
  .question {
    font-family: var(--font-display); font-weight: 500; font-size: 26px;
    line-height: 1.35; margin-bottom: 28px; color: var(--ink); letter-spacing: -.005em;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--line); border-radius: 16px; padding: 17px 20px;
    cursor: pointer; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    background: #fff; text-align: left; font-size: 15.5px; line-height: 1.55; color: var(--ink);
  }
  .option:hover {
    border-color: var(--line-strong); transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(6,43,138,.08);
  }
  .option:active { transform: translateY(0); }
  .option .letter {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg); color: var(--accent); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; font-family: var(--font-text);
    transition: background .16s ease, color .16s ease;
  }
  .option:hover .letter { border-color: var(--accent); }
  .option.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .option.selected .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: .06em;
    font-family: var(--font-text); transition: transform .14s ease, box-shadow .14s ease, opacity .18s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(6,43,138,.22); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
  .footer-nav { margin-top: 24px; display: flex; gap: 12px; }
  .ghost {
    flex: 1; padding: 14px; border: 1px solid var(--line); border-radius: 14px;
    background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
    font-family: var(--font-text); transition: border-color .16s ease, color .16s ease;
  }
  .ghost:hover { border-color: var(--accent); color: var(--ink); }

  .result-head { text-align: center; }
  .avatar {
    position: relative; overflow: hidden;
    width: 124px; height: 124px; border-radius: 50%;
    background: var(--bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px; box-shadow: 0 12px 32px rgba(6,43,138,.18);
  }
  .avatar img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%; display: none;
  }
  .avatar .char-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 52px; font-weight: 500;
  }
  .match-pct { color: var(--accent); font-weight: 700; font-size: 20px; font-family: var(--font-text); }
  .result-name { font-size: 40px; margin: 8px 0 4px; }
  .result-title { color: var(--muted); font-size: 15px; font-family: var(--font-text); }
  .region-label {
    display: inline-block; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 13px; font-size: 12px; margin-top: 12px;
  }
  .quote { text-align: center; margin-top: 28px; }
  .quote-text {
    font-family: var(--font-display); font-size: 24px; font-weight: 500; line-height: 1.5;
    color: var(--ink); letter-spacing: -.005em;
  }
  .quote-text::before { content: "「"; color: var(--accent); }
  .quote-text::after { content: "」"; color: var(--accent); }
  .quote-src { color: var(--muted); font-size: 13px; margin-top: 10px; font-family: var(--font-text); }
  .intro {
    margin-top: 22px; text-align: left; background: var(--bg);
    border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0;
    padding: 16px 18px; font-size: 14px; line-height: 1.75; color: var(--ink);
  }
  .bio {
    margin-top: 12px; text-align: left; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; font-size: 14px; line-height: 1.85; color: var(--ink);
  }
  .bio::before { content: "人物小传"; display: block; font-size: 12px; letter-spacing: .1em; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
  .desc {
    margin-top: 16px; text-align: left; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; font-size: 15px; line-height: 1.8; color: var(--ink);
  }
  .rank { margin-top: 26px; text-align: left; }
  .rank h3 {
    font-family: var(--font-text); font-size: 13px; color: var(--muted);
    margin-bottom: 14px; letter-spacing: .1em; font-weight: 600; text-transform: uppercase;
  }
  .rank-item { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .rank-item .name { width: 108px; font-weight: 600; font-size: 14px; font-family: var(--font-text); }
  .rank-bar { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .rank-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.22,.61,.36,1); }
  .rank-item .pct { width: 46px; text-align: right; font-size: 13px; color: var(--muted); font-family: var(--font-text); }
  .dim-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dim-item .dim-name { width: 70px; font-weight: 600; font-size: 12px; font-family: var(--font-text); color: var(--ink); flex: none; }
  .dim-fig { display: flex; align-items: center; gap: 6px; width: 92px; flex: none; }
  .dim-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); color: var(--accent); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-display); flex: none; }
  .dim-fig-name { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim-bar { flex: 1; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .dim-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.22,.61,.36,1); }
  .dim-item .dim-pct { width: 38px; text-align: right; font-size: 12px; color: var(--muted); font-family: var(--font-text); flex: none; }
  .dims-text { margin-top: 14px; font-size: 14px; line-height: 1.7; color: var(--ink); text-align: left; }
  .hidden { display: none !important; }

  .fade-in { animation: fadeIn .45s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }

  @media (max-width: 560px) {
    body { padding: 12px; align-items: flex-start; }
    .app { border-radius: 18px; }
    .stage { padding: 28px 22px 26px; }
    h1 { font-size: 32px; }
    .question { font-size: 22px; }
    .result-name { font-size: 32px; }
    .quote-text { font-size: 21px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="stage" id="intro">
      <div class="kicker">历史人格测试</div>
      <h1>你像哪位东亚历史人物？</h1>
       <p class="sub">收录 <b>1800 年以后</b>的 <b>300 位东亚历史人物</b>（中国 · 日本 · 韩国 · 朝鲜 · 蒙古 · 台湾），从<span class="tag">经济政治倾向</span><span class="tag">国际与外交观</span><span class="tag">价值取向</span><span class="tag">行事方式</span><span class="tag">性格气质</span>五个维度、共 <b>80 道题</b>，测出与你最相似的那一位。</p>
       <div class="len-list">
         <span class="len-label">基础题量</span>
         <label class="len-opt"><input type="radio" name="qlen" value="35" onchange="updateOptCount()"><span>精简 35 题</span></label>
         <label class="len-opt"><input type="radio" name="qlen" value="50" onchange="updateOptCount()"><span>标准 50 题</span></label>
         <label class="len-opt"><input type="radio" name="qlen" value="80" checked onchange="updateOptCount()"><span>完整 80 题</span></label>
       </div>
       <div class="opt-list">
         <label class="opt-toggle" for="optToggleJp">
           <input type="checkbox" id="optToggleJp" checked onchange="updateOptCount()">
           <span class="opt-toggle-box"><strong>日本题库（15 题）</strong><span class="opt-toggle-desc">明治维新、大政翼赞、财阀解散、天皇人间宣言、安保条约、靖国参拜等日本立场 tag 题。</span></span>
         </label>
         <label class="opt-toggle" for="optToggleCn">
           <input type="checkbox" id="optToggleCn" checked onchange="updateOptCount()">
           <span class="opt-toggle-box"><strong>中国题库（15 题）</strong><span class="opt-toggle-desc">戊戌变法、五四、国共合作、土地革命、长征、大跃进、一国两制、市场经济等中国立场 tag 题。</span></span>
         </label>
         <label class="opt-toggle" for="optToggleTw">
           <input type="checkbox" id="optToggleTw" checked onchange="updateOptCount()">
           <span class="opt-toggle-box"><strong>台湾题库（15 题）</strong><span class="opt-toggle-desc">日据光复、二二八、白色恐怖、党外运动、美丽岛、台独统一、解严、总统直选等台湾立场 tag 题。</span></span>
         </label>
       </div>
       <div style="margin-top:24px">
         <button class="btn" onclick="startQuiz()" id="startBtn">开始测试</button>
       </div>
    </div>

    <div class="stage hidden" id="quiz">
      <div class="q-num"><span id="qNumText"></span><span class="dim-tag" id="dimTag"></span></div>
      <div class="question" id="qText"></div>
      <div class="options" id="qOptions"></div>
      <div class="footer-nav">
        <button class="ghost hidden" id="prevBtn" onclick="prevQuestion()">上一题</button>
        <button class="ghost" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
      </div>
    </div>

    <div class="stage hidden" id="result">
      <div class="result-head fade-in">
        <div class="kicker">测试结果</div>
        <div class="avatar" id="rAvatar"><span class="char-fallback" id="rChar"></span><img id="rImg" alt="" referrerpolicy="no-referrer"></div>
        <div>你与 <span class="match-pct" id="rPct"></span> 相似</div>
        <div class="result-name" id="rName"></div>
        <div class="result-title" id="rTitle"></div>
        <div><span class="region-label" id="rRegion"></span></div>
      </div>
      <div class="quote fade-in"><div class="quote-text" id="rQuote"></div><div class="quote-src" id="rQuoteSrc"></div></div>
      <div class="intro fade-in" id="rIntro"></div>
      <div class="bio fade-in" id="rBio"></div>
      <div class="desc fade-in" id="rDesc"></div>
      <div class="rank fade-in">
        <h3>五维画像</h3>
        <div id="rDims"></div>
        <div class="dims-text" id="rDimsText"></div>
      </div>
      <div class="rank fade-in">
        <h3>完整排名（前 6 位）</h3>
        <div id="rRank"></div>
      </div>
      <div style="margin-top:26px; display:flex; gap:12px">
        <button class="btn" onclick="restart()">重新测试</button>
      </div>
    </div>
  </div>

<script>
const figures = {
  bajin: { name:"巴金", char:"巴", nation:"中国", title:"文学巨匠", desc:"你与巴金最像——巴金（1904—2005），作家，著《家》《随想录》，晚年倡导「讲真话」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Ba_Jin%2C_Berlin_1956.jpg/330px-Ba_Jin%2C_Berlin_1956.jpg", quote:"讲真话", intro:"巴金（1904—2005），作家，著《家》《随想录》，晚年倡导「讲真话」。", bio:"巴金（1904年11月25日—2005年10月17日），原名李尧棠，字芾甘，汉族，四川成都人，祖籍浙江嘉兴，中国近代作家、出版人、翻译家、无政府主义者。作品被翻譯成多國文字，1949年之後再無長篇小說面世。妻子萧珊，1944年5月與巴金在花溪结婚。1983年3月起，巴金连续五次当选全国政协副主席，任职直到去世为止。\n" },
  baichongxi: { name:"白崇禧", char:"禧", nation:"中国", title:"桂系将领", desc:"你与白崇禧最像——白崇禧（1893—1966），桂系将领，以谋略见长，人称「小诸葛」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Minister1.jpg/330px-Minister1.jpg", quote:"小诸葛，智勇兼备", intro:"白崇禧（1893—1966），桂系将领，以谋略见长，人称「小诸葛」。", bio:"白崇禧（1893年3月18日—1966年12月2日），字健生，伊斯兰經名奧馬爾，廣西桂林人，中華民國一級上將，人稱「小諸葛」。保定軍官學校畢業。1923年起任廣西討逆軍參謀長，廣西綏靖公署及桂軍第二軍參謀長，國民革命軍副總參謀長、東路軍前敵總指揮。官至中華民國陸軍一级上将，並曾出任首任中華民國國防部部長。\n" },
  bingxin: { name:"冰心", char:"冰", nation:"中国", title:"作家", desc:"你与冰心最像——冰心（1900—1999），作家、诗人，以《繁星》《春水》倡导爱与美的文学。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/%E8%B0%A2%E5%A9%89%E8%8E%B9%E5%A5%B3%E5%A3%AB.jpg/330px-%E8%B0%A2%E5%A9%89%E8%8E%B9%E5%A5%B3%E5%A3%AB.jpg", quote:"有了爱就有了一切", intro:"冰心（1900—1999），作家、诗人，以《繁星》《春水》倡导爱与美的文学。", bio:"冰心（1900年10月5日—1999年2月28日），本名謝婉瑩，福建福州人，中国近代女诗人、小说家、散文家、儿童文学作家、翻译家与社会活动家，被视为中国儿童文学与新诗的先驱。其著作也与鲁迅、叶圣陶、茅盾等人的著作被视为普通话语法规范的出处。她的筆名冰心取自王昌齡的《芙蓉樓送辛漸》中的“一片冰心在玉壺”。\n" },
  cai: { name:"蔡锷", char:"蔡", nation:"中国", title:"护国名将", desc:"你与蔡锷最像——蔡锷（1882—1916），护国战争主将，率军讨袁护国，被誉为「再造共和」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/GeneralQaoAoCampa%C3%B1aDeYunnan.jpg/330px-GeneralQaoAoCampa%C3%B1aDeYunnan.jpg", quote:"再造共和，护国讨袁", intro:"蔡锷（1882—1916），护国战争主将，率军讨袁护国，被誉为「再造共和」。", bio:"蔡锷（è）（1882年12月18日—1916年11月8日），原名艮（gèn）寅（yín），字松坡，祖籍原湖南省寶慶府邵陽縣（今邵阳市大祥区），出生成长于原寶慶府武冈州山门（今属邵陽市洞口县），清末民初政治人物、军事家，曾經响应辛亥革命，後來發動反對袁世凱复辟帝制洪憲帝制的護國戰爭以维护宪政，被誉为“护国大将军”與“護國军神”。\n" },
  caitingkai: { name:"蔡廷锴", char:"锴", nation:"中国", title:"抗日将领", desc:"你与蔡廷锴最像——蔡廷锴（1892—1968），十九路军军长，指挥淞沪抗战抗击日寇。", img:"https://upload.wikimedia.org/wikipedia/commons/9/9e/%E8%94%A1%E5%BB%B7%E9%94%B4%E7%AD%BE%E5%90%8D%E7%85%A7.jpg", quote:"一寸山河一寸血", intro:"蔡廷锴（1892—1968），十九路军军长，指挥淞沪抗战抗击日寇。", bio:"蔡廷锴（1892年4月15日—1968年4月25日），字贤初，广东罗定人，中華民國时期将军及中華人民共和國政治人物，原副国级领导人。抗战期间，因指揮了一·二八淞滬抗戰而海內外享有極高聲譽，并因參與領導發起了福建事變而知名。\n" },
  caiyuanpei: { name:"蔡元培", char:"培", nation:"中国", title:"教育家", desc:"你与蔡元培最像——蔡元培（1868—1940），教育家、北大校长，倡导学术自由与兼容并包。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Cai_Yuanpei_%28Cropped%29.jpg/330px-Cai_Yuanpei_%28Cropped%29.jpg", quote:"思想自由，兼容并包", intro:"蔡元培（1868—1940），教育家、北大校长，倡导学术自由与兼容并包。", bio:"蔡元培（1868年1月11日—1940年3月5日），字仲申，又字鶴卿、民友、孑民，號隺庼，小名宜哥，小字意可，乳名阿培，並曾化名蔡振、周子餘，男，浙江绍兴府山陰縣（今紹興市）人，原籍紹興诸暨，中国近代革命家、教育家、政治人物、翻譯家。他曾任中华民国国民政府代理主席，亦被普遍認為是中国近代民族学研究的先驱。\n" },
  caoyu: { name:"曹禺", char:"禺", nation:"中国", title:"剧作家", desc:"你与曹禺最像——曹禺（1910—1996），剧作家，著《雷雨》《日出》，中国话剧奠基人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Young_Cao_Yu.jpg/330px-Young_Cao_Yu.jpg", quote:"（雷雨）", intro:"曹禺（1910—1996），剧作家，著《雷雨》《日出》，中国话剧奠基人。", bio:"曹禺（1910年9月24日—1996年12月13日），本名萬家寶，字小石，小名添甲，湖北省潜江市人，生于天津市，中国現代剧作家以及戏剧教育家，他被稱為“中國的莎士比亞”。把他的本姓繁体“萬”字，拆为“草字头”和“禺”，再把草字頭换为曹，就成了筆名“曹禺”。\n" },
  zeng: { name:"曾国藩", char:"曾", nation:"中国", title:"湘军统帅·理学名臣", desc:"你沉稳坚韧、讲求实际，以「拙诚」立身，靠毅力与用人成就事业。你重视秩序与传统，深谋远虑、进退有度，是乱世中能成大事的实干家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Tseng_Kwo-Fan.tif/lossy-page1-330px-Tseng_Kwo-Fan.tif.jpg", quote:"莫问收获，但问耕耘", intro:"曾国藩（1811—1872），晚清名臣，湘军创立者与统帅，以平定太平天国和「拙诚」修身著称。", bio:"曾国藩（1811年11月26日—1872年3月12日），原名子城，字伯涵，号涤生，齋名求闕齋，湖南湘乡人（今双峰县荷叶镇）。生於清朝长沙府白杨坪（现属湖南省婁底市双峰县荷叶镇天子坪），谱名传豫，宗圣曾子七十世孙（系出曾氏南宗），晚清時期的重臣、名臣和功臣，湘軍創始人和領袖，也是中國近代重要政治家、军事家、理学家、書法家、思想家、文學家、詩人、外交家、實業家、" },
  chenbulei: { name:"陈布雷", char:"布", nation:"中国", title:"文胆", desc:"你与陈布雷最像——陈布雷（1890—1948），蒋介石首席文胆，长期执笔文稿，后自杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/%E9%99%B3%E5%B8%83%E9%9B%B73.jpg/330px-%E9%99%B3%E5%B8%83%E9%9B%B73.jpg", quote:"秉笔直书，以死明志", intro:"陈布雷（1890—1948），蒋介石首席文胆，长期执笔文稿，后自杀。", bio:"陈布雷（1890年11月15日—1948年11月13日），原名陈训恩，字彦及，号畏垒，笔名布雷 （英文暱稱Bread之譯音），男，浙江宁波慈谿县人，中华民国评论家、文學家、政治家，受蔣中正赏识，弃文从政，有「文胆」之譽。1947年，在原籍浙江省慈谿县當選為第一屆國民大會代表。1948年因故自杀。\n" },
  chencheng: { name:"陈诚", char:"诚", nation:"中国", title:"国民党将领", desc:"你与陈诚最像——陈诚（1898—1965），国民党高级将领，后主政台湾、推行土改。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Chen_Cheng_in_1940%27s.jpg/330px-Chen_Cheng_in_1940%27s.jpg", quote:"军人以服从为天职", intro:"陈诚（1898—1965），国民党高级将领，后主政台湾、推行土改。", bio:"陳誠（1898年1月4日—1965年3月5日），字辭修，乳名德馨，別號石叟，男，浙江省青田縣高市鄉外村人。中華民國陸軍一級上將，是中國國民黨的黨、政、軍首要人物之一。其軍事集團是蔣介石嫡系部隊中堅力量。他自到黃埔軍校起就一直追隨蔣，成為蔣之心腹幹將，曾任軍長、兵團總指揮、集團軍總司令、軍政部長、湖北省政府主席、國防部參謀總長等要職。到臺灣後，歷任台灣省主席、" },
  chen: { name:"陈独秀", char:"陈", nation:"中国", title:"新文化运动旗手", desc:"你思想激进、锋芒毕露，敢于向旧传统开战、开辟新路。你激情四射、特立独行，是那种为理想与主义不惜牺牲的先行者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Chen_Duxiu4.jpg/330px-Chen_Duxiu4.jpg", quote:"德先生与赛先生——民主与科学", intro:"陈独秀（1879—1942），新文化运动领袖、中共主要创始人，高举「民主与科学」大旗。", bio:"陈独秀（1879年10月9日—1942年5月27日），谱名庆同，字仲甫，号实庵，1914年始用筆名独秀，安徽怀宁人，中国近现代思想家、政治家、革命家。1915年，創辦《新青年》雜誌，是新文化运动的精神领袖和五四运动的总司令。1920年起，成为中国共产党主要創始人及早期主要领导人，但於1927年因中国国民党清党，中共遭到重大打击，被共产国际认为负领导责任而被迫" },
  chengeng: { name:"陈赓", char:"赓", nation:"中国", title:"开国大将", desc:"你与陈赓最像——陈赓（1903—1961），中国人民解放军大将，黄埔一期出身。", img:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Chengeng.jpg", quote:"（黄埔三杰）", intro:"陈赓（1903—1961），中国人民解放军大将，黄埔一期出身。", bio:"陈赓（gēng）（1903年2月27日—1961年3月16日），原名陈庶康，湖南湘乡人。中国工农红军及中国人民解放军主要领导人之一，军事家、中国人民解放军大将。中国共产党、中华人民共和国政治人物，原副国级领导人。\n" },
  chenguofu: { name:"陈果夫", char:"果", nation:"中国", title:"CC系领袖", desc:"你与陈果夫最像——陈果夫（1892—1951），国民党 CC 系领袖，长期掌控党务与特务。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/%E9%99%88%E6%9E%9C%E5%A4%AB%E5%86%9B%E8%A3%85%E7%85%A7.jpg/330px-%E9%99%88%E6%9E%9C%E5%A4%AB%E5%86%9B%E8%A3%85%E7%85%A7.jpg", quote:"（党务）", intro:"陈果夫（1892—1951），国民党 CC 系领袖，长期掌控党务与特务。", bio:"陳果夫（1892年10月27日—1951年8月25日），名祖燾，字果夫，以字行，男，浙江省吳興縣（今浙江省湖州市吳興區）人，民國時期政治人物，是國民黨內右派。陳果夫及其弟陳立夫與蔣介石關係密切，在大陸時期為蔣所倚重，負責國民黨內組織及黨務，有「二陳」、「CC系」之稱。\n" },
  chenlifu: { name:"陈立夫", char:"立", nation:"中国", title:"官僚", desc:"你与陈立夫最像——陈立夫（1900—2001），国民党 CC 系领袖，长期掌控党务组织。", img:"", quote:"（CC系）", intro:"陈立夫（1900—2001），国民党 CC 系领袖，长期掌控党务组织。", bio:"陳立夫（1900年8月21日—2001年2月8日），名祖燕，字立夫，以字行，男，1900年8月21日（清光绪二十六年七月廿七日）生。浙江省吳興縣（今浙江省湖州市吳興區）人，北洋大学（今天津大学）採礦學系畢業。1924年，獲美國匹茲堡大學採礦學碩士學位。父陳其業，字勤士，兄陳祖燾，字果夫。其二叔陳其美，於辛亥革命初期與黄兴同為孫中山的左右股肱，陳其美與蔣中正關" },
  chentianhua: { name:"陈天华", char:"天", nation:"中国", title:"革命宣传家", desc:"你与陈天华最像——陈天华（1875—1905），革命宣传家，著《猛回头》《警世钟》，蹈海殉国。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/Chentianhua.jpg/330px-Chentianhua.jpg", quote:"奋起！奋起！", intro:"陈天华（1875—1905），革命宣传家，著《猛回头》《警世钟》，蹈海殉国。", bio:"陈天华（1875年3月6日—1905年12月8日），原名显宿，字星台、过庭，别号思黄，湖南省新化县人，中國近代革命家，中国同盟会会员，清末革命人士。\n" },
  chenyi: { name:"陈毅", char:"毅", nation:"中国", title:"元帅", desc:"你与陈毅最像——陈毅（1901—1972），元帅、外交家，著有《梅岭三章》。", img:"https://upload.wikimedia.org/wikipedia/commons/e/e9/Chen_Yi%28communist%29.jpg", quote:"大雪压青松，青松挺且直", intro:"陈毅（1901—1972），元帅、外交家，著有《梅岭三章》。", bio:"陈毅（1901年8月26日—1972年1月6日），原名陈世俊，字仲弘。四川乐至人，祖籍湖南新寧。中国共产党革命家、中国人民解放军军事家、中华人民共和国十大元帅之一，原正国级领导人。曾任中华人民共和国国务院副总理、中共中央军委副主席、中国人民政治协商会议全国委员会副主席、中华人民共和国外交部部长，上海市人民政府首任市长。\n" },
  chenyinque: { name:"陈寅恪", char:"恪", nation:"中国", title:"史学大师", desc:"你与陈寅恪最像——陈寅恪（1890—1969），史学大师，学识渊博，坚守学术独立。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/%E9%99%88%E5%AF%85%E6%81%AA.jpg/330px-%E9%99%88%E5%AF%85%E6%81%AA.jpg", quote:"独立之精神，自由之思想", intro:"陈寅恪（1890—1969），史学大师，学识渊博，坚守学术独立。", bio:"陳寅恪（què）（1890年7月3日—1969年10月7日），字鶴壽，江西修水人，生於湖南長沙，中國歷史學家，中央研究院第一届院士。陳寅恪通曉二十餘種语言，其史學脫胎於乾嘉考據學，著有《柳如是別傳》、《隋唐制度淵源略論稿》、《唐代政治史述論稿》等。\n" },
  chenyun: { name:"陈云", char:"云", nation:"中国", title:"经济学家", desc:"你与陈云最像——陈云（1905—1995），革命家、经济学家，主张综合平衡发展。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/%E9%99%88%E4%BA%91%E6%A0%87%E5%87%86%E5%83%8F.jpg/330px-%E9%99%88%E4%BA%91%E6%A0%87%E5%87%86%E5%83%8F.jpg", quote:"不唯上、不唯书、只唯实", intro:"陈云（1905—1995），革命家、经济学家，主张综合平衡发展。", bio:"陈云（1905年6月13日—1995年4月10日），曾用名廖陈云，江蘇青浦（今屬上海市青浦区）人。政治家、经济管理家。陈云是中国共产党和中华人民共和国第一代和第二代中央领导集体的重要成员，改革开放以后继续担任党内重要职务。\n" },
  cixi: { name:"慈禧太后", char:"禧", nation:"中国", title:"晚清女主", desc:"你深谙权术、掌控欲强，善于在复杂的宫廷与朝局中维系自己的权力。你精明而多疑，把权力与稳定看得极重，是铁腕的秩序维护者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/The_Ci-Xi_Imperial_Dowager_Empress_%289.2%29.PNG/330px-The_Ci-Xi_Imperial_Dowager_Empress_%289.2%29.PNG", quote:"量中华之物力，结与国之欢心", intro:"慈禧太后（1835—1908），晚清实际统治者，掌权近半个世纪，历经同光两朝与庚子之变。", bio:"慈禧太后（1835年11月29日—1908年11月15日），谥号孝欽顯皇后，又稱西太后，葉赫那拉氏，满洲镶蓝旗人，中國清朝晚期女性皇室成员、政治人物，為清文宗咸豐皇帝之后宮嬪妃（懿貴妃）和清穆宗同治皇帝的生母，也是清朝同治、光緒年間（1861—1908）大清帝國的實際上的最高統治者。其子同治帝登基後，上徽號「慈禧」。她是中國史上最後一位享有太皇太后頭銜的人（" },
  daijitao: { name:"戴季陶", char:"戴", nation:"中国", title:"国民党理论家", desc:"你与戴季陶最像——戴季陶（1891—1949），国民党理论家，著有《日本论》《孙文主义之哲学基础》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/%E6%88%B4%E5%AD%A3%E9%99%B6Tai_Chi-tao.jpg/330px-%E6%88%B4%E5%AD%A3%E9%99%B6Tai_Chi-tao.jpg", quote:"以主义立国", intro:"戴季陶（1891—1949），国民党理论家，著有《日本论》《孙文主义之哲学基础》。", bio:"戴季陶（1891年1月6日—1949年2月12日），原名良弼，字選堂，號天仇，后改名傳賢、字季陶，以字行，男，原籍浙江吴兴，生于四川广汉，中华民國政治人物、中國國民黨元老之一，中華民國國旗歌的作詞者，也是中国马克思主义最早的研究者之一。他在訓政時期任第一任考試院院長長達20年，也是歷史上最年輕的五院院長，就任時年僅37歲。\n" },
  dengshichang: { name:"邓世昌", char:"昌", nation:"中国", title:"甲午海军将领", desc:"你与邓世昌最像——邓世昌（1849—1894），北洋水师致远舰管带，黄海海战中壮烈殉国。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/DengXiChang_CHN.png/330px-DengXiChang_CHN.png", quote:"吾志杀敌报国，今死于海，义也", intro:"邓世昌（1849—1894），北洋水师致远舰管带，黄海海战中壮烈殉国。", bio:"邓世昌（1849年10月4日—1894年9月17日），原名永昌，字正卿，谥壮节，广东廣州番禺龙导尾人（今广东省广州市海珠区龙珠直街龙延里2号），清帝国后期海军将领，官至北洋水师致远舰管带（舰长），1894年9月17日在中日甲午战争期间于黄海与日本联合舰队作战時殉艦陣亡，清廷追贈太子少保，入祀昭忠祠。\n" },
  deng: { name:"邓小平", char:"邓", nation:"中国", title:"改革开放总设计师", desc:"你务实灵活、深谋远虑，相信发展才是硬道理。你「摸着石头过河」，用渐进改革与制度设计化解难题，是稳中求进、能屈能伸的改革者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Deng_Xiaoping_at_the_arrival_ceremony_for_the_Vice_Premier_of_China_%28cropped%29.jpg/330px-Deng_Xiaoping_at_the_arrival_ceremony_for_the_Vice_Premier_of_China_%28cropped%29.jpg", quote:"发展才是硬道理", intro:"邓小平（1904—1997），中国改革开放总设计师，开创中国特色社会主义道路。", bio:"邓小平（1904年8月22日—1997年2月19日），原名先圣，学名希贤，1927年正式改名为小平，曾用名邓斌，男，四川广安人，是中国共产党和中华人民共和国政治人物，原正国级领导人。在1978年召开的中共十一届三中全会上确立领导地位，成为中华人民共和国第二代最高领导人，以及中国共产党第二代中央领导集体的核心。邓于1977年至1982年间担任中国共产党中央委员" },
  dengyanda: { name:"邓演达", char:"演", nation:"中国", title:"国民党左派领袖", desc:"你与邓演达最像——邓演达（1895—1931），国民党左派领袖，主张平民革命，被杀害。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Teng-Jan-dah_-_%28Deng_Yanda_%29_1927.jpg/330px-Teng-Jan-dah_-_%28Deng_Yanda_%29_1927.jpg", quote:"为平民革命而奋斗", intro:"邓演达（1895—1931），国民党左派领袖，主张平民革命，被杀害。", bio:"邓演达（1895年3月1日—1931年11月29日），又名策成、仲密，字择生，化名石生登，男，广东省归善县永湖乡鹿颈村人（今惠州市惠城區三栋镇），中华民国政治人物。\n" },
  dengyingchao: { name:"邓颖超", char:"颖", nation:"中国", title:"妇女运动领袖", desc:"你与邓颖超最像——邓颖超（1904—1992），周恩来夫人，妇女运动与儿童事业的活动家。", img:"https://upload.wikimedia.org/wikipedia/commons/4/49/%E9%82%93%E9%A2%96%E8%B6%85%EF%BC%88crop%EF%BC%89.jpg", quote:"（妇女与和平）", intro:"邓颖超（1904—1992），周恩来夫人，妇女运动与儿童事业的活动家。", bio:"邓颖超（1904年2月4日—1992年7月11日），原名邓文淑，曾化名邓玉爱，女，河南光山人，出生于广西南宁，中華民國大陸時期、中国共产党和中华人民共和国政治人物，原正国级领导人。1925年加入中国共产党；是中共第七届中央候补委员，第八至十二届中央委员，第十一届、第十二届中共中央政治局委员。曾任全国妇联副主席、名誉主席，中纪委第二书记，第五届全国人大常委会副" },
  dingling: { name:"丁玲", char:"丁", nation:"中国", title:"作家", desc:"你与丁玲最像——丁玲（1904—1986），作家，著《太阳照在桑干河上》，投身左翼革命文学。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Ding_Ling_3.jpg/330px-Ding_Ling_3.jpg", quote:"（革命文学）", intro:"丁玲（1904—1986），作家，著《太阳照在桑干河上》，投身左翼革命文学。", bio:"丁玲（1904年10月12日—1986年3月4日），原名蒋伟，字冰之，笔名彬芷、从喧等，女，湖南临澧人，中国现代女性主义作家、社会活动家，中国共产党党员。\n" },
  dongbiwu: { name:"董必武", char:"董", nation:"中国", title:"中共元老", desc:"你与董必武最像——董必武（1886—1975），中共创始人之一，新中国法制建设奠基者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/%E8%91%A3%E5%BF%85%E6%AD%A6%E4%B8%BB%E5%B8%AD.jpg/330px-%E8%91%A3%E5%BF%85%E6%AD%A6%E4%B8%BB%E5%B8%AD.jpg", quote:"（法制建设）", intro:"董必武（1886—1975），中共创始人之一，新中国法制建设奠基者。", bio:"董必武（1886年3月5日—1975年4月2日），原名贤琮，又名用威，字洁畲，号壁伍，湖北省黄州府黄安县（今红安县）人，中国共产党和中华人民共和国法官及政治人物，原正国级领导人，為中国共产党创始人和第一代主要领导人之一，中华人民共和国开国元勋，曾经担任中华人民共和国副主席、代主席，中共中央政治局常委、委員。亦是毛澤東以外少數得以善終的中共創始人之一。在中共一" },
  duyuming: { name:"杜聿明", char:"杜", nation:"中国", title:"远征军将领", desc:"你与杜聿明最像——杜聿明（1904—1981），国民党将领，指挥远征军入缅作战。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Du_Yuming2.jpg/330px-Du_Yuming2.jpg", quote:"（远征缅甸）", intro:"杜聿明（1904—1981），国民党将领，指挥远征军入缅作战。", bio:"杜聿明（1904年11月28日—1981年5月7日），字光亭，陕西省米脂縣人，国民革命军陆军中将，是蔣介石嫡系部隊。黄埔军校第一期毕业后，在国民革命军机械化部队任职，历任国民革命军第二百师师长、國民革命軍第五軍军长，率部參加桂南會戰，取得崑崙關大捷。曾因錯誤決策，在緬甸導致遠征軍過半死於野人山（今枯門嶺）撤退。在國共內戰期間擔任過東北剿匪副總司令、徐州剿匪副" },
  duan: { name:"段祺瑞", char:"段", nation:"中国", title:"北洋总理", desc:"你与段祺瑞最像——段祺瑞（1865—1936），北洋皖系首领，多次出任国务总理。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/DuanQirui.jpg/330px-DuanQirui.jpg", quote:"三造共和", intro:"段祺瑞（1865—1936），北洋皖系首领，多次出任国务总理。", bio:"段祺瑞（1865年3月6日—1936年11月2日），原名启瑞，字芝泉，安徽合肥人，祖籍江西饒州，中國政治人物，历任中華民國參謀總長、國務卿、國務總理、臨時執政。在任期間，反對帝制、總統制，再造共和，提倡責任內閣制，主張武力統一中國，在第一次世界大战中带领中国成为战胜国，加入國際聯盟，并迫使外蒙古撤治。下野後隱居天津和上海，1936年病逝。著有《正道居集》。\n" },
  fangzhimin: { name:"方志敏", char:"方", nation:"中国", title:"革命家", desc:"你与方志敏最像——方志敏（1899—1935），革命家，著《可爱的中国》，狱中就义。", img:"https://upload.wikimedia.org/wikipedia/commons/9/97/Fangzhimin1.jpg", quote:"可爱的中国", intro:"方志敏（1899—1935），革命家，著《可爱的中国》，狱中就义。", bio:"方志敏（1899年8月21日—1935年8月6日），原名方远镇，乳名正鹄，号慧生，化名李祥松、汪祖海、徐松柏等，男，江西弋阳（現屬上饶市）人，中国近代政治人物，中國工農紅軍高级将领。\n" },
  fengzikai: { name:"丰子恺", char:"丰", nation:"中国", title:"漫画家", desc:"你与丰子恺最像——丰子恺（1898—1975），漫画家、散文家，著《护生画集》，崇尚慈悲。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/%E8%B1%90%E5%AD%90%E6%84%B7.jpg/330px-%E8%B1%90%E5%AD%90%E6%84%B7.jpg", quote:"（护生画集）", intro:"丰子恺（1898—1975），漫画家、散文家，著《护生画集》，崇尚慈悲。", bio:"豐子愷（1898年11月9日—1975年9月15日），原名潤，又名仁、仍，小名慈玉，號子顗，後改為子愷，筆名T·K。浙江省石門縣（今嘉兴桐乡市石门镇）人，中国散文家、畫家、文學家、美術家與音樂教育家。师从弘一法师李叔同，以中西融合畫法創作漫画及散文而著名，是中國漫畫藝術的先驅。他的漫畫造形簡約，畫風樸實，饒富童趣，在眾多畫家中，獨樹一格。\n" },
  feng: { name:"冯玉祥", char:"冯", nation:"中国", title:"西北军领袖", desc:"你与冯玉祥最像——冯玉祥（1882—1948），西北军领袖，以「倒戈将军」著称，后倾向民主。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Feng_Yuxiang8.jpg/330px-Feng_Yuxiang8.jpg", quote:"平民生，平民活", intro:"冯玉祥（1882—1948），西北军领袖，以「倒戈将军」著称，后倾向民主。", bio:"冯玉祥（1882年11月6日—1948年9月1日），譜名基善，字焕章，安徽廬州巢县（今巢湖市夏阁镇竹柯村）人，生長於直隸省保定府（今河北省保定市），中華民國軍政要人。馮玉祥本屬直系軍閥，第二次直奉戰爭中倒戈，改所部為國民軍，後敗退西北，自成勢力。故人稱西北軍。1935年晉任国民革命军陆军一级上将。\n" },
  fuzuoyi: { name:"傅作义", char:"傅", nation:"中国", title:"起义将领", desc:"你与傅作义最像——傅作义（1895—1974），国民党将领，促成北平和平解放。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Fu_Zuoyi3_%28cropped%29.jpg/330px-Fu_Zuoyi3_%28cropped%29.jpg", quote:"（北平和平解放）", intro:"傅作义（1895—1974），国民党将领，促成北平和平解放。", bio:"傅作義（1895年6月27日—1974年4月19日），字宜生，男，山西榮河人，中华民国及中华人民共和国政治人物與军事人物，原副国级领导人。1949年1月時為中华民国陆军二级上将，協助中國人民解放軍和平進入並佔領北平城，並於後來擔任中华人民共和国首任水利部部长，任期長達23年。晚年，傅作義任全国政协副主席。\n" },
  gu: { name:"顾维钧", char:"顾", nation:"中国", title:"民国第一外交家", desc:"你温文尔雅、精通国际法，坚信外交与规则的力量。你在巴黎和会上据理力争，是把国家尊严寄于国际舞台的理性外交家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Wellington_Koo_1945.jpg/330px-Wellington_Koo_1945.jpg", quote:"弱国无外交，唯有自强以立世界", intro:"顾维钧（1888—1985），近代著名外交家，曾在巴黎和会与联合国等场合维护国家权益。", bio:"顧維鈞（1888年1月29日—1985年11月14日），字少川，男，江苏省嘉定县（今上海市嘉定区）人，中華民國外交家。1912年任袁世凱總統英文秘書，歷任中華民國北洋政府外交總長與國務總理、署理大總統、國民政府駐法國、英國大使、駐聯合國首席代表、駐美大使、海牙國際法院副院長。1985年於美國紐約逝世，享壽97岁。\n" },
  guomoruo: { name:"郭沫若", char:"沫", nation:"中国", title:"文学家", desc:"你与郭沫若最像——郭沫若（1892—1978），文学家、史学家，新诗与历史剧的代表人物。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/%E9%83%AD%E5%BC%80%E8%B4%9E.jpg/330px-%E9%83%AD%E5%BC%80%E8%B4%9E.jpg", quote:"沧海横流，方显英雄本色", intro:"郭沫若（1892—1978），文学家、史学家，新诗与历史剧的代表人物。", bio:"郭沫若（1892年11月16日—1978年6月12日），幼名文豹，原名開貞，字鼎堂，號尚武，笔名高汝鸿、麦克昂、易坎人、谷人、爱牟、杜荃、石沱等，后以家乡大渡河和雅河的别称“沫水”和“若水”取名沫若，生于四川乐山，客家人，是中国文学家、历史学家、古文字学家、考古学家、社会活动家。中国共产党、中华人民共和国政治人物，原副国级领导人。\n" },
  hexiangning: { name:"何香凝", char:"香", nation:"中国", title:"女革命家", desc:"你与何香凝最像——何香凝（1878—1972），革命家、画家，廖仲恺夫人，毕生投身革命与妇女运动。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/%E4%BD%95%E9%A6%99%E5%87%9D%E5%A5%B3%E5%A3%AB.png/330px-%E4%BD%95%E9%A6%99%E5%87%9D%E5%A5%B3%E5%A3%AB.png", quote:"为革命与妇女解放而斗争", intro:"何香凝（1878—1972），革命家、画家，廖仲恺夫人，毕生投身革命与妇女运动。", bio:"何香凝（1878年6月27日—1972年9月1日），号双清楼主，籍贯廣東南海（今属广州市荔湾区东漖棉村），近代中国女画家、革命家、社会活动家与妇女运动先驱。\n" },
  heyingqin: { name:"何应钦", char:"何", nation:"中国", title:"陆军总司令", desc:"你与何应钦最像——何应钦（1890—1987），国民党陆军总司令，代表中国接受日本投降。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/%E4%BD%95%E6%87%89%E6%AC%BD%28%E6%93%B7%E5%8F%96%29.jpg/330px-%E4%BD%95%E6%87%89%E6%AC%BD%28%E6%93%B7%E5%8F%96%29.jpg", quote:"（受降代表）", intro:"何应钦（1890—1987），国民党陆军总司令，代表中国接受日本投降。", bio:"何應欽（1890年4月2日—1987年10月21日），字敬之，貴州興義人，祖籍江西金谿。中華民國陸軍一級上將。日本陸軍士官學校畢業，中國國民黨軍政界首要人物；在黃埔系當中，有蔣何並稱的地位。南京國民政府成立後，歷任軍政部長、國民政府軍事委員會北平軍分會委員長、大本營參謀總長、中國戰區中國陸軍總司令、聯合國軍事參謀團中國代表團團長、國防部部長及行政院院長。於1" },
  helong: { name:"贺龙", char:"贺", nation:"中国", title:"元帅", desc:"你与贺龙最像——贺龙（1896—1969），元帅，南昌起义与红军创建者之一。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/He_Long.jpg/330px-He_Long.jpg", quote:"（两把菜刀闹革命）", intro:"贺龙（1896—1969），元帅，南昌起义与红军创建者之一。", bio:"贺龙（1896年3月22日—1969年6月9日），原名贺文常，字云卿，男，湖南省桑植县洪家關人，中国工农红军與中国人民解放军的主要創始人之一，原正国级领导人，於文化大革命時遭到迫害而死。\n" },
  hong: { name:"洪秀全", char:"洪", nation:"中国", title:"太平天国天王", desc:"你满怀宗教式的理想与激情，敢于推翻旧秩序、建立心中的天国。你信念狂热、号召力强，但也易走向极端，是那种为理想不惜一切的变革者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Hong_Xiuquan.jpg/330px-Hong_Xiuquan.jpg", quote:"天下一家，共享太平", intro:"洪秀全（1814—1864），太平天国运动的发起者和「天王」，领导了近代规模最大的农民起义。", bio:"洪秀全（1814年1月1日—1864年6月1日），又名洪日，中国宗教家和革命家，是清末宗教组织上帝教创始人、太平天国运动的民變领袖以及太平天国的建立者。原名洪仁坤，小名火秀，广东廣州花县（今廣州市花都區）人。\n" },
  hu: { name:"胡适", char:"胡", nation:"中国", title:"自由主义知识分子", desc:"你理性温和、崇尚自由与渐进，主张「多研究些问题，少谈些主义」。你宽容、重实证、讲逻辑，是理性的改良主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Hu_Shih_1960_color.jpg/330px-Hu_Shih_1960_color.jpg", quote:"大胆的假设，小心的求证", intro:"胡适（1891—1962），现代学者、思想家，新文化运动旗手，倡导自由主义与实证精神。", bio:"胡適（1891年12月17日—1962年2月24日），原名嗣穈，學名洪騂，又改名適，字適之。用過的筆名有：希彊、自勝生、鐵兒、冬心、臧暉之主人、臧晖等。生于江蘇省松江府川沙廳，籍貫安徽省徽州府績溪縣上莊鎮。曾任国立北京大学校长、中央研究院院長、中华民国驻美大使；天主教輔仁大學、南开大学校董会董事等職。\n" },
  huang: { name:"黄兴", char:"黄", nation:"中国", title:"革命军事家", desc:"你与黄兴最像——黄兴（1874—1916），同盟会领袖、革命军事家，与孙中山并称「孙黄」，领导多次武装起义。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/HWANG_HSING%2C_GEN._GENERAL_LCCN2016858954_%28closeup%2C_3to4%29.jpg/330px-HWANG_HSING%2C_GEN._GENERAL_LCCN2016858954_%28closeup%2C_3to4%29.jpg", quote:"无公则无民国，有史必有斯人", intro:"黄兴（1874—1916），同盟会领袖、革命军事家，与孙中山并称「孙黄」，领导多次武装起义。", bio:"黃興（1874年10月25日—1916年10月31日），原名轸，字廑午。后改名兴，字克強，湖南長沙人，中國近代民主革命家。号庆午、竞武，曾用名李有庆、张守正、岡本義一、今村长藏。中華民國開國元勳，革命家。辛亥革命时期，與孫中山常被時人以“孫黃”並稱。1916年10月31日，黃興於上海去世。\n" },
  huangzunxian: { name:"黄遵宪", char:"遵", nation:"中国", title:"外交诗人", desc:"你与黄遵宪最像——黄遵宪（1848—1905），外交家、诗人，倡导「诗界革命」，著《日本国志》。", img:"https://upload.wikimedia.org/wikipedia/commons/7/76/Huang_Zun_Xian.jpg", quote:"我手写我口", intro:"黄遵宪（1848—1905），外交家、诗人，倡导「诗界革命」，著《日本国志》。", bio:"黃遵憲（1848年4月27日—1905年3月28日），字公度，別號人境廬主人，生於大清廣東省嘉應州（现广东省梅州市梅江区）。晚清詩人，外交家、政治家、教育家。1868年詩作一句「我手写我口」聞名。\n" },
  jiangzhujun: { name:"江竹筠", char:"江", nation:"中国", title:"革命烈士", desc:"你与江竹筠最像——江竹筠（1920—1949），革命烈士，重庆地下党，狱中坚贞不屈就义。", img:"", quote:"（红岩江姐）", intro:"江竹筠（1920—1949），革命烈士，重庆地下党，狱中坚贞不屈就义。", bio:"江竹筠（1920年8月20日—1949年11月14日），原名江竹君，人称江姐，四川省自贡市大山铺江家湾人，中国共产党地下时期重庆川东地区组织的负责人之一，为中国共产党追认的女烈士。\n" },
  jiang: { name:"蒋介石", char:"蒋", nation:"中国", title:"国民革命军统帅", desc:"你意志坚定、顽强不屈，坚信唯有统一与强军才能救国。你重秩序、讲纪律、善用权谋，是乱世中强硬而坚韧的民族主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/%E8%94%A3%E4%B8%AD%E6%AD%A3%E7%B8%BD%E7%B5%B1%E7%8E%89%E7%85%A7.png/330px-%E8%94%A3%E4%B8%AD%E6%AD%A3%E7%B8%BD%E7%B5%B1%E7%8E%89%E7%85%A7.png", quote:"精诚团结，共赴国难", intro:"蒋介石（1887—1975），国民党领导人、国民革命军统帅，领导抗战，后败退台湾。", bio:"蔣中正（1887年10月31日—1975年4月5日），字介石，谱名周泰，学名志清，浙江奉化人。歷任黃埔軍校校長、國民革命軍總司令、國民政府主席、國民政府軍事委員會委員長、中國國民黨總裁、中華民國總統等職務。\n" },
  kang: { name:"康有为", char:"康", nation:"中国", title:"维新变法领袖", desc:"你理想宏大、热血激昂，渴望以一场自上而下的变法让国家迅速富强。你敢于上书言事、挑战旧制，是充满理想与使命感的改革者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Kang_Yu-wei_cph.3a36142.jpg/330px-Kang_Yu-wei_cph.3a36142.jpg", quote:"能变则全，不变则亡；全变则强，小变仍亡", intro:"康有为（1858—1927），清末维新派领袖，发起「公车上书」、主导戊戌变法，主张君主立宪。", bio:"康有為（1858年3月19日—1927年3月31日），原名祖诒，字广厦，号长素，又号明夷、更生、西樵山人、游存叟、天游化人，广东省廣州府南海县丹灶苏村人，人称康南海，清末維新變法派主要發起者，光绪廿一年（1895年）进士，曾与弟子梁启超合作戊戌变法。變法失敗後，被慈禧太后通緝而出逃。1912年宣統退位後，康有为繼續反對共和，1917年曾與張勛合作，發動兵變，" },
  kongxiangxi: { name:"孔祥熙", char:"孔", nation:"中国", title:"财政部长", desc:"你与孔祥熙最像——孔祥熙（1880—1967），国民政府财政部长，孔宋家族代表人物。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/%E5%AD%94%E7%A5%A5%E7%86%99%E8%82%96%E5%83%8F%E7%85%A7.jpg/330px-%E5%AD%94%E7%A5%A5%E7%86%99%E8%82%96%E5%83%8F%E7%85%A7.jpg", quote:"（财阀）", intro:"孔祥熙（1880—1967），国民政府财政部长，孔宋家族代表人物。", bio:"孔祥熙（1880年9月11日—1967年8月16日），字庸之，號子淵，男，山西太谷人，祖籍山東曲阜，中華民國南京國民政府行政院長，兼財政部長，銀行家、富商，孔子第75代孫。妻子為宋靄齡；與宋子文、蔣介石、孫中山為姻親。孔祥熙長期主理國民政府財政，主要政績有改革中國幣制，建設中國銀行體系，加大國家對資本市場控制等。\n" },
  laoshe: { name:"老舍", char:"舍", nation:"中国", title:"人民艺术家", desc:"你与老舍最像——老舍（1899—1966），作家，著《骆驼祥子》《四世同堂》，人民艺术家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Standard_compressed_lao-she.jpg/330px-Standard_compressed_lao-she.jpg", quote:"人民艺术家，写尽市民悲欢", intro:"老舍（1899—1966），作家，著《骆驼祥子》《四世同堂》，人民艺术家。", bio:"舒庆春（1899年2月3日—1966年8月24日），字舍予，笔名老舍、絜青、鸿来、非我等，北京满族正红旗，近代中国小说家、散文家、剧作家、曲艺家、收藏家，被广泛认为是中国近现代文学的代表人物。其代表作有长篇小说《駱駝祥子》《四世同堂》，话剧《茶馆》等。\n" },
  dazhao: { name:"李大钊", char:"钊", nation:"中国", title:"马克思主义先驱", desc:"你温厚博学、信念坚定，是共产主义在中国的先驱。你胸怀理想、视死如归，是「铁肩担道义」的理想主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/1930_Li_Dazhao_Chinese_comintern.jpg/330px-1930_Li_Dazhao_Chinese_comintern.jpg", quote:"试看将来的环球，必是赤旗的世界", intro:"李大钊（1889—1927），中国最早的马克思主义者、中共主要创始人之一，被军阀杀害。", bio:"李大钊（1889年10月29日—1927年4月28日），字守常，男，直隶省乐亭县（今属河北省唐山市）人。中国最早的马克思主义者之一，中国共产党早期领导人之一。1913年天津法政專門學校畢業後，去日本早稻田大學讀書。曾參加反袁世凱運動。李大钊是中国国民党第一届中央执行委员会委员之一，国共两党北方组织的核心领导人，也是在国共第一次合作、国民革命军北伐時期推翻北洋" },
  li: { name:"李鸿章", char:"李", nation:"中国", title:"洋务重臣", desc:"你精于实务与权谋，懂得在列强夹缝中周旋、以夷制夷。你务实而隐忍，背负骂名也顾全大局，是乱世中无奈的斡旋者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Li_Hung_Chang_in_1896.jpg/330px-Li_Hung_Chang_in_1896.jpg", quote:"一代人只能做一代人的事", intro:"李鸿章（1823—1901），晚清重臣，洋务运动核心人物，创办北洋海军，自嘲为「裱糊匠」。", bio:"李鴻章（1823年2月15日—1901年11月7日），訓名章銅，字子黻、漸甫，號少荃、儀叟、省心，人稱李中堂、李傅相。安徽廬州合肥人（今属合肥市），晚清重臣，近代中国重要的政治家、軍事家、外交家、實業家、改革家。\n" },
  lixiannian: { name:"李先念", char:"先", nation:"中国", title:"国家主席", desc:"你与李先念最像——李先念（1909—1992），革命家，曾任国家主席，推动改革开放。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Li_Xiannian.png/330px-Li_Xiannian.png", quote:"（务实建设）", intro:"李先念（1909—1992），革命家，曾任国家主席，推动改革开放。", bio:"李先念（1909年6月23日—1992年6月21日），乳名全伢，号克念，湖北黃安人，原正国级领导人，中国人民解放军高级将领，第3任中国国家主席，木匠出身。1927年12月，加入中国共产党，并担任中国工农红军第四方面军指挥领导工作，参与长征，之后率领西路军西征失败。抗日战争期间，担任新四军第五师师长等职位。第二次国共内战期间，与刘伯承、邓小平晋冀鲁豫部队进入中" },
  lizongren: { name:"李宗仁", char:"宗", nation:"中国", title:"桂系领袖", desc:"你与李宗仁最像——李宗仁（1891—1969），桂系领袖，指挥台儿庄大捷，后任代总统。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/%E6%9D%8E%E5%AE%97%E4%BB%81%E6%88%8E%E8%A3%9D%E7%85%A7.jpg/330px-%E6%9D%8E%E5%AE%97%E4%BB%81%E6%88%8E%E8%A3%9D%E7%85%A7.jpg", quote:"（台儿庄大捷）", intro:"李宗仁（1891—1969），桂系领袖，指挥台儿庄大捷，后任代总统。", bio:"李宗仁（1891年8月13日—1969年1月30日），字德鄰，廣西桂林人，生於桂林府臨桂縣西鄉村，中華民國陸軍一級上將，中國國民黨黨員。新桂系首领，曾任行憲後首任中華民國副總統、代理總統。\n" },
  liang: { name:"梁启超", char:"梁", nation:"中国", title:"启蒙思想家", desc:"你才思敏捷、笔耕不辍，善于吸收新思想又不断反思调整。你相信启发民智、循序渐进，是温和而富有远见的启蒙者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/MinistroDeJusticiaLiangQichao.jpg/330px-MinistroDeJusticiaLiangQichao.jpg", quote:"少年强则国强", intro:"梁启超（1873—1929），近代启蒙思想家、史学家，戊戌变法领袖之一，著《少年中国说》等。", bio:"梁启超（1873年2月23日—1929年1月19日），署名作梁𠷠超，字卓如、宏猷、任甫，别号任公、饮冰室主人，广东省广州府新会县潮居都茶坑乡人，人稱梁新会。被称为“百科全书式的人物”。\n" },
  liangshuming: { name:"梁漱溟", char:"漱", nation:"中国", title:"思想家", desc:"你与梁漱溟最像——梁漱溟（1893—1988），思想家、教育家，致力于乡村建设与儒学复兴。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/%E6%A2%81%E7%84%95%E9%BC%8E.jpg/330px-%E6%A2%81%E7%84%95%E9%BC%8E.jpg", quote:"这个世界会好吗？", intro:"梁漱溟（1893—1988），思想家、教育家，致力于乡村建设与儒学复兴。", bio:"梁漱溟（1893年10月18日—1988年6月23日）。原名煥鼎，字壽銘。曾用笔名寿名、瘦民、漱溟，后以漱溟行世，男，北京人，中国現代思想家、哲學家、教育家，现代新儒家的早期代表人物之一，社会活动家，爱国民主人士，同时他还是一位社会改造实践家，對推動鄉村建設不遺餘力。故籍河南开封，清中叶官游廣西桂林，祖上系元世祖六子忽哥赤，且是元朝所封梁王的後代。其母张滢出" },
  liaozhongkai: { name:"廖仲恺", char:"恺", nation:"中国", title:"革命家", desc:"你与廖仲恺最像——廖仲恺（1877—1925），国民党左派领袖，孙中山得力助手，被暗杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/%E5%BB%96%E4%BB%B2%E6%81%BA.jpg/330px-%E5%BB%96%E4%BB%B2%E6%81%BA.jpg", quote:"为革命牺牲一切", intro:"廖仲恺（1877—1925），国民党左派领袖，孙中山得力助手，被暗杀。", bio:"廖仲愷（1877年4月23日—1925年8月20日），原名恩煦、又名夷白，字仲愷，以字行，男，籍贯广东省惠州府归善县鸭仔埗乡窑前村（今惠州市惠城区陈江街道幸福村），出生於美國加州三藩市。中國國民黨革命元勳之一，國民黨改革派人物。當孫文於1923年1月和蘇聯發表聯合聲明後，派廖仲愷与苏联進行更進一步協商，同時也送蔣介石去學習蘇聯的政治和軍事制度，1925年被人" },
  linbiao: { name:"林彪", char:"彪", nation:"中国", title:"十大元帅", desc:"你与林彪最像——林彪（1907—1971），十大元帅之一，解放战争与平型关大捷的指挥者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Linbiao2.jpg/330px-Linbiao2.jpg", quote:"打得赢就打，打不赢就走", intro:"林彪（1907—1971），十大元帅之一，解放战争与平型关大捷的指挥者。", bio:"林彪（1907年12月5日—1971年9月13日），原名祚大，字阳春，号毓蓉，曾用名育蓉、育容、育榮、尤勇等，乳名春儿，男，湖北黄冈人，原中国共产党和中华人民共和国政治人物，原正国级领导人，中国人民解放军军事家，中华人民共和国开国元勋，中华人民共和国、中国人民解放军的主要缔造者及第一代主要领导人之一，军衔为中华人民共和国元帅。\n" },
  linboqu: { name:"林伯渠", char:"伯", nation:"中国", title:"中共元老", desc:"你与林伯渠最像——林伯渠（1886—1960），中共元老，长期从事政府与统一战线工作。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/%E6%9E%97%E4%BC%AF%E6%B8%A0%E4%B8%BB%E5%B8%AD.jpg/330px-%E6%9E%97%E4%BC%AF%E6%B8%A0%E4%B8%BB%E5%B8%AD.jpg", quote:"（革命元老）", intro:"林伯渠（1886—1960），中共元老，长期从事政府与统一战线工作。", bio:"林伯渠（1886年3月20日—1960年5月29日），名祖涵，字邃园，号伯渠，以号行，男，湖南省安福縣（今临澧縣）人，中国共产党、中华人民共和国政治人物，原副国级领导人。与董必武、徐特立、谢觉哉和吴玉章并称为中共五老。\n" },
  linhuiyin: { name:"林徽因", char:"徽", nation:"中国", title:"建筑师", desc:"你与林徽因最像——林徽因（1904—1955），建筑师、诗人，参与国徽与人民英雄纪念碑设计。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Lin_Huiyin_portrait.jpg/330px-Lin_Huiyin_portrait.jpg", quote:"你是人间的四月天", intro:"林徽因（1904—1955），建筑师、诗人，参与国徽与人民英雄纪念碑设计。", bio:"林徽因（1904年6月10日—1955年4月1日），女，本名林徽音，所用英文名為Phyllis Whei Yin Lin，籍貫福建省福州府闽县，生于浙江杭州，中國建筑学家、文学家、艺术家、教育学家。\n" },
  linyutang: { name:"林语堂", char:"堂", nation:"中国", title:"作家", desc:"你与林语堂最像——林语堂（1895—1976），作家，以幽默小品与《京华烟云》名世。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Linyutang.jpg/330px-Linyutang.jpg", quote:"两脚踏中西文化，一心评宇宙文章", intro:"林语堂（1895—1976），作家，以幽默小品与《京华烟云》名世。", bio:"林语堂（1895年10月10日—1976年3月26日），中華民國作家、學者，生於福建龙溪（今平和县坂仔镇）。乳名和乐，名玉堂，后改为语堂。聖約翰大學英文學士、美國哈佛大學比較文學碩士、德國萊比錫大學語言學博士，曾任北京大学英文系教授、厦门大学文学院院長、南洋大學首位校長。最後定居香港，任香港中文大学研究教授 、聯合國教科文組織美術與文學主任、国际笔会副会長等" },
  lin: { name:"林则徐", char:"林", nation:"中国", title:"禁烟名臣", desc:"你刚正不阿、忧国忧民，敢于在列强环伺下挺身而出、捍卫国家尊严。你坚定而有骨气，宁可玉碎不为瓦全，是那种在民族危难时挺身担当的人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Portrait_of_Lin_Zexu.jpeg/330px-Portrait_of_Lin_Zexu.jpeg", quote:"苟利国家生死以，岂因祸福避趋之", intro:"林则徐（1785—1850），清末政治家、民族英雄，虎门销烟的主持者，被誉为「开眼看世界的第一人」。", bio:"林則徐（1785年8月30日—1850年11月22日），字元撫，又字少穆、石麟，晚號竢村老人、竢村退叟、七十二峰退叟、瓶泉居士、櫟社散人等，男，福建省福州府侯官縣左營司巷（今福州市鼓樓區）人，文山林氏，清朝後期政治家、思想家、文學家、改革先驅、詩人、學者、翻譯家。1811年林則徐（26歲）中進士，後曾官至一品，曾經擔任湖廣总督、陝甘總督和雲貴總督，两次受命欽" },
  liubocheng: { name:"刘伯承", char:"刘", nation:"中国", title:"元帅", desc:"你与刘伯承最像——刘伯承（1892—1986），元帅，被誉为「军神」，刘邓大军指挥者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Liu_Bocheng.jpg/330px-Liu_Bocheng.jpg", quote:"（军神）", intro:"刘伯承（1892—1986），元帅，被誉为「军神」，刘邓大军指挥者。", bio:"刘伯承（1892年12月4日—1986年10月7日），名明昭，字伯承，以字行，小名孝生，曾用名刘伯坚，四川开县（今重庆市开州区）人，中国共产党、中华人民共和国政治人物，原正国级领导人，近代中国军事家，中华人民共和国十大元帅之一，中國人民解放軍創始人和締造者之一。\n" },
  liumingchuan: { name:"刘铭传", char:"传", nation:"中国", title:"台湾巡抚", desc:"你与刘铭传最像——刘铭传（1836—1896），淮军名将、首任台湾巡抚，推动台湾近代化建设。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/%E5%8A%89%E9%8A%98%E5%82%B3%E8%82%96%E5%83%8F.jpg/330px-%E5%8A%89%E9%8A%98%E5%82%B3%E8%82%96%E5%83%8F.jpg", quote:"守土御侮，开发台湾", intro:"刘铭传（1836—1896），淮军名将、首任台湾巡抚，推动台湾近代化建设。", bio:"劉銘傳（1836年9月7日—1896年1月12日），字省三，室號盤亭，自号大潛山人，安徽合肥人，淮軍將領，首位臺湾巡撫。諡號壯肅。\n" },
  luxun: { name:"鲁迅", char:"鲁", nation:"中国", title:"民族魂·文学巨匠", desc:"你冷峻犀利、独立思考，用笔作匕首解剖国民性。你愤世嫉俗又心怀大爱，宁折不弯、绝不同流合污，是清醒而孤独的批判者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/%E9%B2%81%E8%BF%85_1933%E5%B9%B45%E6%9C%8826%E6%97%A5%E6%91%84%E4%BA%8E%E4%B8%8A%E6%B5%B7.jpg/330px-%E9%B2%81%E8%BF%85_1933%E5%B9%B45%E6%9C%8826%E6%97%A5%E6%91%84%E4%BA%8E%E4%B8%8A%E6%B5%B7.jpg", quote:"横眉冷对千夫指，俯首甘为孺子牛", intro:"鲁迅（1881—1936），现代文学家、思想家，以犀利笔锋批判国民性，被誉为「民族魂」。", bio:"周树人（1881年9月25日—1936年10月19日），原名周樟寿，字豫山、豫亭，后改字豫才，笔名鲁迅，浙江紹興人，中国近代作家、设计师、新文化运动领袖之一。鲁迅生前創作了杂文、短中篇小说、文学、思想和社会评论、学术著作、自然科学著作、古代典籍校勘与研究、散文、现代散文诗、旧体诗、外国文学与学术翻译作品和木刻版画的研究，对于五四运动以后的中国社会与文化产生极" },
  mao: { name:"毛泽东", char:"毛", nation:"中国", title:"革命领袖", desc:"你理想热忱、意志如铁，怀有改天换地的雄心。你看重群众动员与斗争，敢于打破一切旧框架，越挫越勇、绝不屈服，是彻底的革命者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Mao_Zedong_1950_Portrait_%283x4_cropped%29.jpg/330px-Mao_Zedong_1950_Portrait_%283x4_cropped%29.jpg", quote:"星星之火，可以燎原", intro:"毛泽东（1893—1976），中国革命家、理论家、诗人，新中国的缔造者与主要领导人。", bio:"毛泽东（1893年12月26日—1976年9月9日），字润之，湖南湘潭人，中国近现代马列主义理论家、革命家、政治家、军事战略家、诗人、书法家。1943年成为中共实质上最高领导人、1949年成为中华人民共和国最高领导人，是中国共产党、中国人民解放军和中华人民共和国的主要缔造者。\n" },
  maodun: { name:"茅盾", char:"茅", nation:"中国", title:"文学巨匠", desc:"你与茅盾最像——茅盾（1896—1981），文学巨匠，著《子夜》《林家铺子》，左翼文学领袖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/%E8%8C%85%E7%9B%BE%E6%B2%88%E9%9B%81%E5%86%B0.jpg/330px-%E8%8C%85%E7%9B%BE%E6%B2%88%E9%9B%81%E5%86%B0.jpg", quote:"（子夜）", intro:"茅盾（1896—1981），文学巨匠，著《子夜》《林家铺子》，左翼文学领袖。", bio:"茅盾（1896年7月4日—1981年3月27日），原名沈鸿，谱名（一说学名）沈德鴻，幼名燕昌，字雁冰，别号醒狮山民，以字行，浙江桐乡人，中國现代作家及文学评论家，中国共产党、中华人民共和国政治人物，原副国级领导人。曾任全国政协副主席、中国作家协会主席。常用的笔名有茅盾、玄珠、方璧、止敬、蒲牢、形天、P生等。在文學創作方面，茅盾於1928年發表首部小說《蚀》（" },
  nierongzhen: { name:"聂荣臻", char:"聂", nation:"中国", title:"元帅", desc:"你与聂荣臻最像——聂荣臻（1899—1992），元帅，创建晋察冀抗日根据地。", img:"https://upload.wikimedia.org/wikipedia/commons/0/02/Marshal_Nie_Rongzhen.jpg", quote:"（晋察冀）", intro:"聂荣臻（1899—1992），元帅，创建晋察冀抗日根据地。", bio:"聂荣臻（1899年12月29日—1992年5月14日），字福骈，小名双全，男，四川省江津县（今重庆市江津区）人，中国共产党和中华人民共和国军事家及政治人物，原正国级领导人，为中华人民共和国十大元帅之一，以及中国共产党和中華人民共和國第二代主要領導人之一。\n" },
  peng: { name:"彭德怀", char:"彭", nation:"中国", title:"横刀立马的元帅", desc:"你刚直不阿、敢说真话，战功赫赫却从不阿谀奉承。你实事求是、宁折不弯，是顶天立地的硬汉。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/General_Peng_Dehuai.jpg/330px-General_Peng_Dehuai.jpg", quote:"谁敢横刀立马，唯我彭大将军", intro:"彭德怀（1898—1974），中国人民解放军元帅，抗美援朝指挥者，以刚直敢言著称。", bio:"彭德怀（1898年10月24日—1974年11月29日），原名清宗，字懷歸，號得華。后改德怀，小名钟伢子、石穿，男，湖南湘潭人，中国共产党、中华人民共和国军事家、政治家，毕业于湖南陸軍軍官講武堂，原正国级领导人，是中华人民共和国十大元帅之一。\n" },
  qianmu: { name:"钱穆", char:"穆", nation:"中国", title:"史学家", desc:"你与钱穆最像——钱穆（1895—1990），史学家，以《国史大纲》捍卫中华文化传统。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/%E9%8C%A2%E7%A9%86.jpg/330px-%E9%8C%A2%E7%A9%86.jpg", quote:"对本国历史怀一份温情与敬意", intro:"钱穆（1895—1990），史学家，以《国史大纲》捍卫中华文化传统。", bio:"錢穆（1895年7月30日—1990年8月30日），原名錢恩鑅，字賓四，是出身江蘇無錫的歷史學家、哲學家及作家等，亦是吳越錢氏的後代。他是香港新亞書院、新亞研究所及新亞中學的共同創辦人。钱穆毕生弘扬中国传统文化，高举现代新儒家的旗帜，在海内外产生了巨大影响。其著述颇丰，专著多达80种以上；他與呂思勉、陳垣、陳寅恪也因而被一同稱作中國的「（現代）四大史學家」。" },
  qianzhongshu: { name:"钱钟书", char:"钟", nation:"中国", title:"文学家", desc:"你与钱钟书最像——钱钟书（1910—1998），文学家，著《围城》《管锥编》，学识渊博。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/%E9%92%B1%E9%92%9F%E4%B9%A6.jpg/330px-%E9%92%B1%E9%92%9F%E4%B9%A6.jpg", quote:"城外的人想冲进去，城里的人想逃出来", intro:"钱钟书（1910—1998），文学家，著《围城》《管锥编》，学识渊博。", bio:"钱锺书（1910年11月21日—1998年12月19日），原名仰先，字哲良，后改名鍾書，字默存，号槐聚，曾用笔名中书君，江苏无锡人，作家、学者。\n" },
  qiujin: { name:"秋瑾", char:"秋", nation:"中国", title:"鉴湖女侠", desc:"你英姿飒爽、侠肝义胆，为革命与妇女解放不惜献身。你刚烈豪迈、视死如归，是巾帼不让须眉的革命志士。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Qiu_jin.jpg/330px-Qiu_jin.jpg", quote:"身不得男儿列，心却比男儿烈", intro:"秋瑾（1875—1907），近代民主革命家、女权先驱，参加反清起义失败就义，号「鉴湖女侠」。", bio:"秋瑾（1875年11月8日—1907年7月15日），初名闺瑾，乳名玉姑，字璿卿，号旦吾，留學日本后改名瑾，號（或作别号）竞雄，自称鉴湖女侠，笔名秋千、汉侠女儿，曾用笔名白萍。浙江省紹興府山陰縣人，生于福建省福州府閩縣。中國近代女權運動家、革命志士。1907年7月被清廷处决于浙江绍兴。\n" },
  ronglu: { name:"荣禄", char:"荣", nation:"中国", title:"晚清重臣", desc:"你与荣禄最像——荣禄（1836—1903），晚清重臣，慈禧倚重之人，戊戌政变中的关键人物。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/%E5%8C%97%E6%B8%85%E5%90%8D%E8%83%9C%E8%8D%A3%E7%A6%84.jpg/330px-%E5%8C%97%E6%B8%85%E5%90%8D%E8%83%9C%E8%8D%A3%E7%A6%84.jpg", quote:"以稳字为要，维系清室", intro:"荣禄（1836—1903），晚清重臣，慈禧倚重之人，戊戌政变中的关键人物。", bio:"荣禄（1836年4月7日—1903年4月11日），字仲华，号略園，乌喇瓜尔佳氏。正白旗满洲人。清末重臣，官至太子太保、文華殿大學士、軍機大臣。末代皇帝溥仪的外祖父，是慈禧太后的亲信和重臣。諡文忠。\n" },
  shencongwen: { name:"沈从文", char:"从", nation:"中国", title:"作家", desc:"你与沈从文最像——沈从文（1902—1988），作家，以《边城》描绘湘西风情，后转向文物研究。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Shencongwen001.jpg/330px-Shencongwen001.jpg", quote:"照我思索，能理解我；照我思索，可认识人", intro:"沈从文（1902—1988），作家，以《边城》描绘湘西风情，后转向文物研究。", bio:"沈從文（1902年12月28日—1988年5月10日），原名沈岳煥，字崇文，後改名沈從文，筆名有休芸芸、懋琳、甲辰、上官碧、小兵、炯之等，齋名窄而霉齋，男，湖南凤凰人，中国现代文学家、小说家、散文家和考古学专家。\n" },
  shenjunru: { name:"沈钧儒", char:"沈", nation:"中国", title:"民主人士", desc:"你与沈钧儒最像——沈钧儒（1875—1963），民主人士、法学家，救国会「七君子」之一。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Shen_Junru.jpg/330px-Shen_Junru.jpg", quote:"（七君子）", intro:"沈钧儒（1875—1963），民主人士、法学家，救国会「七君子」之一。", bio:"沈钧儒（1875年1月2日—1963年6月11日），字秉甫，号衡山，浙江嘉兴人，生於江苏苏州。中国社会活动家、政治家、律师、教育家，原副国级领导人。晚清末科进士，民初入同盟會，出仕北洋政府。四一二政变以後，反對國民政府，發起中国民主同盟。中华人民共和国成立後，歷任全国政协副主席、全国人大常委会副委员长等職。\n" },
  shengxuanhuai: { name:"盛宣怀", char:"盛", nation:"中国", title:"实业官僚", desc:"你与盛宣怀最像——盛宣怀（1844—1916），洋务派官僚、实业家，创办多项官督商办企业。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/SXH001.jpg/330px-SXH001.jpg", quote:"实业救国", intro:"盛宣怀（1844—1916），洋务派官僚、实业家，创办多项官督商办企业。", bio:"盛宣怀（1844年11月4日—1916年4月27日），字杏荪（杏生、荇生）、幼勖，号補樓，又号愚齋、次沂、止叟等，男，江苏常州府武进县龙溪人，清末官商，政治家，洋务运动的代表人物。历任招商局会办，电报局总办，津海关道，中国红十字会会长等职，累官至邮传部尚书。北洋大学堂（今天津大学）和南洋公学（今西安交通大学、上海交通大学、西南交通大学、國立交通大學）创始人，" },
  songjiaoren: { name:"宋教仁", char:"仁", nation:"中国", title:"宪政先驱", desc:"你与宋教仁最像——宋教仁（1882—1913），同盟会领袖，主张责任内阁与政党政治，被暗杀。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Sung_Chiao-jen.jpg/330px-Sung_Chiao-jen.jpg", quote:"宪政行乎，则国基固", intro:"宋教仁（1882—1913），同盟会领袖，主张责任内阁与政党政治，被暗杀。", bio:"宋教仁（1882年4月5日—1913年3月22日），字鈍初，號敦初，笔名漁父。出生於湖南桃源。中國近代民主革命家，是中華民國初期第一位倡導责任內閣制的政治家，担任过华兴会和同盟會的主要領導、中華民國臨時政府唐紹儀內閣的農林部總長、也是國民黨的主要籌建人。曾留学日本法政大學 、早稻田大学。1913年3月20日，时任國民黨代理理事长的宋教仁在上海北站遭黑道分子枪" },
  songmeiling: { name:"宋美龄", char:"美", nation:"中国", title:"蒋夫人", desc:"你与宋美龄最像——宋美龄（1898—2003），蒋介石夫人，抗战期间赴美演说争取援助。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Soong_May-ling_giving_a_special_radio_broadcast.jpg/330px-Soong_May-ling_giving_a_special_radio_broadcast.jpg", quote:"（外交与抗战）", intro:"宋美龄（1898—2003），蒋介石夫人，抗战期间赴美演说争取援助。", bio:"宋美齡（1898年3月4日—2003年10月23日），生於上海公共租界，籍貫文昌，尊称为蔣夫人，中華民國政治人物，中國國民黨總裁及第1至5屆中華民國總統蔣中正的第二任妻子，前中國國民黨主席及第6、7任中華民國總統蔣經國之繼母；曾任中國國民黨中央委員會及中國國民黨中央評議委員會主席团主席、中國國民黨中央婦女工作指導會議指導長、天主教輔仁大學董事長及名譽董事長，" },
  song: { name:"宋庆龄", char:"宋", nation:"中国", title:"国母·和平主义者", desc:"你温婉坚定、心怀大爱，毕生为和平、民主与妇女儿童事业奔走。你理想主义而立场鲜明，是道义与仁爱的化身。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Soong_Ching-ling.jpg/330px-Soong_Ching-ling.jpg", quote:"和平、奋斗、救中国", intro:"宋庆龄（1893—1981），孙中山夫人，著名的爱国主义、民主主义与国际和平活动家。", bio:"宋庆龄（曾用英文名Rosamonde；1893年1月27日—1981年5月29日），曾用名宋庆林、宋庆琳，20世纪中国政治人物、社会活动家，中华人民共和国正国级领导人，孫中山遺孀，宋氏家族成员。宋庆龄为迄今唯一一位女性及非中國共產黨黨籍身份履行中华人民共和国國家元首職權者，早期秘密加入共产国际，後在臨終前15天加入中共。\n" },
  songziwen: { name:"宋子文", char:"子", nation:"中国", title:"财政家", desc:"你与宋子文最像——宋子文（1894—1971），财政家、外交家，长期主管国民政府财政金融。", img:"", quote:"（财政与外交）", intro:"宋子文（1894—1971），财政家、外交家，长期主管国民政府财政金融。", bio:"宋子文（1894年12月4日—1971年4月26日），男，籍貫海南岛文昌，生於上海。民國年間宋氏家族成員之一。父親宋嘉澍（原名韓教准）是北宋三朝宰相韩琦的二十九代孙，是美南監理會（今衛理公會）的牧師及富商，孫中山革命支持者。與大姐宋靄齡的丈夫孔祥熙，二姐宋慶齡的丈夫孫中山，弟弟宋子良，妹妹宋美齡的丈夫蔣中正關係都很密切。1927年起，歷任國民政府財政部長、中" },
  suyu: { name:"粟裕", char:"裕", nation:"中国", title:"开国大将", desc:"你与粟裕最像——粟裕（1907—1984），中国人民解放军大将，淮海战役的主要指挥者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Suyu1955.jpg/330px-Suyu1955.jpg", quote:"（常胜将军）", intro:"粟裕（1907—1984），中国人民解放军大将，淮海战役的主要指挥者。", bio:"粟裕（1907年8月10日—1984年2月5日），幼名继业，学名多珍，字裕，以字行，湖南会同人。中国人民解放军的主要领导人之一。中国无产階级革命家、军事家。中国共产党、中华人民共和国政治和军事人物，原副国级领导人。1955年被授予大將軍銜，位于开国十位大将第一，并被同时授予一级八一勋章、一级独立自由勋章和一级解放勋章。当时毛泽东奖评粟裕是“淮海战争第一功”。" },
  sunliren: { name:"孙立人", char:"立", nation:"中国", title:"抗日名将", desc:"你与孙立人最像——孙立人（1900—1990），抗日名将，率远征军入缅作战，战功卓著。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Sun_Li-jen.jpg/330px-Sun_Li-jen.jpg", quote:"（远征军名将）", intro:"孙立人（1900—1990），抗日名将，率远征军入缅作战，战功卓著。", bio:"孫立人（1900年12月8日—1990年11月19日），字撫民，號仲能，安徽省廬州府舒城縣三河鎮人，中华民国陸軍二級上將。孙立人在清華大學庚子賠款留美預科1923屆毕业后，先后获得美国普渡大學土木工程學士學位、美国維吉尼亞軍校博雅教育學士学位，是抗日戰爭時期少數留美、且不是中華民國陸軍軍官學校出身的軍官。拥有美国留学背景的中華民國財政部部長宋子文賞識留美軍人" },
  sun: { name:"孙中山", char:"孙", nation:"中国", title:"革命先行者", desc:"你百折不挠、理想坚定，以「民族、民权、民生」为纲，毕生为推翻帝制、建立共和而奔走。你开放包容、矢志不渝，是纯粹的理想主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/%E5%AD%99%E4%B8%AD%E5%B1%B1%E8%82%96%E5%83%8F.jpg/330px-%E5%AD%99%E4%B8%AD%E5%B1%B1%E8%82%96%E5%83%8F.jpg", quote:"革命尚未成功，同志仍须努力", intro:"孙中山（1866—1925），中国民主革命先行者，创立同盟会、领导辛亥革命，提出三民主义。", bio:"孫中山（1866年11月12日—1925年3月12日），讀書時取名文，字載之，譜名德明，幼名帝象，1886年改号逸仙，1897年化名中山樵。廣東香山（今中山市）翠亨鄉人。孫中山為清末政治家、革命家，對近代中國民主政治之發展有深遠的影響。偉大的民主革命先驅者、中華民國的創始人。\n" },
  tansitong: { name:"谭嗣同", char:"嗣", nation:"中国", title:"戊戌君子", desc:"你与谭嗣同最像——谭嗣同（1865—1898），戊戌变法中坚，拒绝逃亡，从容就义。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Tansitong.jpg/330px-Tansitong.jpg", quote:"我自横刀向天笑，去留肝胆两昆仑", intro:"谭嗣同（1865—1898），戊戌变法中坚，拒绝逃亡，从容就义。", bio:"譚嗣同（1865年3月10日—1898年9月28日），字復生，號壯飛，齋名莽蒼蒼齋，湖南長沙瀏陽人，出身世家，與陳三立、譚延闓並稱「湖湘三公子」。清末百日維新人物，維新四公子及戊戌六君子之一。\n" },
  tangshaoyi: { name:"唐绍仪", char:"唐", nation:"中国", title:"民国总理", desc:"你与唐绍仪最像——唐绍仪（1862—1938），外交家、民国首任内阁总理。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/%E5%94%90%E7%BB%8D%E4%BB%AA.jpg/330px-%E5%94%90%E7%BB%8D%E4%BB%AA.jpg", quote:"折冲樽俎，维护国权", intro:"唐绍仪（1862—1938），外交家、民国首任内阁总理。", bio:"唐紹儀（1862年1月2日—1938年9月30日），又名紹怡，字少川，廣東广州府香山縣人，清末民初政治人物、外交家、翻译。留美歸國學生中第一位出任清廷侍郎、尚書級與省區巡撫級要職的人，1912年擔任中華民國首任國務總理，之後在廣州軍政府、國民政府擔任不同職位的官職，1938年9月30日被國民政府軍統特工殺手暗殺於上海。\n" },
  taoxingzhi: { name:"陶行知", char:"陶", nation:"中国", title:"教育家", desc:"你与陶行知最像——陶行知（1891—1946），教育家，倡导「生活即教育」，创办晓庄师范。", img:"https://upload.wikimedia.org/wikipedia/commons/2/2b/Tao_Xing-zhi.jpg", quote:"捧着一颗心来，不带半根草去", intro:"陶行知（1891—1946），教育家，倡导「生活即教育」，创办晓庄师范。", bio:"陶行知（1891年10月18日—1946年7月25日），字世昌，安徽省歙县人，中国教育家。其本名陶文濬，因欣賞王陽明「知行合一」學說改名為知行，後認為「行是知之始；知是行之成」，又改名為行知。\n" },
  wangjingwei: { name:"汪精卫", char:"汪", nation:"中国", title:"政治人物", desc:"你与汪精卫最像——汪精卫（1883—1944），早年革命志士，后投靠日本建立汪伪政权。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Wang_Jingwei_1940.tif/lossless-page1-330px-Wang_Jingwei_1940.tif.png", quote:"引刀成一快，不负少年头", intro:"汪精卫（1883—1944），早年革命志士，后投靠日本建立汪伪政权。", bio:"汪兆銘（1883年5月4日—1944年11月10日），字季新，中华民国政治人物、詩人，出生於廣東三水（今佛山市三水區），番禺（今廣州市越秀區）捕屬人，毕业于日本法政大学。1905年在東京加入中國同盟會，以笔名汪精卫主笔《民报》。1910年，因謀刺清朝摄政王载沣失敗而下獄問死，後在肅親王善耆斡旋下，改判終身監禁；武昌起義後獲釋，同時為袁世凱、孫中山倚重，引導南" },
  wangguowei: { name:"王国维", char:"维", nation:"中国", title:"国学大师", desc:"你与王国维最像——王国维（1877—1927），国学大师，集史学、文学、哲学于一身，自沉昆明湖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/%E7%8E%8B%E5%9C%8B%E7%B6%AD.jpg/330px-%E7%8E%8B%E5%9C%8B%E7%B6%AD.jpg", quote:"独立之精神，自由之思想", intro:"王国维（1877—1927），国学大师，集史学、文学、哲学于一身，自沉昆明湖。", bio:"王国维（1877年12月3日—1927年6月2日），初名德桢，字静安，又字伯隅，初号礼堂，晚号观堂（甲骨四堂之一），又号人間、永观，谥忠悫。浙江省杭州府海宁人，中国学者、国学大师。\n" },
  wangming: { name:"王明", char:"明", nation:"中国", title:"共产国际代表", desc:"你与王明最像——王明（1904—1974），中共早期领导人，奉行共产国际教条主义路线。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/%E9%99%88%E7%BB%8D%E7%A6%B9%E6%A0%87%E5%BF%97%E5%83%8F.png/330px-%E9%99%88%E7%BB%8D%E7%A6%B9%E6%A0%87%E5%BF%97%E5%83%8F.png", quote:"（教条主义）", intro:"王明（1904—1974），中共早期领导人，奉行共产国际教条主义路线。", bio:"王明（1904年5月23日—1974年3月27日），原名陈绍禹（一说陈绍玉），字露清，笔名韶玉、慕石、兆雨、诏玉、绍玉、玉石等，曾化名泰山、风康、石绍禹、绍虞等，俄译化名马马维奇、波波维奇、克劳白夫等，安徽金寨县双石乡（现属安徽六安市）码头村人，中国共产党早期领导人之一，曾任中国共产党中央委员会代理总书记。\n" },
  wenyiduo: { name:"闻一多", char:"多", nation:"中国", title:"诗人", desc:"你与闻一多最像——闻一多（1899—1946），诗人、学者，以《红烛》《死水》闻名，被暗杀。", img:"https://upload.wikimedia.org/wikipedia/commons/0/04/%E9%97%BB%E4%B8%80%E5%A4%9A01.jpg", quote:"诗人的天赋是爱——爱他的祖国，爱他的人民", intro:"闻一多（1899—1946），诗人、学者，以《红烛》《死水》闻名，被暗杀。", bio:"聞一多（1899年11月24日—1946年7月15日），原名家驊、亦多，曾名多，字益善，號友三、友山，湖北蘄水縣巴河鎮聞家鋪（今湖北省浠水縣巴河鎮聞家鋪村）人，中國詩人兼學者。聞一多出生於鄉紳家庭，自幼打下國學根基，12歲時入讀北京清華學校，曾參與五四運動，22歲時赴美留學三年，專修藝術，未取得學位已回中國。聞一多先後出任國立北京藝術專門學校、吳淞政治大學、" },
  wengtonghe: { name:"翁同龢", char:"龢", nation:"中国", title:"帝师", desc:"你与翁同龢最像——翁同龢（1830—1904），光绪帝师，晚清重臣，主张对日主战。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Weng_Tonghe2.jpg/330px-Weng_Tonghe2.jpg", quote:"以忠君自勉，以名节自守", intro:"翁同龢（1830—1904），光绪帝师，晚清重臣，主张对日主战。", bio:"翁同龢（1830年5月19日—1904年7月4日），字叔平，號松禪，晚號瓶庵居士、人稱翁帝師、翁師傅，江蘇蘇州常熟人，清末大臣、书法家、状元。官至戶部、工部尚書、軍機大臣兼總理各國事務衙门大臣。是同治帝和光绪帝的两代帝师。\n" },
  wupeifu: { name:"吴佩孚", char:"孚", nation:"中国", title:"直系军阀", desc:"你与吴佩孚最像——吴佩孚（1874—1939），直系军阀，曾称「秀才将军」，晚节拒做汉奸。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Wu_Peifu_with_sword.jpg/330px-Wu_Peifu_with_sword.jpg", quote:"不住租界、不积私财、不纳妾、不出国", intro:"吴佩孚（1874—1939），直系军阀，曾称「秀才将军」，晚节拒做汉奸。", bio:"吳佩孚（1874年4月22日—1939年12月4日），字子玉，男，山东省蓬莱县人。晚清秀才，中華民國陸軍一级上將，民国北京政府軍上将军（直系），北洋军阀中曾經為實力最雄厚的軍閥之一，官至直鲁豫巡阅使。\n" },
  wuyuzhang: { name:"吴玉章", char:"玉", nation:"中国", title:"革命教育家", desc:"你与吴玉章最像——吴玉章（1878—1966），革命家、教育家，中国人民大学创办者之一。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Wu_Yuzhang.jpg/330px-Wu_Yuzhang.jpg", quote:"一辈子做好事，不做坏事", intro:"吴玉章（1878—1966），革命家、教育家，中国人民大学创办者之一。", bio:"吴玉章（1878年12月30日—1966年12月12日），名永珊，号玉章，男，四川荣县人，中国民主革命家，中国共产党党员，中国人民大学首任校长。\n" },
  wuzhihui: { name:"吴稚晖", char:"稚", nation:"中国", title:"无政府主义者", desc:"你与吴稚晖最像——吴稚晖（1865—1953），无政府主义者、语言学家，推动国语统一运动。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/%E5%90%B4%E6%95%AC%E6%81%92%E9%99%A2%E5%A3%AB.jpg/330px-%E5%90%B4%E6%95%AC%E6%81%92%E9%99%A2%E5%A3%AB.jpg", quote:"（嬉笑怒骂皆文章）", intro:"吴稚晖（1865—1953），无政府主义者、语言学家，推动国语统一运动。", bio:"吴稚晖（1865年3月25日—1953年10月30日），原名脁（一作眺），学名纪灵（又作寄蛉），后改名敬恒，字稚暉，号朏盦、朏庵，笔名燃、夷、吴朏等，以字行，男，江苏武进人，中華民國政治人物，革命元老。\n" },
  wutingfang: { name:"伍廷芳", char:"伍", nation:"中国", title:"外交家", desc:"你与伍廷芳最像——伍廷芳（1842—1922），外交家、法学家，推动近代法治建设。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/Wu_Tingfang_by_Gutekunst_1902_%28cropped%29.jpg/330px-Wu_Tingfang_by_Gutekunst_1902_%28cropped%29.jpg", quote:"法律面前人人平等", intro:"伍廷芳（1842—1922），外交家、法学家，推动近代法治建设。", bio:"伍廷芳，JP（1842年7月9日—1922年6月23日），本名叙，字文爵，又名才，号秩庸，齋號、筆名觀渡廬，清末民初外交家、法學家、书法家。伍氏祖籍廣東新會，生於英屬馬六甲，是首位取得英國律師資格的華人，香港早期华人精英，也是香港首名華人大律師和首名華人立法局議員。後於中國從政，是近代有名的政治家，官至中華民國外交總長。\n" },
  xiangjingyu: { name:"向警予", char:"警", nation:"中国", title:"女革命家", desc:"你与向警予最像——向警予（1895—1928），中共早期妇女运动领袖，英勇就义。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/%E5%90%91%E8%AD%A6%E4%BA%88.jpg/330px-%E5%90%91%E8%AD%A6%E4%BA%88.jpg", quote:"为妇女解放而斗争", intro:"向警予（1895—1928），中共早期妇女运动领袖，英勇就义。", bio:"向警予（1895年9月4日—1928年5月1日），原名俊贤，女，土家族，湖南溆浦人，中国共产党创始人及早期领导人之一，妇女运动领袖。\n" },
  xiaohong: { name:"萧红", char:"红", nation:"中国", title:"作家", desc:"你与萧红最像——萧红（1911—1942），作家，著《呼兰河传》，以女性视角书写苦难。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Xiao-Hong_died_1942.jpg/330px-Xiao-Hong_died_1942.jpg", quote:"满天星光，满屋月亮，人生何如，为什么这么悲凉", intro:"萧红（1911—1942），作家，著《呼兰河传》，以女性视角书写苦难。", bio:"萧红（1911年6月1日—1942年1月22日），本名张廼莹，曾用名张秀环，乳名荣华，笔名萧红、悄吟、田娣、玲玲，黑龙江省呼兰县（今哈尔滨市呼兰区）人，中華民國的现代女性主义作家，被誉为三十年代的“文学洛神”。\n" },
  xuxiangqian: { name:"徐向前", char:"徐", nation:"中国", title:"元帅", desc:"你与徐向前最像——徐向前（1901—1990），元帅，红四方面军主要领导人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Xu_Xiangqian.jpg/330px-Xu_Xiangqian.jpg", quote:"（红军名将）", intro:"徐向前（1901—1990），元帅，红四方面军主要领导人。", bio:"徐向前（1901年11月8日—1990年9月21日），原名徐象谦，字子敬，男，山西五台人，中国共产党和中华人民共和国政治人物，原正国级领导人，20世纪中国军事家、革命者，为中华人民共和国十大元帅之一。\n" },
  xuzhimo: { name:"徐志摩", char:"志", nation:"中国", title:"诗人", desc:"你与徐志摩最像——徐志摩（1897—1931），诗人，新月派代表，著《再别康桥》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/%E5%BE%90%E5%BF%97%E6%91%A9%E8%82%96%E5%83%8F%E7%85%A7.jpg/330px-%E5%BE%90%E5%BF%97%E6%91%A9%E8%82%96%E5%83%8F%E7%85%A7.jpg", quote:"再别康桥", intro:"徐志摩（1897—1931），诗人，新月派代表，著《再别康桥》。", bio:"徐志摩（1897年1月15日—1931年11月19日），譜名章垿，初字槱森，出國後改字志摩，小字又申，笔名南湖、云中鹤等，浙江海寧人，中國新月派現代詩人，散文家、翻译家。徐志摩倡導新詩格律，對中國新詩貢獻良多。\n" },
  xueyue: { name:"薛岳", char:"岳", nation:"中国", title:"抗日名将", desc:"你与薛岳最像——薛岳（1896—1998），抗日名将，指挥长沙会战重创日军。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/%E8%96%9B%E5%B2%B3%E5%B0%86%E5%86%9B.jpg/330px-%E8%96%9B%E5%B2%B3%E5%B0%86%E5%86%9B.jpg", quote:"（长沙保卫战）", intro:"薛岳（1896—1998），抗日名将，指挥长沙会战重创日军。", bio:"薛岳（1896年12月17日—1998年5月3日），原名仰岳，字伯陵，中華民國陸軍一級上將，广东韶州府乐昌县客家人，在抗日战争中多次胜利，被认为是抗战中歼灭日军最多的中国将领，因此被日軍冠以“薛老虎”之稱，被飛虎隊的陳納德將軍稱為「亞洲巴頓」。\n" },
  yanfu: { name:"严复", char:"严", nation:"中国", title:"启蒙翻译家", desc:"你与严复最像——严复（1854—1921），近代启蒙思想家，译《天演论》开启民智。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E4%B8%A5%E5%A4%8D.jpg/330px-%E4%B8%A5%E5%A4%8D.jpg", quote:"物竞天择，适者生存", intro:"严复（1854—1921），近代启蒙思想家，译《天演论》开启民智。", bio:"嚴復（1854年1月8日—1921年10月27日），乳名體乾，初名传初，改名宗光，字又陵，后名復，字几道，晚号瘉壄老人，福建省福州府侯官縣人，祖籍河南固始。中国近代启蒙思想家、翻译家。曾為复旦大学校长，京師大學堂校長，籌安會六君子之一。\n" },
  yanxishan: { name:"阎锡山", char:"阎", nation:"中国", title:"山西王", desc:"你与阎锡山最像——阎锡山（1883—1960），晋系军阀，长期主政山西。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Yan_Xishan.jpg/330px-Yan_Xishan.jpg", quote:"（晋系军阀）", intro:"阎锡山（1883—1960），晋系军阀，长期主政山西。", bio:"閻錫山（1883年10月8日—1960年5月23日），字百川、伯川，号龙池，山西五臺人，中华民国政治及军事人物，清末举人，中国同盟会会员、中華民國北洋政府将军府「同武上将军」，中華民國國軍（及其前身國民革命軍）陸軍一級上將，北洋軍閥「晉系」領袖，曾出任中華民國行政院院長、國防部部長、總統府資政、中国国民党中央评议委员、山西大学校长等職務。\n" },
  yanyangchu: { name:"晏阳初", char:"晏", nation:"中国", title:"平民教育家", desc:"你与晏阳初最像——晏阳初（1890—1990），平民教育家，倡导识字教育与乡村改造，被誉为「世界平民教育之父」。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Y._C._James_Yen.png/330px-Y._C._James_Yen.png", quote:"除天下文盲，作世界新民", intro:"晏阳初（1890—1990），平民教育家，倡导识字教育与乡村改造，被誉为「世界平民教育之父」。", bio:"晏阳初（1890年10月26日—1990年1月17日），原名兴复，字阳初，小名云霖，中学时代曾用名遇春（1921年前后恢复原名），四川巴中人，中国平民教育家和乡村建设家。是近代中国平民教育的先驱。\n" },
  yangjingyu: { name:"杨靖宇", char:"宇", nation:"中国", title:"抗日民族英雄", desc:"你与杨靖宇最像——杨靖宇（1905—1940），东北抗联领袖，孤身战斗至最后一刻，壮烈牺牲。", img:"https://upload.wikimedia.org/wikipedia/commons/8/89/Yang_jingyu.jpg", quote:"誓死不当亡国奴", intro:"杨靖宇（1905—1940），东北抗联领袖，孤身战斗至最后一刻，壮烈牺牲。", bio:"杨靖宇（1905年2月13日—1940年2月23日），本名马尚德，字骥生，河南确山人，中國军事人物，中国抗日战争名将和烈士。杨靖宇是中國共產黨黨員，曾任东北抗日联军第一路军总司令和中共满洲省委的军委代理书记。\n" },
  yangkaihui: { name:"杨开慧", char:"开", nation:"中国", title:"革命烈士", desc:"你与杨开慧最像——杨开慧（1901—1930），革命烈士，毛泽东之妻，被捕后英勇就义。", img:"https://upload.wikimedia.org/wikipedia/commons/1/1d/Yang_Kaihui.jpg", quote:"（英勇就义）", intro:"杨开慧（1901—1930），革命烈士，毛泽东之妻，被捕后英勇就义。", bio:"杨开慧（1901年11月6日—1930年11月14日），字云锦，号霞，女，湖南省长沙县板仓乡（今开慧乡）人，中国革命家，杨昌济之女，毛泽东的第二任妻子，育有三個兒子，分別為毛岸英、毛岸青及毛岸龍。\n" },
  yejianying: { name:"叶剑英", char:"叶", nation:"中国", title:"元帅", desc:"你与叶剑英最像——叶剑英（1897—1986），元帅，多次在历史转折关头发挥关键作用。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Ye_Jianying.jpg/330px-Ye_Jianying.jpg", quote:"（吕端大事不糊涂）", intro:"叶剑英（1897—1986），元帅，多次在历史转折关头发挥关键作用。", bio:"叶剑英（1897年4月28日—1986年10月22日），原名宜伟，字沧白，客家人，广东梅县人，中国共产党和中华人民共和国政治人物，原正国级领导人，革命者，军事将领，為中华人民共和国开国和第二代主要领导人之一，中华人民共和国十大元帅之一，中国人民解放军和中华人民共和国的创建者和締造者之一，南昌起義的領導人之一。\n" },
  yeting: { name:"叶挺", char:"挺", nation:"中国", title:"新四军军长", desc:"你与叶挺最像——叶挺（1896—1946），北伐名将、新四军军长，皖南事变后长期囚禁，空难身亡。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Ye_Ting.jpg/330px-Ye_Ting.jpg", quote:"（铁军将领）", intro:"叶挺（1896—1946），北伐名将、新四军军长，皖南事变后长期囚禁，空难身亡。", bio:"叶挺（1896年9月10日—1946年4月8日），原名叶为询，字希夷，广东省惠州府歸善縣客家人，为北伐名将，亦為中國人民解放軍創始人之一。八一南昌起义前敌总指挥，新四军军长。叶挺先后在广东陆军小学、武昌陆军第二预备学校和保定陆军军官学校毕业，后参加建国粤军，参与粤桂战争，任工兵营副营长。1921年，调任孙中山之建国陆海军大元帅府警卫团第二营营长。1924年，" },
  yudafu: { name:"郁达夫", char:"郁", nation:"中国", title:"作家", desc:"你与郁达夫最像——郁达夫（1896—1945），作家，以自传体小说闻名，南洋抗日中遇害。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/%E9%83%81%E9%81%94%E5%A4%AB-1.jpg/330px-%E9%83%81%E9%81%94%E5%A4%AB-1.jpg", quote:"祖国啊祖国，你是我的母亲", intro:"郁达夫（1896—1945），作家，以自传体小说闻名，南洋抗日中遇害。", bio:"郁達夫（1896年12月7日—1945年9月17日失踪），名文，字達夫，以字行，浙江富陽人，中國近代小說家、散文家、詩人，创造社成员。\n" },
  yuan: { name:"袁世凯", char:"袁", nation:"中国", title:"北洋领袖", desc:"你精于权谋、手腕高超，善于在乱局中审时度势、把握机会。你重实力与实效、野心勃勃，是现实主义与机会主义的化身。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/YuanShikaiPresidente1915.jpg/330px-YuanShikaiPresidente1915.jpg", quote:"乱世枭雄，审时度势，重实力而轻名分", intro:"袁世凯（1859—1916），北洋军阀领袖，清末练兵、民国总统，后复辟帝制失败。", bio:"袁世凱（1859年9月16日—1916年6月6日），字慰廷、慰庭或慰亭，號容庵，又稱袁宮保、袁大炮、袁老四、袁大帥，因出身河南項城亦被稱為袁項城。曾任清朝直隸總督、军机大臣、内阁總理大臣，第二任中华民国臨時大總統，第一任中华民国大总统等，曾擬任中華帝國皇帝。他也是北洋政府最高領導人、北洋軍首领。\n" },
  zhantianyou: { name:"詹天佑", char:"詹", nation:"中国", title:"铁路工程师", desc:"你与詹天佑最像——詹天佑（1861—1919），铁路工程师，主持修建京张铁路，中国铁路之父。", img:"https://upload.wikimedia.org/wikipedia/commons/8/81/1918%E5%B9%B4%E8%A9%B9%E5%A4%A9%E4%BD%91.jpg", quote:"各出所学，各尽所知，使国家富强", intro:"詹天佑（1861—1919），铁路工程师，主持修建京张铁路，中国铁路之父。", bio:"詹天佑（1861年4月26日—1919年4月24日），字眷誠，號達潮，男，廣東省廣州府南海县（今广州市荔湾区）人，祖籍安徽省徽州府婺源县，中國首位鐵路总工程師，負責修建了京張鐵路等诸多工程，有「中國鐵路之父」、「中國近代工程之父」之稱。詹天佑是首批中國留美幼童之一，美國耶魯大學哲學學士（Ph.B），香港大學荣誉法学博士，英国土木工程师学会会员（首位加入国际学" },
  zhangailing: { name:"张爱玲", char:"爱", nation:"中国", title:"作家", desc:"你与张爱玲最像——张爱玲（1920—1995），作家，以《倾城之恋》等作品描绘都市情感与人性。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/1944%E5%B9%B4%E7%9A%84%E5%BC%A0%E7%88%B1%E7%8E%B2.jpg/330px-1944%E5%B9%B4%E7%9A%84%E5%BC%A0%E7%88%B1%E7%8E%B2.jpg", quote:"生命是一袭华美的袍，爬满了虱子", intro:"张爱玲（1920—1995），作家，以《倾城之恋》等作品描绘都市情感与人性。", bio:"張愛玲（1920年9月30日—1995年9月8日），本名張煐，筆名梁京等，祖籍河北丰润，出生于上海，中国现代著名散文家、小说家、剧本作家、剧本评论家。1943年至1945年間，她在上海文壇蜚声。1952年，她遷居香港，後又遷居美國。1960年代末至1970年代初，她的作品被夏志清等學者重新發掘，令她成为华语世界最受欢迎和推崇的作家之一。\n" },
  zhangguotao: { name:"张国焘", char:"焘", nation:"中国", title:"叛徒", desc:"你与张国焘最像——张国焘（1897—1979），中共早期领导人，后分裂红军、叛逃国民党。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Zhang_Guotao3.jpg/330px-Zhang_Guotao3.jpg", quote:"（分裂红军）", intro:"张国焘（1897—1979），中共早期领导人，后分裂红军、叛逃国民党。", bio:"张国焘（1897年11月26日—1979年12月3日），字恺荫，又名特立，男，江西萍乡人，中国共产党創始人之一，中共早期领导人之一。張國燾在中共黨內資歷很深，長征中张国焘領導的红四方面军的實力在中央紅軍之上。\n" },
  zhangjian: { name:"张謇", char:"謇", nation:"中国", title:"状元实业家", desc:"你与张謇最像——张謇（1853—1926），清末状元，弃官从商，创办大生纱厂，倡导实业教育。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Zhang_Jian.jpg/330px-Zhang_Jian.jpg", quote:"实业救国，教育兴国", intro:"张謇（1853—1926），清末状元，弃官从商，创办大生纱厂，倡导实业教育。", bio:"张謇（jiǎn）（1853年7月1日—1926年8月24日），字季直，号啬庵，生于今江苏海门，清末状元。中国近代实业家、政治家、教育家，主张“实业救国”。\n" },
  zhanglan: { name:"张澜", char:"澜", nation:"中国", title:"民主人士", desc:"你与张澜最像——张澜（1872—1955），民主人士、民盟创始人，新中国国家副主席。", img:"https://upload.wikimedia.org/wikipedia/commons/4/46/Zhang_Lan_1955.jpg", quote:"以民主与和平为己任", intro:"张澜（1872—1955），民主人士、民盟创始人，新中国国家副主席。", bio:"张澜（1872年4月2日—1955年2月9日），字表方，男，四川省順慶府南充县中和乡 人，中国民主革命家，中国民主同盟主席。中华人民共和国政治人物，原正国级领导人。\n" },
  zhanglingfu: { name:"张灵甫", char:"灵", nation:"中国", title:"整编74师师长", desc:"你与张灵甫最像——张灵甫（1903—1947），国民党将领，孟良崮战役中兵败身亡。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/%E5%BC%B5%E9%9D%88%E7%94%AB%E7%83%88%E5%A3%AB%E9%81%BA%E5%83%8F.png/330px-%E5%BC%B5%E9%9D%88%E7%94%AB%E7%83%88%E5%A3%AB%E9%81%BA%E5%83%8F.png", quote:"（孟良崮）", intro:"张灵甫（1903—1947），国民党将领，孟良崮战役中兵败身亡。", bio:"張靈甫（1903年8月20日—1947年5月16日），名鍾麟，字靈甫，男，後以字行。陝西西安人，黃埔軍校第四期畢業，中華民國國民革命軍将领。抗日戰爭时任职于國民革命軍第七十四軍所属部队，被蒋介石譽為「模範軍人」。抗日战争後任整编七十四师師長。1947年5月，在第二次国共内战的孟良崮战役中陣亡。\n" },
  zhangwentian: { name:"张闻天", char:"闻", nation:"中国", title:"革命家", desc:"你与张闻天最像——张闻天（1900—1976），革命家，遵义会议后一度主持中央工作。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Zhang_Wentian3.jpg/330px-Zhang_Wentian3.jpg", quote:"（遵义会议）", intro:"张闻天（1900—1976），革命家，遵义会议后一度主持中央工作。", bio:"张闻天（1900年8月30日—1976年7月1日），原名张应皋（也作张荫皋），字闻天，曾經长期使用化名洛甫，江苏省南汇县（今属上海市浦东新区）人，中国共产党、中华人民共和国政治人物，原副国级领导人。曾任中国共产党中央委员会总书记。中华人民共和国官方对其评价为：杰出的无产阶级革命家和理论家、忠诚的马克思主义者、中国共产党早期重要领导人。\n" },
  zhangxueliang: { name:"张学良", char:"良", nation:"中国", title:"少帅", desc:"你性情率真、重情重义，在历史关头以「西安事变」的兵谏扭转时局。你意气用事又心怀民族大义，是敢作敢当、亦正亦奇的性情中人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Chang_Shueliang.jpg/330px-Chang_Shueliang.jpg", quote:"愿为国家民族牺牲一切，亦忠亦义亦性情", intro:"张学良（1901—2001），东北军统帅，发动西安事变，促成抗日民族统一战线。", bio:"張學良（1901年6月3日—2001年10月14日），字汉卿，号毅庵，乳名双喜、小六子，奉天省海城縣（今遼寧省海城市）人，祖籍河北大城，中華民國陸軍一级上将和政治人物。其父为奉系军阀首领、中华民国陆海军大元帅张作霖。\n" },
  zhang: { name:"张之洞", char:"张", nation:"中国", title:"中体西用名臣", desc:"你稳健务实，主张「中学为体、西学为用」，在守成与变革间寻找平衡。你重视教育与实业，是渐进改良、脚踏实地的建设者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/%E5%BC%B5%E4%B9%8B%E6%B4%9E%E6%9C%9D%E6%9C%8D%E7%85%A7.jpg/330px-%E5%BC%B5%E4%B9%8B%E6%B4%9E%E6%9C%9D%E6%9C%8D%E7%85%A7.jpg", quote:"中学为体，西学为用", intro:"张之洞（1837—1909），晚清名臣、洋务派代表，主张「中学为体、西学为用」，创办汉阳铁厂等。", bio:"张之洞（1837年9月2日—1909年10月4日）。字孝达，一字香涛，号香岩，又号壶公、无竞居士，晚年自号抱冰，人称“张香帅”，直隶天津府南皮县（今河北省沧州市南皮县）人，晚清重臣。道光十七年八月初三生于贵州。咸丰二年（1852年）15岁中顺天乡试解元，同治二年（1863年）中進士第三名探花，據說是因為慈禧太后喜歡张之洞的文章，因此破例提拔，授翰林院编修。歷" },
  zhangzhizhong: { name:"张治中", char:"治", nation:"中国", title:"和平将军", desc:"你与张治中最像——张治中（1890—1969），国民党将领，以「和平将军」著称，主张国共和谈。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Zhang_Zhizhong2.jpg/330px-Zhang_Zhizhong2.jpg", quote:"（国共和谈）", intro:"张治中（1890—1969），国民党将领，以「和平将军」著称，主张国共和谈。", bio:"張治中（1890年10月27日—1969年4月6日），字文白，安徽廬州府巢縣人，中华人民共和国政治人物，原副国级领导人。國民革命军二級上將，曾任湖南省政府主席、国民政府軍事委員會政治部部長兼三民主义青年团书记长、新疆省政府主席，曾主導参與多次國共和談。1947年在原籍安徽省巢縣當選為第一屆國民大會代表。原为中國國民黨黨员，與政學系關係密切。1949年6月宣布" },
  zhangzizhong: { name:"张自忠", char:"忠", nation:"中国", title:"抗日名将", desc:"你与张自忠最像——张自忠（1891—1940），抗日名将，枣宜会战中壮烈殉国，为抗战牺牲的最高将领。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Tzu-Chung_Chang.jpg/330px-Tzu-Chung_Chang.jpg", quote:"我死则国生，我生则国死", intro:"张自忠（1891—1940），抗日名将，枣宜会战中壮烈殉国，为抗战牺牲的最高将领。", bio:"張自忠（1891年8月11日—1940年5月16日），字藎臣，後改藎忱，山東臨清直隸州唐園村人，中華民國陸軍二級上將，原為西北軍系將領，中原大戰後接受中央政府改編，轉任國民革命軍第二十九軍第三十八師師長，曾參與喜峰口戰鬥。\n" },
  zhangzuolin: { name:"张作霖", char:"霖", nation:"中国", title:"奉系军阀", desc:"你与张作霖最像——张作霖（1875—1928），奉系军阀首领，掌控东北，被日军炸死于皇姑屯。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Zhang_Zuo-lin.png/330px-Zhang_Zuo-lin.png", quote:"少养闲人，多办实业", intro:"张作霖（1875—1928），奉系军阀首领，掌控东北，被日军炸死于皇姑屯。", bio:"张作霖（1875年3月19日—1928年6月4日），字雨亭，乳名老疙瘩，民间喜人多以張大帥、雨帅称之，西方学术界则称其为奉天之虎，奉天省海城縣人。中华民国政治人物、奉系军阀首领，曾任中华民国陸海軍大元帥，于1919年至1928年逝世前，为实质掌控中国东北地区的最高领导人，号称「东北王」。\n" },
  zhangnaiqi: { name:"章乃器", char:"乃", nation:"中国", title:"民主人士", desc:"你与章乃器最像——章乃器（1897—1977），民主人士、经济学家，救国会「七君子」之一。", img:"https://upload.wikimedia.org/wikipedia/commons/2/2e/Zhang_Naiqi.jpg", quote:"（救国会）", intro:"章乃器（1897—1977），民主人士、经济学家，救国会「七君子」之一。", bio:"章乃器（1897年3月4日—1977年5月13日），原名章埏，字子伟、金锋，男，浙江青田人，中华民国及中华人民共和国政治人物，救国会“七君子”之一，中国民主建国会、中华全国工商业联合会创办人之一，中华人民共和国财经制度的主要创建者之一。在反右运动中被打成“大右派”，后获平反。\n" },
  zhangtaiyan: { name:"章太炎", char:"章", nation:"中国", title:"国学革命家", desc:"你与章太炎最像——章太炎（1869—1936），国学大师兼革命家，以激进思想与博学著称。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/%E7%AB%A0%E5%A4%AA%E7%82%8E.jpg/330px-%E7%AB%A0%E5%A4%AA%E7%82%8E.jpg", quote:"革命必须流血", intro:"章太炎（1869—1936），国学大师兼革命家，以激进思想与博学著称。", bio:"章太炎（1869年1月12日—1936年6月14日），原名學乘，字枚叔，一作梅叔。後易名为炳麟。因反清意识浓厚，慕顾绛的为人行事而改名为绛，号太炎。世人常称之为“太炎先生”。早年又號膏蘭室主人、劉子駿私淑弟子等。浙江餘杭人，清末民初思想家、史學家、樸学大师、民族主義革命家、注音符號設計者、中國醫學院首任院长，国粹派代表人物。\n" },
  zhaoyiman: { name:"赵一曼", char:"一", nation:"中国", title:"抗日女英雄", desc:"你与赵一曼最像——赵一曼（1905—1936），抗日女英雄，东北抗联战士，被俘后牺牲。", img:"https://upload.wikimedia.org/wikipedia/commons/e/e6/Zhao_Yiman.jpg", quote:"（白山黑水）", intro:"赵一曼（1905—1936），抗日女英雄，东北抗联战士，被俘后牺牲。", bio:"赵一曼（1905年10月25日—1936年8月2日），原名李坤泰，學名李一超，字淑宁，四川省宜宾县白花镇白花场村人，中國共產黨黨員，一位中國抗日烈士，在當時被日本傀儡政權滿洲國佔領的中國東北地區抗日戰爭中為爭取民族獨立而奮鬥。 她於1935年被日軍俘虜，並於1936年被處死。 她被視為中國的民族英雄，1950年，一部同名傳記電影為她拍攝。 2005年上映的電" },
  zhou: { name:"周恩来", char:"周", nation:"中国", title:"人民的总理", desc:"你温文尔雅、精明干练，善于协调各方、化解矛盾。你务实而顾全大局，把个人荣辱置于事业之下，是深孚众望的调和者与实干家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Zhou_Enlai_1972.jpg/330px-Zhou_Enlai_1972.jpg", quote:"为中华之崛起而读书", intro:"周恩来（1898—1976），新中国首任总理、杰出外交家，以务实稳健、鞠躬尽瘁著称。", bio:"周恩來（1898年3月5日—1976年1月8日），字翔宇，小名大鸾，祖籍浙江绍兴，生于江苏淮安。中国无产阶级革命家、政治家、军事家和外交家，中国共产党和中华人民共和国的主要领导人，中國人民解放軍的創建人之一。曾用过的笔名或化名包括飞飞、飞、伍豪、伍、周少山、少山、冠生、冠、维思、陈宽、胡必成、赵来、周翔、李知凡、大美、胡公、莫斯克文等。\n" },
  zhouzuoren: { name:"周作人", char:"作", nation:"中国", title:"散文家", desc:"你与周作人最像——周作人（1885—1967），散文家、鲁迅之弟，抗战中附逆出任伪职。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/%E5%8C%97%E5%A4%A7%E7%9A%84%E4%BA%BA%E7%89%A9%EF%BC%9A%E4%B8%AD%E5%9C%8B%E6%96%87%E5%AD%B8%E7%B3%BB%E6%95%99%E6%8E%88%E5%91%A8%E4%BD%9C%E4%BA%BA%E5%85%88%E7%94%9F.png/330px-%E5%8C%97%E5%A4%A7%E7%9A%84%E4%BA%BA%E7%89%A9%EF%BC%9A%E4%B8%AD%E5%9C%8B%E6%96%87%E5%AD%B8%E7%B3%BB%E6%95%99%E6%8E%88%E5%91%A8%E4%BD%9C%E4%BA%BA%E5%85%88%E7%94%9F.png", quote:"（平和冲淡）", intro:"周作人（1885—1967），散文家、鲁迅之弟，抗战中附逆出任伪职。", bio:"周作人（1885年1月16日—1967年5月6日），原名櫆寿（后改为奎绶），字星杓，又名启明、啟孟、起孟，筆名遐壽、仲密、豈明，号知堂、药堂等，书斋名苦雨斋，浙江紹興人，作家、翻译家。魯迅之弟，周建人之兄。新文化运动中参与编辑《新青年》，并曾任新潮社主任编辑。五四运动之后，与郑振铎、沈雁冰、叶绍钧、许地山等人发起成立“文学研究会”；又与鲁迅、林语堂、孙伏园等" },
  zhude: { name:"朱德", char:"朱", nation:"中国", title:"红军之父", desc:"你与朱德最像——朱德（1886—1976），中国人民解放军主要缔造者、十大元帅之首。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Zhu_De.jpg/330px-Zhu_De.jpg", quote:"革命到底", intro:"朱德（1886—1976），中国人民解放军主要缔造者、十大元帅之首。", bio:"朱德（1886年12月1日—1976年7月6日），原名朱代珍，曾用名建德，字玉阶，四川仪陇人，中国共产党和中华人民共和国政治人物，中华人民共和国元帅，原正国级领导人，為中国人民解放军和中华人民共和国的主要缔造者和創始人。\n" },
  zhuziqing: { name:"朱自清", char:"清", nation:"中国", title:"散文家", desc:"你与朱自清最像——朱自清（1898—1948），散文家，著《背影》《荷塘月色》，贫病而逝。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/%E6%9C%B1%E8%87%AA%E6%B8%85%E8%82%96%E5%83%8F.jpg/330px-%E6%9C%B1%E8%87%AA%E6%B8%85%E8%82%96%E5%83%8F.jpg", quote:"宁死不吃美国救济粮", intro:"朱自清（1898—1948），散文家，著《背影》《荷塘月色》，贫病而逝。", bio:"朱自清（1898年11月22日—1948年8月12日），原名自華，字佩弦，號實秋。生於江苏省连云港市东海县平明镇埠上村，籍贯浙江紹興，中華民國作家，以官話白話文的散文和新詩著稱，尤以散文《背影》、《荷塘月色》著名。曾任清華大學中國文學系主任。\n" },
  zurong: { name:"邹容", char:"邹", nation:"中国", title:"革命宣传家", desc:"你与邹容最像——邹容（1885—1905），革命宣传家，著《革命军》，病死狱中。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Zourong.jpg/330px-Zourong.jpg", quote:"革命者，除旧布新之谓也", intro:"邹容（1885—1905），革命宣传家，著《革命军》，病死狱中。", bio:"鄒（zōu） 容（1885年—1905年4月3日），原名紹陶，又名桂文，字蔚丹（一作威丹），生於四川省巴縣（今重慶市），曾經在留學日本時改名鄒容。是中國近代革命宣傳家，《革命軍》一書的作者。\n" },
  zuoquan: { name:"左权", char:"左", nation:"中国", title:"八路军参谋长", desc:"你与左权最像——左权（1905—1942），八路军副参谋长，抗战中壮烈殉国。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/%E5%B7%A6%E7%B4%80%E5%82%B3%E5%B0%87%E8%BB%8D.jpg/330px-%E5%B7%A6%E7%B4%80%E5%82%B3%E5%B0%87%E8%BB%8D.jpg", quote:"（抗日殉国）", intro:"左权（1905—1942），八路军副参谋长，抗战中壮烈殉国。", bio:"左权（1905年3月15日—1942年5月25日），原名左纪传，字孳麟，号叔仁，男，湖南醴陵人。中国共产党军事将领。\n" },
  zuo: { name:"左宗棠", char:"左", nation:"中国", title:"收复新疆名臣", desc:"你刚烈强硬、胆识过人，认准的事就一往无前。你重视民族尊严与疆土完整，敢于与强敌针锋相对，是铁骨铮铮的实干派。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Zuo_Zongtang_1875.jpg/330px-Zuo_Zongtang_1875.jpg", quote:"身无半亩，心忧天下；读破万卷，神交古人", intro:"左宗棠（1812—1885），晚清名臣、军事家，率军收复新疆，也是洋务运动的重要推动者。", bio:"左宗棠（1812年11月10日—1885年9月5日），字季高，号湘上农人，署名今亮，谥文襄，湖南湘阴人，晚清重臣、湘军將領、政治家、文學家、軍事家、外交家、實業家、改革家、詩人，洋务派代表人物之一。一生亲历了討伐太平天國、洋务运动、陕甘回变、新疆之役等重要中國历史事件。在中法戰爭馬尾海戰後，以欽差大臣之名重整湘軍督辦福建、臺灣海疆防務期間，病逝於福州，享壽7" },
  anami: { name:"阿南惟几", char:"阿", nation:"日本", title:"陆军大臣", desc:"你与阿南惟几最像——阿南惟几（1887—1945），日本末代陆军大臣，主张本土决战，战败后切腹。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/AnamiKorechika.jpg/330px-AnamiKorechika.jpg", quote:"（一亿玉碎）", intro:"阿南惟几（1887—1945），日本末代陆军大臣，主张本土决战，战败后切腹。", bio:"阿南惟幾，1945年4月，出任鈴木貫太郎內閣的陸軍大臣。\n" },
  kishi: { name:"岸信介", char:"岸", nation:"日本", title:"保守派首相", desc:"你精明强干、保守务实，坚定亲美反共、推进日美安保。你手腕老练、重秩序，是典型的保守派官僚政治家。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Nobusuke_Kishi_portrait.jpg/330px-Nobusuke_Kishi_portrait.jpg", quote:"亲美反共，以安保条约立国", intro:"岸信介（1896—1987），日本首相，推动修订《日美安保条约》，战后保守政治的代表。", bio:"岸信介，旧姓佐藤，日本政治人物，山口縣吉敷郡山口町（今山口縣山口市）人，曾擔任外務大臣（外相）、內閣總理大臣（首相）、自由民主黨總裁，有「昭和的妖怪」（昭和の妖怪）、「滿洲的妖怪」（満州の妖怪）之稱。\n" },
  shiratori: { name:"白鸟敏夫", char:"白", nation:"日本", title:"外交官", desc:"你与白鸟敏夫最像——白鸟敏夫（1887—1949），日本外交官，推动轴心国外交，被处无期徒刑。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/ShiratoriToshio.jpg/330px-ShiratoriToshio.jpg", quote:"（轴心外交）", intro:"白鸟敏夫（1887—1949），日本外交官，推动轴心国外交，被处无期徒刑。", bio:"白鸟敏夫，生于日本千叶县長生郡茂原町（現茂原市），毕业于东京大学法学部，日本帝国时代外交家，二战甲级战犯。\n" },
  longma: { name:"坂本龙马", char:"坂", nation:"日本", title:"维新志士", desc:"你开朗豁达、眼光超前，善于在敌对势力间斡旋、促成联合。你胸襟开阔、不囿于门户，是理想与行动兼备的开路人。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Sakamoto_Ryoma.jpg/330px-Sakamoto_Ryoma.jpg", quote:"洞察天下大势，促成萨长同盟", intro:"坂本龙马（1836—1867），日本幕末志士，促成萨长同盟、提出「船中八策」，是维新先驱。", bio:"坂本龍馬，最初叫直陰，本名是直柔，「龍馬」是通稱。出生於高知城下町本町筋一丁目，幕末時期的土佐藩鄉士。後來兩度脫藩而成為維新志士，與脫藩浪士組織日本第一個有限公司－龜山社中（後改為海援隊）。薩長同盟並非龍馬獨力促成。而由其向後藤象二郎所提出的船中八策，也成為後來維新政府的重要指導方針。死後，1891年（明治二十四年）4月8日由明治維新後的新政府追贈正四位。\n" },
  itagaki: { name:"板垣征四郎", char:"板", nation:"日本", title:"侵华陆军大将", desc:"你与板垣征四郎最像——板垣征四郎（1885—1948），日本陆军大将，侵华急先锋，战后被处绞刑。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Itagaki_Seishiro.jpg/330px-Itagaki_Seishiro.jpg", quote:"以武力经略大陆", intro:"板垣征四郎（1885—1948），日本陆军大将，侵华急先锋，战后被处绞刑。", bio:"板垣征四郎，远东国际军事法庭的甲级战犯。日本岩手人，大日本帝国陆军大将，历任关东军参谋长，陆军大臣、中国派遣军总参谋长、朝鲜军总司令、第七方面军总司令。九一八事变主要策划者之一，并与土肥原贤二策划建立了满洲国。第二次世界大战后，远东国际军事法庭东京审判中，被判处死刑，于1948年12月23日在东京巢鸭监狱被处决。\n" },
  kita: { name:"北一辉", char:"北", nation:"日本", title:"法西斯思想家", desc:"你与北一辉最像——北一辉（1883—1937），日本法西斯思想家，著《日本改造法案大纲》，被处决。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Kita_Ikki.jpg/330px-Kita_Ikki.jpg", quote:"（国家改造）", intro:"北一辉（1883—1937），日本法西斯思想家，著《日本改造法案大纲》，被处决。", bio:"北一辉（1883年4月3日—1937年8月19日），本名北輝次郎，別名北輝次，筆名外柔，男，思想家、社会活动家、政治哲学家，被稱為戰前日本法西斯主義運動的理論導師，以鼓吹日本革命聞名，對日本法西斯主義運動的推展有舉足輕重的影響力。他早年投身中國革命運動，是中國同盟會的正式會員。\n" },
  honjo: { name:"本庄繁", char:"本", nation:"日本", title:"关东军司令", desc:"你与本庄繁最像——本庄繁（1876—1945），日本关东军司令，九一八事变时指挥日军侵华。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Shigeru_Honjo.jpg/330px-Shigeru_Honjo.jpg", quote:"（九一八）", intro:"本庄繁（1876—1945），日本关东军司令，九一八事变时指挥日军侵华。", bio:"本庄繁，日本帝国时代的日军大将，男爵，二次大战甲級戰犯嫌疑者（未被起訴即自殺），九一八事变和侵占中国东北的主要策划者之一。\n" },
  shidehara: { name:"币原喜重郎", char:"币", nation:"日本", title:"外交首相", desc:"你与币原喜重郎最像——币原喜重郎（1872—1951），日本外交家、首相，主张协调外交与和平宪法。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Kijuro_shidehara.jpg/330px-Kijuro_shidehara.jpg", quote:"和平外交，协调列强", intro:"币原喜重郎（1872—1951），日本外交家、首相，主张协调外交与和平宪法。", bio:"幣原喜重郎男爵，日本政治人物、外交家，第44任內閣總理大臣，歷任日本駐荷蘭大使、外務次官、外務大臣、眾議院議長等職。\n" },
  ikeda: { name:"池田勇人", char:"池", nation:"日本", title:"经济首相", desc:"你温和务实、专注经济，以「收入倍增」让国家走向繁荣。你理性而平和，是把发展当作头等大事的建设者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Hayato_Ikeda_1962_%28cropped%29.jpg/330px-Hayato_Ikeda_1962_%28cropped%29.jpg", quote:"让国民收入倍增，让百姓过上好日子", intro:"池田勇人（1899—1965），日本首相，推行「国民收入倍增计划」，实现经济高速增长。", bio:"池田勇人，日本廣島縣豐田郡吉名村（今廣島縣竹原市）人，通商產業大臣、國務大臣、内閣總理大臣。\n" },
  kawabata: { name:"川端康成", char:"川", nation:"日本", title:"诺贝尔文学奖得主", desc:"你与川端康成最像——川端康成（1899—1972），日本作家，获诺贝尔文学奖，著《雪国》。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Kawabata_Yasunari_1968.jpg/330px-Kawabata_Yasunari_1968.jpg", quote:"凌晨四点钟，看到海棠花未眠", intro:"川端康成（1899—1972），日本作家，获诺贝尔文学奖，著《雪国》。", bio:"川端康成，世界知名的日本新感觉派作家、文學批評家，活躍於大正至昭和年間。川端康成在1960年代，曾8次被推薦諾貝爾文學獎名單，1968年成為首位日本人诺贝尔文学奖得主，也是繼羅賓德拉納特·泰戈爾之後第2位獲獎的亞洲作家。\n" },
  okawa: { name:"大川周明", char:"川", nation:"日本", title:"法西斯思想家", desc:"你与大川周明最像——大川周明（1886—1957），日本法西斯思想家，鼓吹亚洲门罗主义与侵略。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/OKAWA_Shumei.jpg/330px-OKAWA_Shumei.jpg", quote:"（国家主义）", intro:"大川周明（1886—1957），日本法西斯思想家，鼓吹亚洲门罗主义与侵略。", bio:"大川周明，出生於山形县酒田市，日本作家、军国主义者、排斥歐美的亚细亚主义者和印度教、伊斯兰教学者。二戰日本投降後，被東京軍事法庭列為甲級戰犯疑犯，後因被认定为患有精神病，予以不起訴處分。\n" },
  ohira: { name:"大平正芳", char:"大", nation:"日本", title:"首相", desc:"你与大平正芳最像——大平正芳（1910—1980），日本首相，推动环太平洋合作构想。", img:"https://upload.wikimedia.org/wikipedia/commons/7/7d/Masayoshi_Ohira_19790120.jpg", quote:"（环太平洋连带）", intro:"大平正芳（1910—1980），日本首相，推动环太平洋合作构想。", bio:"大平正芳，曾任日本內閣總理大臣，因心肌梗塞於任內病逝，由铃木善幸接任。\n" },
  osugi: { name:"大杉荣", char:"大", nation:"日本", title:"无政府主义者", desc:"你与大杉荣最像——大杉荣（1885—1923），日本无政府主义者，被宪兵杀害。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Sakae_Osugi.jpg/330px-Sakae_Osugi.jpg", quote:"（自由与反抗）", intro:"大杉荣（1885—1923），日本无政府主义者，被宪兵杀害。", bio:"大杉荣, 日本明治、大正时期社会活动家，思想家、作家、无政府主义者。\n" },
  okuma: { name:"大隈重信", char:"隈", nation:"日本", title:"宪政先驱", desc:"你开明务实、热衷教育与民权，主张政党政治与宪政。你视野开阔、善用民意，是理性而进步的宪政主义者。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/OKUMA_Shigenobu.jpg/330px-OKUMA_Shigenobu.jpg", quote:"宪政与教育，是国家进步之基", intro:"大隈重信（1838—1922），日本政治家、首相，创办早稻田大学，主张政党政治与宪政。", bio:"大隈重信，幼名八太郎，是日本武士（佐賀藩藩士）、政治家、教育家。從一位大勳位侯爵。曾任參議兼財務大臣、外務大臣（第3、4、11、14、29任）、農商務大臣（第13任）、內閣總理大臣（第8、17任）、內務大臣（第30、32任）、貴族院議員。為早稻田大學的創校者，並任該校第一任校長。\n" },
  onishi: { name:"大西泷治郎", char:"大", nation:"日本", title:"神风特攻始作俑者", desc:"你与大西泷治郎最像——大西泷治郎（1891—1945），日本海军中将，创立神风特攻队，战后切腹。", img:"https://upload.wikimedia.org/wikipedia/commons/f/f7/Takijiro_Onishi.jpg", quote:"（神风特攻）", intro:"大西泷治郎（1891—1945），日本海军中将，创立神风特攻队，战后切腹。", bio:"大西瀧治郎 是日本海軍將領，兵庫縣出身，海軍兵學校40期，最終軍階為海軍中將。歷任第一航空艦隊長官、軍令部次長等職。神風特攻隊創始者。\n" },
  taisho: { name:"大正天皇", char:"大", nation:"日本", title:"大正天皇", desc:"你与大正天皇最像——大正天皇（1879—1926），日本第123代天皇，在位期间日本实行大正民主。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Emperor_Taish%C5%8D.jpg/330px-Emperor_Taish%C5%8D.jpg", quote:"（象征天皇）", intro:"大正天皇（1879—1926），日本第123代天皇，在位期间日本实行大正民主。", bio:"大正天皇，是日本第123代天皇（1912年7月30日—1926年12月25日在位）。大日本帝国第2代大元帅（1912年－1926年在任），名嘉仁，明治天皇之子， 昭和天皇之父。生母是典侍柳原愛子。出生时称号为明宫，徽印印号为寿。见证了日本从工业化世界强国向国际列强四大国的转变。嘉仁在位期间，日本继续推进现代化，与列强保持外交关系，并参与第一次世界大战，带领日" },
